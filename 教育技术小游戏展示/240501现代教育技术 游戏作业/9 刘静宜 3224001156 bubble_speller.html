<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>Word Wheel - Spelling Game</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;user-select:none}
html,body{width:100%;height:100%;overflow:hidden;font-family:'Comic Sans MS','Marker Felt',sans-serif;background:#1a3a5a}
canvas{display:block}
.overlay{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(20,40,80,.9);z-index:50;padding:24px;text-align:center}
.overlay h1{font-size:46px;color:#ffd977;margin-bottom:8px;text-shadow:0 2px 12px rgba(255,180,60,.6)}
.overlay h2{font-size:22px;color:#fff;margin-bottom:8px}
.overlay .hint{color:#9fc3ea;margin:12px 0;max-width:520px;line-height:1.7;font-size:15px}
.btn{margin-top:18px;padding:14px 40px;font-size:18px;font-weight:bold;color:#3a2a10;background:linear-gradient(180deg,#ffe08a,#f5b942);border:none;border-radius:32px;cursor:pointer;letter-spacing:2px;box-shadow:0 4px 20px rgba(245,185,66,.5)}
.btn:active{transform:scale(.95)}
.btn.ghost{background:transparent;color:#ffd977;border:2px solid #ffd977;box-shadow:none;margin-top:10px;font-size:14px;padding:8px 20px}
#hud{position:fixed;top:10px;left:10px;display:none;gap:8px;z-index:20;font-weight:bold;color:#fff;font-size:14px;text-shadow:0 1px 4px rgba(0,0,0,.6);flex-wrap:wrap;max-width:340px}
#hud .chip{background:rgba(0,0,0,.4);border:2px solid rgba(255,255,255,.3);border-radius:16px;padding:3px 12px}
#hud .bar{width:130px;height:10px;background:rgba(0,0,0,.5);border-radius:5px;overflow:hidden;border:2px solid rgba(255,255,255,.3)}
#hud .bar > div{height:100%;background:linear-gradient(90deg,#ff7a7a,#ffd977,#7fe08c);transition:width .3s}
#ctrls{position:fixed;right:14px;bottom:14px;display:none;flex-direction:column;gap:8px;z-index:20}
#ctrls button{padding:10px 20px;font-weight:bold;border:none;border-radius:20px;cursor:pointer;font-size:14px;box-shadow:0 2px 10px rgba(0,0,0,.4);transition:.15s}
#hbtn{background:linear-gradient(180deg,#a29bfe,#6c5ce7);color:#fff}
#hbtn:hover:not(:disabled){transform:scale(1.05)}
#hbtn:disabled{background:#444;color:#777;cursor:not-allowed;opacity:.5}
#pbtn{background:linear-gradient(180deg,#ffe08a,#f5b942);color:#3a2a10}
#toast{position:fixed;top:70px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.6);padding:8px 22px;border-radius:18px;font-size:16px;z-index:30;display:none;color:#ffe6a3;font-weight:bold}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="hud">
  <span class="chip" id="lv">L1</span>
  <span class="chip" id="sc">Score 0</span>
  <span class="chip" id="lives">❤❤❤</span>
  <span class="chip" id="hintChip">💡 3</span>
  <span class="bar"><div id="bar"></div></span>
</div>
<div id="ctrls">
  <button id="hbtn">💡 HINT</button>
  <button id="pbtn">⏸ PAUSE</button>
</div>
<div id="toast"></div>
<div class="overlay" id="ov"></div>

<script>
(function(){
  var cv=document.getElementById('cv'), ctx=cv.getContext('2d');
  var ov=document.getElementById('ov'), hud=document.getElementById('hud'), ctrls=document.getElementById('ctrls');
  var lv=document.getElementById('lv'), sc=document.getElementById('sc'), livesEl=document.getElementById('lives');
  var bar=document.getElementById('bar'), toastEl=document.getElementById('toast');
  var hintChip=document.getElementById('hintChip'), hbtn=document.getElementById('hbtn'), pbtn=document.getElementById('pbtn');

  var W=0,H=0,DPR=1;
  function resize(){
    DPR=Math.min(window.devicePixelRatio||1,2);
    W=window.innerWidth; H=window.innerHeight;
    cv.width=W*DPR; cv.height=H*DPR;
    cv.style.width=W+'px'; cv.style.height=H+'px';
    ctx.setTransform(DPR,0,0,DPR,0,0);
  }
  window.addEventListener('resize',resize); resize();

  // ========== WORDS ==========
  var LEVELS=[
    [ {w:'cat',h:'A pet that says meow'}, {w:'dog',h:'A pet that barks'}, {w:'sun',h:'Shines in the sky'},
      {w:'moon',h:'Glows at night'}, {w:'fish',h:'Swims in water'}, {w:'bird',h:'Flies in the sky'},
      {w:'tree',h:'Tall plant with leaves'}, {w:'book',h:'You read it'}, {w:'cake',h:'Sweet dessert'},
      {w:'milk',h:'White drink from cows'}, {w:'star',h:'Tiny lights at night'}, {w:'rain',h:'Water from clouds'} ],
    [ {w:'apple',h:'Red or green fruit'}, {w:'happy',h:'Feeling great joy'}, {w:'water',h:'You drink it'},
      {w:'school',h:'Where you learn'}, {w:'friend',h:'Someone you like'}, {w:'family',h:'Mom, dad, kids'},
      {w:'orange',h:'Color and fruit'}, {w:'purple',h:'A color'}, {w:'rabbit',h:'Hops with long ears'},
      {w:'flower',h:'Pretty plant part'}, {w:'dragon',h:'Big fire-breathing monster'}, {w:'garden',h:'Where plants grow'} ],
    [ {w:'rainbow',h:'Colorful arc in sky'}, {w:'elephant',h:'Big animal with trunk'}, {w:'birthday',h:'Party day every year'},
      {w:'computer',h:'Machine that thinks'}, {w:'mountain',h:'Very tall land'}, {w:'butterfly',h:'Pretty flying insect'},
      {w:'dinosaur',h:'Huge prehistoric animal'}, {w:'umbrella',h:'Keeps you dry in rain'}, {w:'chocolate',h:'Brown sweet treat'},
      {w:'kangaroo',h:'Australian jumping animal'}, {w:'adventure',h:'Exciting journey'}, {w:'wonderful',h:'Amazing, great'} ]
  ];
  var COLORS=['#ff6b6b','#ffd977','#7fe08c','#7fc9ff','#ff99cc','#c471ed','#ffa94d','#48dbfb','#fd79a8','#a29bfe','#55efc4','#ff7675'];

  // ========== STATE ==========
  var mx=0,my=0,down=false,justDown=false;
  var game={level:0,wordIdx:0,score:0,lives:3,stage:'start',hints:3,paused:false};
  var letters=[]; // wheel letters (rebuilt each new word — safe, letters never run out)
  var wheelAngle=0;
  var targetWord='';
  var typedSoFar='';
  var popFx=[];
  var shakeTimer=0;
  var combo=0;
  var wheelRadius=0, wheelCx=0, wheelCy=0;
  var hintIdx=-1; // which letter to glow (-1 = none)

  // ========== INPUT ==========
  cv.addEventListener('pointerdown',function(e){
    var r=cv.getBoundingClientRect(); mx=e.clientX-r.left; my=e.clientY-r.top;
    down=true; justDown=true;
  });
  cv.addEventListener('pointerup',function(){ down=false; });
  function dd(x1,y1,x2,y2,r){ var dx=x1-x2,dy=y1-y2; return dx*dx+dy*dy<r*r; }

  function toast(msg,color){
    toastEl.textContent=msg; toastEl.style.color=color||'#ffe6a3'; toastEl.style.display='block';
    clearTimeout(toastEl._t); toastEl._t=setTimeout(function(){toastEl.style.display='none';},1100);
  }

  // ========== BUILD WHEEL (per word, letters reset every word — NO MORE BUG) ==========
  function buildWheel(){
    wheelRadius=Math.min(W,H)*0.38;
    wheelCx=W/2; wheelCy=H*0.58;
    letters=[];
    // current word letters + distractors
    var pool=targetWord.split('');
    var alphabet='abcdefghijklmnopqrstuvwxyz';
    while(pool.length<18){ pool.push(alphabet[Math.floor(Math.random()*26)]); }
    // shuffle
    for(var i=pool.length-1;i>0;i--){
      var j=Math.floor(Math.random()*(i+1));
      var tmp=pool[i];pool[i]=pool[j];pool[j]=tmp;
    }
    var n=pool.length;
    for(var i=0;i<n;i++){
      letters.push({ letter:pool[i], color:COLORS[i%COLORS.length], dead:false, idx:i, angle:(i/n)*Math.PI*2 });
    }
    hintIdx=-1;
  }

  // ========== DRAW ==========
  function drawBg(t){
    var g=ctx.createLinearGradient(0,0,0,H);
    g.addColorStop(0,'#2c3e80'); g.addColorStop(0.5,'#1a3a5a'); g.addColorStop(1,'#0f2240');
    ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
    // stars
    ctx.fillStyle='#fff';
    for(var i=0;i<50;i++){
      var sx=(i*137+Math.sin(t*0.0005+i)*10)%W;
      var sy=(i*79)%(H*0.4);
      ctx.globalAlpha=0.3+Math.sin(t*0.002+i)*0.3+0.3;
      ctx.beginPath(); ctx.arc(sx,sy,1.5,0,Math.PI*2); ctx.fill();
    }
    ctx.globalAlpha=1;
    // glow
    var rg=ctx.createRadialGradient(wheelCx,wheelCy,wheelRadius*0.3,wheelCx,wheelCy,wheelRadius*1.4);
    rg.addColorStop(0,'rgba(127,201,255,.2)'); rg.addColorStop(1,'rgba(127,201,255,0)');
    ctx.fillStyle=rg; ctx.beginPath(); ctx.arc(wheelCx,wheelCy,wheelRadius*1.4,0,Math.PI*2); ctx.fill();
    if(shakeTimer>0){ shakeTimer-=0.04; ctx.translate((Math.random()-0.5)*10,(Math.random()-0.5)*10); }
  }

  function drawWheel(){
    ctx.save(); ctx.translate(wheelCx,wheelCy);
    // outer ring
    ctx.fillStyle='#34495e';
    ctx.beginPath(); ctx.arc(0,0,wheelRadius+18,0,Math.PI*2); ctx.fill();
    ctx.strokeStyle='#ffd977'; ctx.lineWidth=6;
    ctx.beginPath(); ctx.arc(0,0,wheelRadius+14,0,Math.PI*2); ctx.stroke();
    // body
    ctx.fillStyle='#ecf0f1';
    ctx.beginPath(); ctx.arc(0,0,wheelRadius,0,Math.PI*2); ctx.fill();
    // colored segments
    var n=letters.length;
    for(var i=0;i<n;i++){
      if(letters[i].dead) continue;
      var a1=wheelAngle+letters[i].angle-Math.PI/n;
      var a2=wheelAngle+letters[i].angle+Math.PI/n;
      ctx.fillStyle=letters[i].color; ctx.globalAlpha=0.6;
      ctx.beginPath(); ctx.moveTo(0,0); ctx.arc(0,0,wheelRadius,a1,a2); ctx.closePath(); ctx.fill();
    }
    ctx.globalAlpha=1;
    // center decoration (just pretty, NO click-to-pause!)
    ctx.fillStyle='#34495e';
    ctx.beginPath(); ctx.arc(0,0,wheelRadius*0.25,0,Math.PI*2); ctx.fill();
    ctx.strokeStyle='#ffd977'; ctx.lineWidth=3;
    ctx.beginPath(); ctx.arc(0,0,wheelRadius*0.25,0,Math.PI*2); ctx.stroke();
    ctx.fillStyle='#ffd977'; ctx.font='bold 13px sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText('🎡',0,1); ctx.textAlign='left';
    // letters
    for(var i=0;i<n;i++){ var L=letters[i];
      if(L.dead) continue;
      var ang=wheelAngle+L.angle;
      var x=Math.cos(ang)*(wheelRadius*0.64);
      var y=Math.sin(ang)*(wheelRadius*0.64);
      ctx.save(); ctx.translate(x,y);
      if(hintIdx===L.idx){ ctx.shadowColor='#ffd977'; ctx.shadowBlur=25; }
      ctx.fillStyle=L.color;
      ctx.beginPath(); ctx.arc(0,0,26,0,Math.PI*2); ctx.fill();
      ctx.strokeStyle='#fff'; ctx.lineWidth=3; ctx.stroke();
      ctx.fillStyle='rgba(255,255,255,.35)';
      ctx.beginPath(); ctx.arc(-8,-10,10,0,Math.PI*2); ctx.fill();
      ctx.fillStyle='#fff';
      ctx.font='bold 28px sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.shadowColor='rgba(0,0,0,.4)'; ctx.shadowBlur=3;
      ctx.fillText(L.letter.toUpperCase(),0,1);
      ctx.shadowBlur=0;
      ctx.restore();
    }
    // top pointer
    ctx.fillStyle='#ff4444';
    ctx.beginPath(); ctx.moveTo(0,wheelRadius+14); ctx.lineTo(-14,wheelRadius+40); ctx.lineTo(14,wheelRadius+40); ctx.closePath(); ctx.fill();
    ctx.strokeStyle='#fff'; ctx.lineWidth=3; ctx.stroke();
    ctx.restore();
  }

  function drawTarget(){
    var x=W/2, y=H*0.17;
    var boxW=Math.min(42, Math.floor((W-40)/(targetWord.length+2))), gap=8;
    var totalW=targetWord.length*(boxW+gap)-gap;
    ctx.fillStyle='rgba(255,255,255,.12)';
    ctx.fillRect(x-totalW/2-14,y-26,totalW+28,52);
    for(var i=0;i<targetWord.length;i++){
      var bx=x-totalW/2+i*(boxW+gap);
      if(i<typedSoFar.length){
        ctx.fillStyle='#7fe08c'; ctx.fillRect(bx,y-16,boxW,32);
        ctx.fillStyle='#fff'; ctx.font='bold '+(boxW*0.7)+'px sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
        ctx.fillText(targetWord[i].toUpperCase(), bx+boxW/2, y);
      } else {
        ctx.strokeStyle='#ffd977'; ctx.lineWidth=3; ctx.setLineDash([4,3]); ctx.strokeRect(bx,y-16,boxW,32); ctx.setLineDash([]);
        ctx.fillStyle='#ffd977'; ctx.font='bold '+(boxW*0.6)+'px sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
        ctx.fillText('?', bx+boxW/2, y);
      }
    }
    ctx.textAlign='left';
    // hint
    var hint=LEVELS[game.level][game.wordIdx].h;
    ctx.font='14px sans-serif'; ctx.textAlign='center';
    ctx.fillStyle='rgba(255,255,255,.75)';
    ctx.fillText('💡 '+hint, W/2, H*0.24);
    ctx.fillStyle='#ffd977'; ctx.font='13px sans-serif';
    ctx.fillText('Word '+(game.wordIdx+1)+' / '+LEVELS[game.level].length, W/2, H*0.29);
    ctx.textAlign='left';
  }

  function drawPopFx(){
    for(var i=popFx.length-1;i>=0;i--){ var p=popFx[i];
      p.t+=0.03;
      if(p.t>1){ popFx.splice(i,1); continue; }
      ctx.save(); ctx.globalAlpha=1-p.t; ctx.fillStyle=p.color;
      for(var k=0;k<8;k++){
        var ang=(k/8)*Math.PI*2; var dist=p.t*55;
        ctx.beginPath(); ctx.arc(p.x+Math.cos(ang)*dist, p.y+Math.sin(ang)*dist, 4, 0, Math.PI*2); ctx.fill();
      }
      ctx.restore();
    }
  }

  // ========== CLICK ==========
  function checkClick(){
    hintIdx=-1; // clear hint glow on any click
    for(var i=0;i<letters.length;i++){ var L=letters[i];
      if(L.dead) continue;
      var ang=wheelAngle+L.angle;
      var bx=wheelCx+Math.cos(ang)*(wheelRadius*0.64);
      var by=wheelCy+Math.sin(ang)*(wheelRadius*0.64);
      if(dd(mx,my,bx,by,34)){ onLetterClick(L, bx, by); return; }
    }
    // nowhere useful clicked
  }

  function onLetterClick(L, bx, by){
    var next=targetWord[typedSoFar.length];
    if(L.letter.toLowerCase()===next){
      typedSoFar+=L.letter.toLowerCase();
      combo++;
      var bonus=Math.floor(combo/3)*5;
      game.score+=10+bonus;
      if(combo>=3) toast('🔥 Combo x'+combo+'!','#ffd977');
      else toast('✓ '+L.letter.toUpperCase(),'#7fe08c');
      L.dead=true;
      popFx.push({x:bx,y:by,color:L.color,t:0});
      bar.style.width=(typedSoFar.length/targetWord.length*100)+'%';
      sc.textContent='Score '+game.score;
      if(typedSoFar.length===targetWord.length){
        game.score+=20;
        toast('🎉 '+targetWord.toUpperCase()+'! +30','#ffd977');
        setTimeout(function(){
          game.wordIdx++;
          if(game.wordIdx>=LEVELS[game.level].length){
            setTimeout(function(){
              if(game.level+1>=LEVELS.length){ showWin(); }
              else { game.level++; game.wordIdx=0; showLevelIntro(); }
            },800);
          } else { startWord(); }
        },850);
      }
    } else {
      combo=0; game.lives--; shakeTimer=1;
      toast('✗ Not '+L.letter.toUpperCase(),'#ff7a7a');
      L.dead=true;
      popFx.push({x:bx,y:by,color:'#ff7a7a',t:0});
      updateLives();
      if(game.lives<=0){ setTimeout(showGameOver,700); }
    }
  }

  // ========== HINT / PAUSE ==========
  function useHint(){
    if(game.hints<=0){ toast('No hints left!','#ff7a7a'); return; }
    var needed=targetWord[typedSoFar.length].toLowerCase();
    // find this letter on the wheel (alive)
    for(var i=0;i<letters.length;i++){
      if(!letters[i].dead && letters[i].letter.toLowerCase()===needed){
        hintIdx=letters[i].idx;
        game.hints--;
        hintChip.textContent='💡 '+game.hints;
        hbtn.disabled=(game.hints<=0);
        toast('✨ Find '+needed.toUpperCase(),'#a29bfe');
        setTimeout(function(){ if(hintIdx===letters[i].idx) hintIdx=-1; },2000);
        return;
      }
    }
    // letter not alive — spin wheel
    toast('Keep spinning... it will come around!','#ffd977');
  }

  function togglePause(){
    game.paused=!game.paused;
    pbtn.textContent = game.paused ? '▶ PLAY' : '⏸ PAUSE';
    wheelAngle=wheelAngle; // no change needed, we just skip increment in loop
    toast(game.paused?'⏸ Paused':'▶ Spinning','#ffd977');
  }

  function updateLives(){
    var s=''; for(var i=0;i<3;i++) s+= i<game.lives?'❤':'🖤';
    livesEl.textContent=s;
  }

  // ========== FLOW ==========
  function showStart(){
    hud.style.display='none'; ctrls.style.display='none'; game.stage='start';
    ov.innerHTML='<h1>🎡 Word Wheel</h1>'+
      '<h2>Spin · Spell · Win!</h2>'+
      '<div class="hint">Letters slowly spin on a colorful wheel.<br>Click letters IN ORDER to spell the hidden word.<br>💡 HINT button glows the next letter!<br>3 wrong = game over. 36 words total!</div>'+
      '<button class="btn" id="goBtn">▶ Play</button>';
    document.getElementById('goBtn').onclick=function(){ game.level=0; game.wordIdx=0; game.score=0; game.lives=3; game.hints=3; showLevelIntro(); };
  }

  function showLevelIntro(){
    hud.style.display='none'; ctrls.style.display='none'; game.stage='intro';
    var titles=['🌱 Easy Peasy','🌟 Getting Smarter','🚀 Word Master'];
    var wordList=LEVELS[game.level].map(function(w){return w.w.toUpperCase();}).join(' · ');
    ov.innerHTML='<h1>'+titles[game.level]+'</h1>'+
      '<h2>Level '+(game.level+1)+' — 12 words</h2>'+
      '<div class="hint" style="color:#ffd977">'+wordList+'</div>'+
      '<button class="btn" id="goBtn">▶ Start</button>';
    document.getElementById('goBtn').onclick=function(){ startWord(); };
  }

  function startWord(){
    game.stage='playing'; hud.style.display='flex'; ctrls.style.display='flex';
    game.paused=false; pbtn.textContent='⏸ PAUSE';
    targetWord=LEVELS[game.level][game.wordIdx].w;
    typedSoFar=''; combo=0; popFx=[]; hintIdx=-1; wheelAngle=0;
    buildWheel();
    lv.textContent='L'+(game.level+1)+'-'+(game.wordIdx+1);
    sc.textContent='Score '+game.score;
    updateLives();
    hintChip.textContent='💡 '+game.hints;
    hbtn.disabled=(game.hints<=0);
    bar.style.width='0%';
    ov.style.display='none';
  }

  function showGameOver(){
    game.stage='over'; hud.style.display='none'; ctrls.style.display='none';
    ov.innerHTML='<h1>💥 Game Over</h1>'+
      '<h2>Final Score: '+game.score+'</h2>'+
      '<div class="hint">Good try! The wheel awaits you.</div>'+
      '<button class="btn" id="again">▶ Try Again</button>';
    document.getElementById('again').onclick=showStart;
  }

  function showWin(){
    game.stage='win'; hud.style.display='none'; ctrls.style.display='none';
    ov.innerHTML='<h1>🏆 Champion!</h1>'+
      '<h2>Mastered all 36 words</h2>'+
      '<div class="hint">Score: '+game.score+'<br>You are a Wheel Spelling Champion!</div>'+
      '<button class="btn" id="again">▶ Play Again</button>';
    document.getElementById('again').onclick=showStart;
  }

  // ========== BUTTONS ==========
  hbtn.onclick=function(){ if(game.stage==='playing') useHint(); };
  pbtn.onclick=function(){ if(game.stage==='playing') togglePause(); };

  // ========== MAIN LOOP ==========
  function loop(t){
    ctx.clearRect(0,0,W,H);
    drawBg(t);
    if(game.stage==='playing'){
      if(!game.paused) wheelAngle+=0.005;
      drawWheel();
      drawTarget();
      drawPopFx();
      if(justDown){ checkClick(); justDown=false; }
    }
    requestAnimationFrame(loop);
  }

  showStart();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>

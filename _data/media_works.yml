  - id: chinese-passenger
    group: short-film
    title:
      zh: 普快列车
      en: Chinese Passenger
    format:
      zh: 实验短片
      en: Experimental short film
    production_period:
      zh: 2017年（澳门大学硕士阶段）
      en: 2017 (during the MA period at the University of Macau)
    description:
      zh: 半梦半醒间，小狄在普快列车的连接处睡着了。梦中，车厢、站台、旧物与陌生旅人交替出现，一段关于离开、等待与归来的内心旅程，随着列车向前展开。影片以梦境般的车厢漫游，触碰中国内地移民经验中的漂泊、记忆与未说出口的告别。
      en: Half awake and half dreaming, Xiao Di falls asleep in the passage between carriages on an ordinary fast train. In the dream, carriages, platforms, objects and passing strangers drift into one another, turning the journey into an inward passage through departure, waiting and return. Moving through the train like a reverie, the film approaches the experience of Chinese inland migrants through displacement, memory and unspoken farewells.
    recognition:
      zh: 入围／展映：澳门国际电影节短片单元（2017）
      en: Shortlisted / selected for the Macao International Film Festival short film section (2017).
    cover: /assets/img/media/chinese-passenger/poster.jpg
    cover_width: 1400
    cover_height: 1980
    action:
      zh: 查看海报与剧照
      en: View the poster and stills
    poster:
      zh: /assets/img/media/chinese-passenger/poster.jpg
      en: /assets/img/media/chinese-passenger/poster.jpg
    video:
      trailer:
        path: /assets/video/media/chinese-passenger/chinese-passenger-trailer-v3-720p.mp4
        label:
          zh: 普快列车预告片（720p）
          en: Chinese Passenger trailer (720p)
      film_note:
        zh: 完整影片约38分钟。高清与720p文件保存在外置归档中；网站暂以预告片和剧照展示，完整片可通过私密链接提供。需要观看链接，请联系作者。
        en: The complete film runs for approximately 38 minutes. The high-resolution and 720p files are preserved in the external archive; this page currently presents the trailer and stills, while the complete film can be shared through a private viewing link. Please contact the author for access.

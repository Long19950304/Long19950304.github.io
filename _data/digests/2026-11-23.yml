- title: Salt Lake Lithium Project Reports Stable Output
  title_zh: 察尔汗盐湖锂项目产量与工艺优化进展
  url: https://www.chinanews.com.cn/cj/2026/11-22/10736161.shtml
  published: '2026-11-22T19:41:21+08:00'
  source: 中国新闻网财经
  category: Business & economy
  source_id: chinanews-finance
  authority: news_agency
  publisher_id: chinanews-finance
  coverage: china
  why: China News Service reports that Qinghai Salt Lake Industry’s lithium project
    produced more than 40,000 tonnes of battery-grade lithium carbonate after entering
    production in September 2025. The company said the output could meet battery-material
    needs for about 800,000 new-energy vehicles, while process optimisation reduced
    resource consumption.
  why_zh: 中国新闻网财经报道，青海盐湖工业称其4万吨碳酸锂项目自2025年9月28日投料投产以来，累计产出电池级碳酸锂超4万吨。公司称，工艺优化后项目年电力消耗较初始设计指标下降超四成。
- title: U.S. Pizza Chains Face Demand Pressure
  title_zh: 美国披萨连锁面临需求压力
  url: https://www.cnbc.com/2026/11/22/pizza-chains-sales-glp-1-demand.html
  published: '2026-11-22T13:00:01+00:00'
  source: CNBC Business
  category: Business & economy
  source_id: cnbc-business
  authority: established_newsroom
  publisher_id: cnbc-business
  coverage: world
  why: CNBC reports that weaker discretionary spending, wider delivery choices, and
    changing eating preferences are pressuring major U.S. pizza chains. Sales slipped
    in 2025, though the evidence does not isolate how much each factor contributed.
  why_zh: CNBC报道称，可选消费趋弱、外卖选择增加及饮食偏好变化正给美国大型披萨连锁带来压力。2025年行业销售下滑，但现有证据无法分离各因素的贡献。
- title: Genetic lineages reshape pine conservation
  title_zh: 华南五针松复合体保护研究重新界定遗传谱系
  url: https://www.cas.cn/syky/202611/t20261118_5124531.shtml
  published: '2026-11-23T11:12:00+08:00'
  source: 中国科学院科研进展
  category: Science & research
  source_id: cas-research
  authority: research_primary
  publisher_id: cas-research
  coverage: china
  why: The Chinese Academy of Sciences reports that transcriptome and DNA-marker analysis
    identified three highly divergent genetic lineages within the South China five-needle
    pine complex. Its model also flags groups in the western range margin, Hainan
    Island, and Da Lat as having higher future genomic vulnerability.
  why_zh: 中国科学院称，转录组测序与DNA标记分析显示华南五针松复合体应分为EAST、WEST和PDAL三个遗传谱系。其模型还预测，分布区西缘、海南岛和越南大叻的群体未来基因组脆弱性较高。
- title: Arctic Laser Station Advances Satellite Tracking
  title_zh: 北极激光测距站推进卫星跟踪
  url: https://science.nasa.gov/earth/earth-observatory/laser-focus-at-the-top-of-the-world
  published: '2026-11-23T05:01:00+00:00'
  source: NASA
  category: Science & research
  source_id: nasa
  authority: research_primary
  publisher_id: nasa
  coverage: world
  why: NASA reports that a faster, more precise satellite laser ranging system began
    operating at the Ny-Ålesund Geodetic Observatory in October 2026. The station
    is designed to strengthen the global tracking network and gather more observations
    of polar-orbiting satellites.
  why_zh: NASA报告称，更快、更精确的卫星激光测距系统已于2026年10月在挪威斯瓦尔巴群岛的尼奥勒松大地测量天文台投入运行。该站旨在增强全球跟踪网络，并增加对极轨卫星的观测。
- title: A Smaller AI Model for Analog Chip Design
  title_zh: 更小的模型协助模拟芯片设计
  url: https://news.mit.edu/2026/ai-driven-technique-could-help-engineers-design-analog-chips-faster-and-less-expensive-1123
  published: '2026-11-23T05:00:00+00:00'
  source: MIT News
  category: Science & research
  source_id: mit-news
  authority: research_primary
  publisher_id: mit-news
  coverage: world
  why: MIT News reports that a locally deployable small language model trained with
    SLIC can perform analog circuit design competitively with larger, resource-intensive
    models. The research suggests a route to faster, more private and customizable
    chip-design workflows, though reported results remain specific to the researchers’
    tests.
  why_zh: MIT News 报道，一种名为 SLIC 的训练方法可让本地部署的小型语言模型参与模拟电路设计，并在研究团队的测试中接近最新大型模型的性能。该方法强调较低计算资源和数据本地使用，但结果仅适用于已报告的测试范围。

<style>
:root{
  --gold:#ffcf3f; --gold2:#f0a81b; --deep:#2a1608; --wood:#5b3316;
  --cream:#fff3d2; --line:#c99a4f;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  background:radial-gradient(circle at 50% -10%,#4a2e15,#1a0f07 65%,#0d0703);
  font-family:"Microsoft YaHei","PingFang SC","Segoe UI",sans-serif;
  color:#3a2109;display:flex;align-items:center;justify-content:center;
  padding:16px;overflow:auto;
}
.stage{
  position:relative;width:min(1120px,96vw,calc((100vh - 34px) * 1.6));
  aspect-ratio:1120/700;border-radius:16px;overflow:hidden;
  box-shadow:0 26px 70px rgba(0,0,0,.75),0 0 0 5px #241207,0 0 0 8px #6b431f;
  background:#87ceeb;user-select:none;
}
canvas{display:block;width:100%;height:100%}

/* ---------- HUD ---------- */
.hud{position:absolute;inset:0;pointer-events:none;font-size:clamp(9px,1.05vw,15px)}
.panel{
  position:absolute;background:linear-gradient(180deg,rgba(66,37,14,.93),rgba(32,16,5,.95));
  border:2px solid #a9793c;border-radius:13px;color:#ffe9b8;
  box-shadow:0 8px 22px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,225,160,.28);
  padding:.65em .9em;
}
.hud-left{top:12px;left:12px;width:16em}
.hud-right{top:12px;right:12px;width:17em;text-align:center}
.hud-row{display:flex;align-items:center;justify-content:space-between;gap:.4em}
.level-tag{font-weight:700;color:#ffd76a;letter-spacing:.02em}
.icon-btn{
  pointer-events:auto;cursor:pointer;border:1px solid #a9793c;background:rgba(255,220,150,.12);
  color:#ffe9b8;border-radius:8px;font-size:1em;line-height:1;padding:.25em .4em;
}
.icon-btn:hover{background:rgba(255,220,150,.25)}
.score-line{display:flex;align-items:baseline;justify-content:space-between;margin-top:.25em}
.score-line .label{font-size:.82em;color:#d9b986}
#hudScore{font-size:1.9em;font-weight:900;color:#ffdf6b;text-shadow:0 2px 0 #6b3a00}
.pips{display:flex;gap:.15em;margin:.28em 0 .18em}
.pips i{flex:1;height:.42em;border-radius:2em;background:rgba(255,235,190,.18);border:1px solid rgba(255,215,140,.25)}
.pips i.on{background:linear-gradient(90deg,#ffe98a,#f5a623);box-shadow:0 0 6px #ffbe3d}
.starline{letter-spacing:.15em;font-size:1em;color:#5c4a2e}
.starline .star{color:#5b4a30;text-shadow:none}
.starline .star.on{color:#ffd23d;text-shadow:0 0 8px rgba(255,190,40,.9)}
.timer-line{display:flex;align-items:center;gap:.5em;margin-top:.2em}
#hudTimer{font-variant-numeric:tabular-nums;font-weight:800;color:#cfe9c1;min-width:3.2em}
#hudTimer.warn{color:#ff7b5b;animation:blink .8s infinite}
@keyframes blink{50%{opacity:.4}}
.timerbar{flex:1;height:.5em;border-radius:2em;background:rgba(0,0,0,.4);overflow:hidden;border:1px solid rgba(255,220,160,.2)}
.timerbar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#79d47a,#ffd23d);transition:width .2s linear}
.timerbar i.low{background:linear-gradient(90deg,#ff8a5b,#e2452c)}
.target-kicker{font-size:.72em;letter-spacing:.28em;color:#e0bd82}
.target-big{font-size:1.85em;font-weight:900;color:#ffd94f;line-height:1.15;text-shadow:0 2px 0 #5e3100}
.target-desc{font-size:.8em;color:#e8cf9d;margin-top:.1em}
.sample-btn{
  pointer-events:auto;cursor:pointer;margin-top:.4em;width:100%;
  background:linear-gradient(180deg,#fff3c4,#f3cf77);border:1px solid #8a5a12;color:#452300;
  border-radius:9px;padding:.4em .5em;font-weight:800;font-size:.92em;font-family:inherit;
}
.sample-btn:hover{filter:brightness(1.05)}
.hint{font-size:.72em;color:#d2b27d;margin-top:.35em}

/* ---------- feedback / toast ---------- */
.fx-card{
  position:absolute;left:50%;top:9%;transform:translate(-50%,-50%) scale(.7);
  min-width:13em;max-width:19em;padding:.5em .9em;border-radius:14px;text-align:center;
  opacity:0;pointer-events:none;transition:opacity .18s,transform .18s;z-index:8;
  border:2px solid rgba(255,255,255,.35);box-shadow:0 14px 40px rgba(0,0,0,.55);
}
.fx-card.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
.fx-card.good{background:linear-gradient(180deg,#fff6c9,#ffd75e);color:#4a2600;border-color:#ffef9c}
.fx-card.bad{background:linear-gradient(180deg,#e7c9a2,#b68048);color:#2a1607;border-color:#e8c79a}
.fx-card.dark{background:linear-gradient(180deg,#4b4b4b,#1d1d1d);color:#ffd9a0;border-color:#ff9a5b}
.fx-card.cool{background:linear-gradient(180deg,#dcfbff,#7fe3e0);color:#0a3f42;border-color:#c9ffff}
.fx-top{display:flex;align-items:center;justify-content:center;gap:.5em}
.fx-mark{font-size:1.4em;font-weight:900}
.fx-word{font-size:1.32em;font-weight:900;letter-spacing:.02em}
.fx-zh{font-size:.78em;opacity:.85}
.fx-score{font-size:1.2em;font-weight:900;margin-top:.05em}
.fx-note{font-size:.72em;opacity:.8;margin-top:.1em}
.toasts{position:absolute;left:50%;bottom:14%;transform:translateX(-50%);display:flex;flex-direction:column;gap:.3em;align-items:center;pointer-events:none;z-index:9}
.toast{background:rgba(30,16,6,.88);color:#ffe7ae;border:1px solid #b8874a;border-radius:99px;padding:.4em .9em;font-size:clamp(11px,1.1vw,16px);animation:toastUp 1.5s ease forwards}
@keyframes toastUp{0%{opacity:0;transform:translateY(10px)}15%{opacity:1;transform:translateY(0)}80%{opacity:1}100%{opacity:0;transform:translateY(-16px)}}

/* ---------- overlays ---------- */
.overlay{
  position:absolute;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;
  background:rgba(18,9,3,.66);backdrop-filter:blur(3px);
  opacity:0;pointer-events:none;transition:opacity .28s;padding:14px;
}
.overlay.show{opacity:1;pointer-events:auto}
.ov-card{
  width:min(700px,100%);max-height:100%;overflow:auto;text-align:center;
  background:linear-gradient(180deg,#fffaf0,#f2ddb2);
  border:3px solid #6b3e17;border-radius:20px;padding:clamp(10px,1.4vw,18px);
  box-shadow:0 24px 60px rgba(0,0,0,.6),inset 0 0 0 6px rgba(255,255,255,.4);
  animation:pop .3s cubic-bezier(.2,1.4,.4,1);
}
@keyframes pop{from{transform:scale(.92);opacity:0}to{transform:scale(1);opacity:1}}
.kicker{font-size:.76em;letter-spacing:.24em;color:#a1773a;font-weight:800}
h1,h2{margin:.2em 0 .05em;font-family:Georgia,"Times New Roman",serif;color:#40230a}
h1{font-size:clamp(20px,2.4vw,30px);letter-spacing:.04em}
h2{font-size:clamp(20px,2.6vw,30px)}
.sub{color:#8a6533;font-size:.82em;margin:0 0 .25em}
.cover{
  width:48px;height:48px;image-rendering:pixelated;border-radius:12px;
  box-shadow:0 6px 16px rgba(0,0,0,.35),0 0 0 3px #e8c67e;background:#fff;margin-bottom:.2em;
}
.levels{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:.35em 0}
.lv{background:#fffdf6;border:2px solid #dcbf86;border-radius:12px;padding:.42em .3em;cursor:pointer;transition:transform .12s,background .12s,border-color .12s}
.lv:hover{transform:translateY(-2px);background:#fff8df;border-color:#bf9440;box-shadow:0 6px 12px rgba(0,0,0,.14)}
.lv:active{transform:translateY(0)}
.lv-hint{font-size:.7em;color:#967243;margin:-.1em 0 .4em}
.lv b{display:block;font-size:.95em;color:#4a2a0c}
.lv span{display:block;font-size:.7em;color:#967243;margin-top:.12em}
.ptip{font-size:.8em;line-height:1.45;color:#6f4a18;background:rgba(255,255,255,.62);border:1px solid #e2c58e;border-radius:10px;padding:.35em .7em;margin:.45em 0 .2em;text-align:left}
.linkbtn{font-family:inherit;cursor:pointer;border:0;background:none;color:#8a6533;font-size:.8em;text-decoration:underline;padding:.3em}
.linkbtn:hover{color:#5a3a14}
.rules{text-align:left;font-size:.71em;line-height:1.45;background:rgba(255,255,255,.55);border:1px dashed #cfa96a;border-radius:10px;padding:.4em .75em;margin:.3em 0 .55em}
.rules b{color:#8a4f0d}
.btn{
  font-family:inherit;cursor:pointer;border:2px solid #8a5a12;color:#3a2109;font-weight:900;
  background:linear-gradient(180deg,#ffe377,#e8a91c);padding:.62em 1.6em;border-radius:12px;
  font-size:clamp(14px,1.35vw,18px);box-shadow:0 4px 0 #8a5a12,0 10px 18px rgba(0,0,0,.22);
  transition:transform .12s,filter .12s;
}
.btn:hover{transform:translateY(-2px);filter:brightness(1.04)}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #8a5a12}
.btn.ghost{background:linear-gradient(180deg,#fff8e2,#e8d2a4);border-color:#b08a4a;box-shadow:0 3px 0 #b08a4a}
.intro-target{font-size:2.3em;font-weight:900;color:#b87700;text-shadow:0 2px 0 #ffe9ae;margin:.1em 0}
.vs{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:.8em 0}
.vs-box{border-radius:12px;padding:.65em .4em;font-size:.85em;line-height:1.55;border:2px solid}
.vs-box b{font-size:1.15em}
.vs-box small{color:#7c5c33;font-size:.82em;display:block;margin-top:.2em}
.vs-box.gold{background:linear-gradient(180deg,#fff6c4,#ffdf7a);border-color:#e5a900;color:#5a3500}
.vs-box.bronze{background:linear-gradient(180deg,#e9cda7,#c08a52);border-color:#8a5a2b;color:#3a2109}
.vs-box small{color:inherit;opacity:.72}
.listen{
  display:inline-flex;align-items:center;gap:.6em;background:#fff;border:2px solid #e0c186;
  border-radius:99px;padding:.4em .6em .4em 1em;font-size:.92em;margin:.1em 0 .3em;
}
.listen button{
  font-family:inherit;cursor:pointer;border:0;border-radius:99px;padding:.35em .8em;
  background:#f3c33f;font-weight:800;color:#4a2600;
}
.tip{font-size:.8em;color:#8a6533;margin:.35em 0 .9em}
.big-stars{font-size:clamp(30px,4vw,46px);letter-spacing:.1em;margin:.15em 0}
.big-stars .star{color:#d8c6a1;transition:.2s}
.big-stars .star.on{color:#ffc21f;text-shadow:0 0 14px rgba(255,180,20,.85);transform:scale(1.06);display:inline-block}
.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:.7em 0}
.stat-grid.four{grid-template-columns:repeat(4,1fr)}
.stat-grid div{background:#fffdf6;border:2px solid #dcbf86;border-radius:12px;padding:.5em .2em}
.stat-grid b{display:block;font-size:1.5em;color:#a56a00;font-variant-numeric:tabular-nums}
.stat-grid span{font-size:.74em;color:#8a6533}
.pause-card{width:min(540px,100%)}
.pause-card .row-btns{margin-top:.5em;align-items:center}
.pause-card .linkbtn{font-size:.85em}
.muted{font-size:.8em;color:#8a6533;margin:.1em 0 .8em}
.score-table{width:100%;border-collapse:collapse;font-size:.84em;margin:.6em 0}
.score-table th{background:#e9d3a3;color:#5a3a14;padding:.4em .3em;border:1px solid #d0ae75;font-weight:800}
.score-table td{padding:.4em .3em;border:1px solid #e3cda4;background:#fffdf7;color:#4a2f12}
.score-table td.gold{color:#b07800;font-weight:800}
.total{font-size:1.05em;margin:.5em 0;color:#5a3a14}
.total b{font-size:1.7em;color:#b07800}
.review{text-align:left;background:rgba(255,255,255,.55);border:1px dashed #cfa96a;border-radius:10px;padding:.45em .7em;margin:.2em 0 .7em;max-height:8.5em;overflow:auto}
.rv-row{display:flex;flex-wrap:wrap;gap:.3em;align-items:center;margin:.2em 0}
.rv-label{font-size:.74em;font-weight:800;min-width:3.8em;color:#8a6533}
.rv-label.good{color:#a56a00}
.rv-label.bad{color:#8a4f2b}
.rv-chip{font-family:inherit;cursor:pointer;border:1px solid #d3b47c;background:#fffdf6;border-radius:99px;padding:.14em .5em;font-size:.88em;color:#4a2f12}
.rv-chip b{color:#8a4f0d}
.rv-chip i{font-style:normal;font-size:.82em;opacity:.65;margin-left:.25em}
.rv-chip:hover{background:#fff6d8}
.rank{font-family:Georgia,serif;font-size:1.15em;color:#8a4f0d;margin:.2em 0 .9em}
.row-btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
@media (max-width:760px){
  .hud-left{width:14em}.hud-right{width:14.5em}
  .rules{font-size:.78em}
}
</style>

let soundOn=true, ac=null, voice=null;
function ensureAudio(){
  try{
    if(!ac) ac=new (window.AudioContext||window.webkitAudioContext)();
    if(ac.state==='suspended') ac.resume();
  }catch(e){}
}
const TTS_OK=('speechSynthesis' in window);
function loadVoices(){
  if(!TTS_OK) return;
  const vs=speechSynthesis.getVoices()||[];
  voice=vs.find(v=>/en[-_]US/i.test(v.lang)&&/(aria|zira|samantha|google|natural|female)/i.test(v.name))
      ||vs.find(v=>/^en/i.test(v.lang))||null;
}
if(TTS_OK){ loadVoices(); speechSynthesis.addEventListener('voiceschanged',loadVoices); }

function speak(text,rate){
  if(!soundOn||!TTS_OK) return;
  try{
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(text);
    u.lang='en-US'; u.rate=rate||0.82; u.pitch=1.02;
    if(voice) u.voice=voice;
    speechSynthesis.speak(u);
  }catch(e){}
}
function tone(freq,dur,type,vol,delay){
  if(!soundOn||!ac) return;
  const t0=ac.currentTime+(delay||0);
  const o=ac.createOscillator(), g=ac.createGain();
  o.type=type||'sine'; o.frequency.setValueAtTime(freq,t0);
  g.gain.setValueAtTime(0.0001,t0);
  g.gain.exponentialRampToValueAtTime(vol||0.12,t0+0.012);
  g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
  o.connect(g).connect(ac.destination); o.start(t0); o.stop(t0+dur+0.03);
}
function noiseBurst(dur,vol){
  if(!soundOn||!ac) return;
  const n=Math.floor(ac.sampleRate*dur);
  const buf=ac.createBuffer(1,n,ac.sampleRate);
  const d=buf.getChannelData(0);
  for(let i=0;i<n;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/n,2);
  const s=ac.createBufferSource(); s.buffer=buf;
  const g=ac.createGain(); g.gain.value=vol||0.3;
  s.connect(g).connect(ac.destination); s.start();
}

/* ============================================================
   单词矿块生成
============================================================ */
function makePts(bw,bh,seed){
  const rnd=mulberry32(seed), pts=[], n=12;
  for(let i=0;i<n;i++){
    const a=i/n*Math.PI*2;
    const jx=0.82+rnd()*0.24, jy=0.78+rnd()*0.26;
    pts.push([Math.cos(a)*bw/2*jx, Math.sin(a)*bh/2*jy]);
  }
  return pts;
}
function wordWidth(word){
  const fs=wordFont(word);
  return clamp(word.length*fs*0.62+30,66,208);
}
function wordFont(word){
  return clamp(12,20-Math.max(0,word.length-5)*0.75,19);
}
function addWordItem(info,kind){
  const word=info[0], zh=info[1]||WORD_ZH[word]||'';
  if(G.items.some(i=>i.word===word)) return false;
  const fs=wordFont(word), bw=wordWidth(word);
  const it={type:'word',word,zh,kind,bw,bh:56,fs,x:0,y:0,seed:ri(1,999999),spin:0,rot:0};
  it.pts=makePts(bw,56,it.seed);
  if(!place(it)) return false;
  G.items.push(it); return true;
}
function addProp(kind){
  const it={type:'prop',kind,bw:58,bh:58,x:0,y:0,seed:ri(1,999999),rot:0};
  if(!place(it)) return false;
  G.items.push(it); return true;
}
function place(it){
  const hw=it.bw/2, hh=it.bh/2;
  for(let n=0;n<500;n++){
    const x=rand(70+hw,W-70-hw);
    const y=rand(282+hh,634-hh);
    if(Math.hypot(x-PIVOT.x,y-PIVOT.y)>635) continue;
    let ok=true;
    for(const o of G.items){
      if(Math.abs(x-o.x)<hw+o.bw/2+13 && Math.abs(y-o.y)<hh+o.bh/2+11){ ok=false; break; }
    }
    if(ok){ it.x=x; it.y=y; return true; }
  }
  return false;
}

function buildField(){
  const cfg=G.cfg; G.items=[];
  const pairs=shuffle(cfg.pairs).slice(0,cfg.pairCount);
  pairs.forEach(p=>{
    const gw=cfg.first?p[0]:p[1], bw=cfg.first?p[1]:p[0];
    addWordItem([gw,WORD_ZH[gw]],'gold');
    addWordItem([bw,WORD_ZH[bw]],'bronze');
  });
  let gold=G.items.filter(i=>i.kind==='gold').length;
  let guard=0;
  while(gold<cfg.goldCount && guard++<60){
    const info=cfg.words[ri(0,cfg.words.length-1)];
    if(addWordItem(info,'gold')) gold++;
  }
  guard=0;
  while(G.items.filter(i=>i.type==='word').length<cfg.wordCount && guard++<90){
    const pool=Math.random()<0.72?cfg.bad:cfg.extra;
    const pickFrom=(pool&&pool.length)?pool:cfg.bad;
    const info=pickFrom[ri(0,pickFrom.length-1)];
    addWordItem(info,'bronze');
  }
  for(let i=0;i<cfg.bombs;i++) addProp('bomb');
  addProp('clock'); addProp('magnet');
}

function respawnWord(kind){
  const cfg=G.cfg;
  if(!cfg) return;
  const pool=kind==='gold'?cfg.words:(cfg.extra&&cfg.extra.length&&Math.random()<0.25?cfg.extra:cfg.bad);
  for(let t=0;t<40;t++){
    const info=pool[ri(0,pool.length-1)];
    if(G.items.some(i=>i.word===info[0])) continue;
    if(addWordItem(info,kind)) return;
  }
}

function formatTime(s){
  s=Math.max(0,Math.ceil(s));
  return Math.floor(s/60)+':'+String(s%60).padStart(2,'0');
}
function resetRound(level,roundIdx){
  G.token++;
  G.level=level; G.roundIdx=roundIdx;
  G.cfg=Object.assign({},LEVELS[level],LEVELS[level].rounds[roundIdx]);
  G.mode='intro';
  G.time=120; G.score=0; G.correct=0; G.wrong=0;
  G.magnet=0; G.shake=0; G.carry=null;
  G.caught=[]; G.missed=[];
  G.paused=false; G.streak=0; G.precise=0; G.floaters=[]; G.lastBeep=99;
  if(els.pause) els.pause.textContent='⏸';
  G.items=[]; G.particles=[];
  G.hook={state:'swing',angle:0,swingT:0,len:64,speed:0};
  G.sample=G.cfg.sample;
  buildField();
  refreshHUD(true);
}
function beginRound(){
  hideOverlay();
  ensureAudio();
  G.mode='playing';
  const cfg=G.cfg;
  const spoken={sh:'S H',ch:'C H',ae:'short A',e:'short E',b:'B',p:'P'}[cfg.target];
  const golds=G.items.filter(i=>i.kind==='gold');
  const hasSample=golds.some(i=>i.word===G.sample);
  const pick=hasSample?G.sample:(golds.length?golds[ri(0,golds.length-1)].word:cfg.sample);
  G.sample=pick; refreshHUD();
  speak('Catch words with the '+spoken+' sound. For example, '+pick+'.');
}
function endRound(){
  if(G.mode!=='playing') return;
  G.mode='result';
  G.token++;
  if(TTS_OK) speechSynthesis.cancel();
  const stars=G.score>=11000?3:G.score>=7000?2:G.score>=3000?1:0;
  results.push({
    levelName:LEVELS[G.level].name, level:G.level, round:G.roundIdx+1,
    label:G.cfg.label, target:G.cfg.target,
    correct:G.correct, wrong:G.wrong, score:G.score, stars,
    precise:G.precise,
    caught:[...new Map(G.caught.map(x=>[x.w,x])).values()],
    missed:[...new Map(G.missed.map(x=>[x.w,x])).values()]
  });
  SFX.win();
  showResult();
}

function advance(){
  if(G.roundIdx===0){ resetRound(G.level,1); showIntro(); }
  else if(G.level<LEVELS.length-1){ resetRound(G.level+1,0); showIntro(); }
  else showFinal();
}
function restart(){
  results.length=0;
  resetRound(0,0); showIntro();
}
function startLevel(level){
  ensureAudio();
  results.length=0;
  resetRound(level,0); showIntro();
}
function quitToMenu(){
  G.paused=false; G.mode='menu';
  results.length=0;
  if(TTS_OK) speechSynthesis.cancel();
  showStart();
}

function pauseGame(){
  if(G.mode!=='playing'||G.paused) return;
  G.paused=true;
  els.pause.textContent='▶';
  if(TTS_OK) speechSynthesis.cancel();
  showOverlay(`
    <div class="ov-card pause-card">
      <div class="kicker">已 暂 停</div>
      <h2>休息一下</h2>
      <p class="muted">${LEVELS[G.level].name} · 第 ${G.roundIdx+1}/2 轮 · ${G.cfg.label}</p>
      <div class="stat-grid">
        <div><b>${G.score}</b><span>本轮得分</span></div>
        <div><b>${formatTime(G.time)}</b><span>剩余时间</span></div>
        <div><b>${G.correct}</b><span>已抓金块</span></div>
      </div>
      <div class="row-btns">
        <button class="btn" id="resumeBtn">继续挖矿</button>
        <button class="btn ghost" id="pauseReplay">重玩本轮</button>
        <button class="linkbtn" id="pauseQuit">返回选关</button>
      </div>
      <p class="muted" style="margin:.55em 0 0">按 P 或 Esc 继续</p>
    </div>`);
  document.getElementById('resumeBtn').onclick=resumeGame;
  document.getElementById('pauseReplay').onclick=()=>{
    G.paused=false; els.pause.textContent='⏸';
    resetRound(G.level,G.roundIdx); showIntro();
  };
  document.getElementById('pauseQuit').onclick=quitToMenu;
}
function resumeGame(){
  if(!G.paused) return;
  G.paused=false;
  els.pause.textContent='⏸';
  hideOverlay();
}
function togglePause(){ G.paused?resumeGame():pauseGame(); }

function refreshHUD(force){
  const cfg=G.cfg;
  els.level.textContent=LEVELS[G.level].name+' · 第 '+(G.roundIdx+1)+'/2 轮';
  els.score.textContent=G.score;
  els.target.textContent=cfg.label;
  els.desc.textContent='钓金色：'+cfg.goldRule;
  els.sample.textContent=G.sample+' · '+(WORD_ZH[G.sample]||'');
  els.pips.forEach((p,i)=>p.classList.toggle('on',i<Math.min(22,Math.round(G.score/500))));
  els.stars.forEach((s,i)=>s.classList.toggle('on',G.score>=[3000,7000,11000][i]));
  const t=formatTime(G.time);
  els.timer.textContent=t;
  els.timer.classList.toggle('warn',G.time<=15);
  els.timerBar.style.width=clamp(G.time/120*100,0,100)+'%';
  els.timerBar.classList.toggle('low',G.time<=20);
}

   抓钩
============================================================ */
function tipPos(){
  const a=G.hook.angle;
  return {x:PIVOT.x+Math.sin(a)*G.hook.len, y:PIVOT.y+Math.cos(a)*G.hook.len};
}
function fire(){
  if(G.mode!=='playing'||G.paused) return;
  if(G.hook.state!=='swing') return;
  ensureAudio();
  G.hook.state='shoot';
  G.hook.speed=1150;
  SFX.grab();
}
function grabItem(it){
  it.ox=it.x; it.oy=it.y;
  G.carry=it;
  G.items=G.items.filter(o=>o!==it);
  G.hook.state='retract';
  G.hook.speed=(it.kind==='gold'?300:1600)*(G.magnet>0?1.9:1);
  tone(180,0.08,'square',0.08);
}
function resolveCarry(){
  const it=G.carry; G.carry=null;
  G.hook.state='swing';
  if(!it) return;
  if(it.type==='prop'){
    if(it.kind==='bomb'){
      G.score=Math.max(0,G.score-200); G.shake=22; SFX.bomb(); G.streak=0;
      burst(it.ox,it.oy,'#ff7a3d',26,420);
      addFloat(it.ox,it.oy,'-200','#ff8b70');
      showFx('dark','💣','-200','炸弹！','扣掉 200 分，小心避开它');
      schedulePropRespawn('bomb',7000);
    }else if(it.kind==='clock'){
      G.time=Math.min(180,G.time+10); SFX.clock();
      addFloat(it.ox,it.oy,'+10s','#8ff5ee');
      toast('⏰ +10 秒');
      showFx('cool','⏰','+10s','时间提升','剩余时间增加了 10 秒');
      schedulePropRespawn('clock',25000);
    }else if(it.kind==='magnet'){
      G.magnet=10; SFX.magnet();
      addFloat(it.ox,it.oy,'×1.9','#8ff5ee');
      toast('🧲 磁力 10 秒：收钩加速');
      showFx('cool','🧲','×1.9','强力磁铁','10 秒内金块回收速度大幅提升');
      schedulePropRespawn('magnet',26000);
    }
    refreshHUD();
    return;
  }
  // 单词矿块
  const cat=WORD_CAT[it.word]||'';
  if(it.kind==='gold'){
    const precise=it.word===G.sample;
    G.score+=500; G.correct++;
    if(precise) G.precise++;
    G.streak++;
    G.caught.push({w:it.word,zh:it.zh});
    SFX.good();
    burst(it.ox,it.oy,'#ffd94a',16,260);
    addFloat(it.ox,it.oy,'+500','#fff3a0');
    if(G.streak===3) toast('🔥 连击 ×3');
    if(G.streak%5===0){
      G.time=Math.min(180,G.time+3);
      addFloat(it.ox,it.oy-26,'+3s','#8ff5ee');
      toast('🔥 连击 ×'+G.streak+' · +3 秒');
    }
    showFx('good','✓','+500','金块到手！',CAT_LABEL[cat]+' · '+it.zh+(precise?' · ★ 正是刚才读的词':''),it.word);
    speak(it.word);
    refreshHUD();
    schedule(()=>{ if(G.mode==='playing'&&!G.paused) announceSample(); },1600);
  }else{
    G.wrong++;
    G.streak=0;
    G.missed.push({w:it.word,zh:it.zh});
    SFX.bad();
    addFloat(it.ox,it.oy,'+0','#e7c8a0');
    const label=CAT_LABEL[cat]||'';
    const note=CAT_NOTE[cat]||('这是 '+label+' 的单词');
    showFx('bad','✗','+0','青铜块',label+' — '+it.zh,it.word,note+'；本轮要抓 '+G.cfg.label);
    speak(it.word);
    refreshHUD();
    schedule(()=>{ if(G.mode==='playing'&&!G.paused) announceSample(); },2000);
  }
  schedule(()=>{ if(G.mode==='playing') respawnWord(it.kind); },1200);
}
function announceSample(){
  const golds=G.items.filter(i=>i.kind==='gold');
  if(!golds.length) return;
  const pick=golds[ri(0,golds.length-1)];
  G.sample=pick.word;
  els.sample.textContent=G.sample+' · '+(WORD_ZH[G.sample]||'');
  speak(G.sample);
}
function schedule(fn,ms){
  const tok=G.token;
  setTimeout(()=>{ if(tok===G.token) fn(); },ms);
}
function schedulePropRespawn(kind,ms){
  schedule(()=>{
    if(G.mode!=='playing') return;
    if(G.items.some(i=>i.type==='prop'&&i.kind===kind)) return;
    addProp(kind);
  },ms);
}

/* ============================================================
   粒子
============================================================ */
function burst(x,y,color,n,spd){
  for(let i=0;i<n;i++){
    const a=rand(0,Math.PI*2), v=rand(spd*0.2,spd);
    G.particles.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-60,life:rand(.4,.8),max:.8,color,size:rand(2,5)});
  }
}
function addFloat(x,y,text,color){
  G.floaters.push({x,y,text,color,life:1.05,max:1.05});
}

/* ============================================================
   更新
============================================================ */
function update(dt,t){
  if(G.mode==='playing'&&!G.paused){
    G.time-=dt;
    const sec=Math.ceil(G.time);
    if(sec<=5&&sec>0&&sec!==G.lastBeep){ G.lastBeep=sec; tone(1180,0.07,'square',0.09); }
    if(G.time<=0){ G.time=0; refreshHUD(); endRound(); return; }
    if(G.magnet>0){ G.magnet=Math.max(0,G.magnet-dt); }
    updateHook(dt);
    refreshHUD();
  }
  if(!G.paused){
    if(G.shake>0) G.shake=Math.max(0,G.shake-dt*50);
    G.items.forEach(it=>{ if(it.type==='prop'&&it.kind==='bomb') it.rot=Math.sin(t*3+it.seed)*0.08; });
    G.particles=G.particles.filter(p=>{
      p.life-=dt; p.vy+=600*dt;
      p.x+=p.vx*dt; p.y+=p.vy*dt;
      return p.life>0;
    });
    G.floaters=G.floaters.filter(f=>{ f.life-=dt; f.y-=58*dt; return f.life>0; });
  }
}

function updateHook(dt){
  const h=G.hook;
  if(h.state==='swing'){
    h.swingT+=dt;
    h.angle=AMP*Math.sin(h.swingT*Math.PI*2/LEVELS[G.level].swing);
    h.len=64;
    return;
  }
  if(h.state==='shoot'){
    h.len+=h.speed*dt;
    const tip=tipPos();
    for(const it of G.items){
      if(Math.abs(tip.x-it.x)<it.bw/2+8 && Math.abs(tip.y-it.y)<it.bh/2+8){
        grabItem(it); return;
      }
    }
    if(h.len>=MAXROPE||tip.y>H-18||tip.x<10||tip.x>W-10){
      h.state='retract'; h.speed=2200;
    }
    return;
  }
  if(h.state==='retract'){
    if(G.carry){
      h.speed=(G.carry.kind==='gold'?300:1600)*(G.magnet>0?1.9:1);
    }
    h.len-=h.speed*dt;
    if(G.carry){
      const tp=tipPos();
      G.carry.x=tp.x; G.carry.y=tp.y+G.carry.bh/2+6;
    }
    if(h.len<=64){ h.len=64; resolveCarry(); }
  }
}

function render(t){
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.clearRect(0,0,W,H);
  ctx.save();
  if(G.shake>0){
    ctx.translate(rand(-G.shake,G.shake)*.5,rand(-G.shake,G.shake)*.5);
  }
  ctx.drawImage(bg,0,0,W,H);

  // 物品
  const sorted=G.items.slice().sort((a,b)=>a.y-b.y);
  sorted.forEach(it=>drawItem(it,t));

  // 绳索与钩爪
  drawHook(t);

  // 矿工
  drawMiner(t);

  // 被抓取物
  if(G.carry) drawItem(G.carry,t,true);

  // 粒子
  G.particles.forEach(p=>{
    ctx.globalAlpha=clamp(p.life/p.max,0,1);
    ctx.fillStyle=p.color;
    ctx.beginPath(); ctx.arc(p.x,p.y,p.size,0,7); ctx.fill();
  });
  ctx.globalAlpha=1;

  // 得分飘字
  G.floaters.forEach(f=>{
    const k=clamp(f.life/f.max,0,1);
    ctx.globalAlpha=Math.min(1,k*1.8);
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.font='900 21px "Microsoft YaHei", Arial, sans-serif';
    ctx.lineWidth=4; ctx.strokeStyle='rgba(45,22,0,.6)';
    ctx.strokeText(f.text,f.x,f.y);
    ctx.fillStyle=f.color; ctx.fillText(f.text,f.x,f.y);
  });
  ctx.globalAlpha=1;

  // 磁力光环
  if(G.magnet>0){
    ctx.save();
    ctx.strokeStyle='rgba(255,90,90,'+(0.35+0.25*Math.sin(t*8))+')';
    ctx.lineWidth=3;
    ctx.beginPath(); ctx.arc(PIVOT.x,PIVOT.y,72+Math.sin(t*6)*4,0,7); ctx.stroke();
    ctx.restore();
  }
  ctx.restore();
}

function drawItem(it,t,carried){
  const a=(it.type==='prop'&&it.kind==='bomb')?(it.rot||0):0;
  const wob=carried?Math.sin(t*9)*0.06:Math.sin(t*1.4+it.seed)*0.012;
  ctx.save();
  ctx.translate(it.x,it.y);
  ctx.rotate(a+wob);
  // 阴影
  ctx.fillStyle='rgba(0,0,0,.28)';
  ctx.beginPath(); ctx.ellipse(0,it.bh/2+6,it.bw*0.42,7,0,0,7); ctx.fill();

  if(it.type==='word') drawRock(it,t);
  else drawProp(it,t);
  ctx.restore();
}

function drawRock(it,t){
  const gold=it.kind==='gold';
  const g=ctx.createLinearGradient(0,-it.bh/2,0,it.bh/2);
  if(gold){ g.addColorStop(0,'#fff3a8'); g.addColorStop(.35,'#ffd23a'); g.addColorStop(.75,'#e8a300'); g.addColorStop(1,'#a86a00'); }
  else { g.addColorStop(0,'#e6bd8d'); g.addColorStop(.35,'#c48f52'); g.addColorStop(.75,'#96612c'); g.addColorStop(1,'#5f3a13'); }
  ctx.beginPath();
  const p=it.pts;
  ctx.moveTo(p[0][0],p[0][1]);
  for(let i=1;i<p.length;i++) ctx.lineTo(p[i][0],p[i][1]);
  ctx.closePath();
  ctx.fillStyle=g; ctx.fill();
  ctx.lineWidth=3.2; ctx.strokeStyle=gold?'#8a5600':'#4a2a0c'; ctx.stroke();

  // 高光
  ctx.beginPath(); ctx.ellipse(-it.bw*0.16,-it.bh*0.2,it.bw*0.26,it.bh*0.16,-.4,0,7);
  ctx.fillStyle=gold?'rgba(255,255,230,.45)':'rgba(255,240,220,.22)'; ctx.fill();

  // 文字
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.font='800 '+it.fs+'px Arial, "Microsoft YaHei", sans-serif';
  ctx.lineWidth=3.5;
  ctx.strokeStyle=gold?'rgba(255,248,200,.55)':'rgba(255,235,200,.35)';
  ctx.strokeText(it.word,0,1);
  ctx.fillStyle='#341a00';
  ctx.fillText(it.word,0,1);

  if(gold){
    const tw=.55+.45*Math.sin(t*3+it.seed);
    ctx.globalAlpha=tw;
    ctx.fillStyle='#fffbd6';
    star4(-it.bw*0.32,-it.bh*0.34,4); star4(it.bw*0.34,-it.bh*0.28,3);
    ctx.globalAlpha=1;
  }
}
function star4(x,y,r){
  ctx.beginPath();
  ctx.moveTo(x,y-r); ctx.quadraticCurveTo(x,y,x+r,y); ctx.quadraticCurveTo(x,y,x,y+r);
  ctx.quadraticCurveTo(x,y,x-r,y); ctx.quadraticCurveTo(x,y,x,y-r); ctx.fill();
}

function drawHook(t){
  const h=G.hook, tip=tipPos();
  // 绳
  ctx.strokeStyle='#3b220c'; ctx.lineWidth=6;
  ctx.beginPath(); ctx.moveTo(PIVOT.x,PIVOT.y); ctx.lineTo(tip.x,tip.y); ctx.stroke();
  ctx.strokeStyle='#d5ad68'; ctx.lineWidth=3.2;
  ctx.beginPath(); ctx.moveTo(PIVOT.x,PIVOT.y); ctx.lineTo(tip.x,tip.y); ctx.stroke();
  for(let d=14;d<h.len;d+=22){
    const x=PIVOT.x+Math.sin(h.angle)*d, y=PIVOT.y+Math.cos(h.angle)*d;
    ctx.strokeStyle='rgba(87,53,21,.55)'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(x-2.5,y-2.5); ctx.lineTo(x+2.5,y+2.5); ctx.stroke();
  }
  // 钩爪
  ctx.save();
  ctx.translate(tip.x,tip.y);
  ctx.rotate(-h.angle+Math.PI);
  ctx.strokeStyle='#4a2c10'; ctx.lineWidth=7; ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(0,-10); ctx.quadraticCurveTo(-14,2,-7,16); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(0,-10); ctx.quadraticCurveTo(14,2,7,16); ctx.stroke();
  ctx.strokeStyle='#c9ced8'; ctx.lineWidth=3;
  ctx.beginPath(); ctx.moveTo(0,-11); ctx.quadraticCurveTo(-14,2,-7,16); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(0,-11); ctx.quadraticCurveTo(14,2,7,16); ctx.stroke();
  ctx.fillStyle='#8a5a20'; ctx.beginPath(); ctx.arc(0,-11,3.5,0,7); ctx.fill();
  ctx.restore();

  // 钩爪阴影/金属头
  ctx.fillStyle='#5e646e';
  ctx.beginPath(); ctx.arc(tip.x,tip.y,5,0,7); ctx.fill();
}

function drawMiner(t){
  const x=560, feet=205;
  ctx.save();
  // 影子
  ctx.fillStyle='rgba(0,0,0,.18)';
  ctx.beginPath(); ctx.ellipse(x,feet+2,52,9,0,0,7); ctx.fill();
  // 腿
  ctx.fillStyle='#2b3f68';
  ctx.fillRect(x-20,176,15,30); ctx.fillRect(x+5,176,15,30);
  ctx.fillStyle='#3a2410';
  ctx.fillRect(x-24,200,23,8); ctx.fillRect(x+1,200,23,8);
  // 身体
  const body=ctx.createLinearGradient(x-30,120,x+30,180);
  body.addColorStop(0,'#b8632f'); body.addColorStop(.5,'#8f4820'); body.addColorStop(1,'#6b3314');
  ctx.fillStyle=body;
  rr(x-27,118,54,62,12); ctx.fill();
  ctx.strokeStyle='#4a220c'; ctx.lineWidth=2; rr(x-27,118,54,62,12); ctx.stroke();
  // 背带
  ctx.strokeStyle='#3f5a8f'; ctx.lineWidth=5;
  ctx.beginPath(); ctx.moveTo(x-16,122); ctx.lineTo(x-10,178); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x+16,122); ctx.lineTo(x+10,178); ctx.stroke();
  // 手臂
  ctx.strokeStyle='#e8b78a'; ctx.lineWidth=9; ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(x-24,128); ctx.lineTo(PIVOT.x-3,PIVOT.y-2); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x+24,128); ctx.lineTo(PIVOT.x+3,PIVOT.y-2); ctx.stroke();
  // 手
  ctx.fillStyle='#f2c79b';
  ctx.beginPath(); ctx.arc(PIVOT.x-4,PIVOT.y,6,0,7); ctx.fill();
  ctx.beginPath(); ctx.arc(PIVOT.x+4,PIVOT.y,6,0,7); ctx.fill();
  // 头（用图标）
  const hy=86,hr=28;
  ctx.save();
  ctx.beginPath(); ctx.arc(x,hy,hr,0,7); ctx.clip();
  ctx.fillStyle='#fff'; ctx.fillRect(x-hr,hy-hr,hr*2,hr*2);
  if(iconImg.complete) ctx.drawImage(iconImg,x-hr,hy-hr,hr*2,hr*2);
  ctx.restore();
  ctx.beginPath(); ctx.arc(x,hy,hr,0,7);
  ctx.strokeStyle='#3a2109'; ctx.lineWidth=3; ctx.stroke();
  // 安全帽
  ctx.fillStyle='#f0b62c';
  ctx.beginPath(); ctx.arc(x,hy-9,hr+4,Math.PI,0); ctx.closePath(); ctx.fill();
  ctx.strokeStyle='#8a5a00'; ctx.lineWidth=2; ctx.stroke();
  ctx.fillStyle='#f7cf55';
  ctx.beginPath(); ctx.ellipse(x,hy-8,hr+8,6,0,0,7); ctx.fill();
  ctx.strokeStyle='#8a5a00'; ctx.stroke();
  // 帽灯
  ctx.fillStyle='#fffbe0'; ctx.beginPath(); ctx.arc(x,hy-27,5,0,7); ctx.fill();
  ctx.fillStyle='rgba(255,250,190,'+(0.25+0.15*Math.sin(t*3))+')';
  ctx.beginPath(); ctx.arc(x,hy-27,11,0,7); ctx.fill();
  ctx.restore();
}
function rr(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath();
}

   界面
============================================================ */

function showOverlay(html){
  overlay.innerHTML=html;
  overlay.classList.add('show');
}

      <h1>黄金矿工 · 单词矿场</h1>

        <b>22 个正确（11000 分）</b> = 三星；每轮结束记录成绩，全部结束后可看总成绩单。<br>

        <b>连击：</b>连续钓到 5 个金块，奖励 +3 秒。<br>

  });

function showIntro(){
  const cfg=G.cfg, L=LEVELS[G.level];
  const isHard=G.level===1;
  const example=G.items.filter(i=>i.kind==='gold')[0];
  const say=example?example.word:cfg.sample;
  G.sample=say; els.sample.textContent=say+' · '+(WORD_ZH[say]||'');
  const tip=PRON_TIPS[cfg.target]||'先听清目标音，再读金色矿块上的拼写。';
  showOverlay(`
    <div class="ov-card">
      <div class="kicker">${L.name} · 第 ${G.roundIdx+1} / 2 轮${isHard?' · 高难度':''}</div>
      <h2>本轮目标音</h2>
      <div class="intro-target">${cfg.label}</div>
      <div class="ptip"><b>发音提示：</b>${tip}</div>
      <div class="vs">
        <div class="vs-box gold">
          <b>金色 · +500</b><br>${cfg.goldRule}<br><small>钓到任意金色矿块都得分</small>
        </div>
        <div class="vs-box bronze">
          <b>青铜 · +0</b><br>${cfg.badRule}<br><small>抓到后抓钩飞速回收</small>
        </div>
      </div>
      <div class="listen">
        🔊 例词：<b>${say}</b>（${WORD_ZH[say]||''}）
        <button id="introListen">再听一次</button>
        <button id="introSlow">慢速</button>
      </div>
      <div class="tip">${isHard?'干扰更强：注意 bad / bed、pan / pen 这类最小对立体。':'提示：先听发音，再读金色矿块上的拼写。'}　空格 / 点击发射　P 暂停　三星线：11000 分（22 个金块）</div>
      <button class="btn" id="goBtn">开始本轮（2:00）</button>
    </div>`);
  const spoken={sh:'S H',ch:'C H',ae:'short A',e:'short E',b:'B',p:'P'}[cfg.target];
  setTimeout(()=>speak('Catch words with the '+spoken+' sound. For example, '+say+'.'),120);
  document.getElementById('goBtn').onclick=beginRound;
  document.getElementById('introListen').onclick=()=>{ ensureAudio(); speak(say); };
  document.getElementById('introSlow').onclick=()=>{ ensureAudio(); speak(say,0.55); };
}

function showResult(){
  const r=results[results.length-1];
  const total=results.reduce((s,x)=>s+x.score,0);
  const nextLabel = r.round===1
    ? `进入 ${LEVELS[r.level].name} · 第 2 轮`
    : (r.level<LEVELS.length-1 ? `进入 ${LEVELS[r.level+1].name}` : '查看总成绩单');
  const rate=(r.correct+r.wrong)?Math.round(r.correct/(r.correct+r.wrong)*100):0;
  const gap=r.stars>=3?'已达成三星':`还差 ${[3000,7000,11000][r.stars]-r.score} 分升到 ${['一星','二星','三星'][r.stars]}`;
  const starHtml=[0,1,2].map(i=>`<span class="star ${i<r.stars?'on':''}">${i<r.stars?'★':'☆'}</span>`).join('');
  showOverlay(`
    <div class="ov-card">
      <div class="kicker">${r.levelName} · 第 ${r.round} / 2 轮 · ${r.label}</div>
      <h2>本轮结束</h2>
      <div class="big-stars">${starHtml}</div>
      <div class="stat-grid four">
        <div><b>${r.correct}</b><span>正确金块</span></div>
        <div><b>${r.wrong}</b><span>青铜失误</span></div>
        <div><b>${rate}%</b><span>正确率</span></div>
        <div><b>${r.score}</b><span>本轮得分</span></div>
      </div>
      <p class="muted">${gap} · 三星线 11000 分（22 个金块）　累计 <b>${total}</b> 分</p>
      ${(r.caught.length||r.missed.length)?`
      <div class="review">
        ${r.caught.length?`<div class="rv-row"><span class="rv-label good">✓ 抓到</span>${r.caught.map(c=>`<button class="rv-chip" data-say="${c.w}" title="点击再听"><b>${c.w}</b><i>${c.zh}</i></button>`).join('')}</div>`:''}
        ${r.missed.length?`<div class="rv-row"><span class="rv-label bad">✗ 失误</span>${r.missed.map(c=>`<button class="rv-chip" data-say="${c.w}" title="点击再听"><b>${c.w}</b><i>${c.zh}</i></button>`).join('')}</div>`:''}
      </div>
      <p class="muted">点单词可再听一遍</p>`:''}
      <div class="row-btns">
        <button class="btn" id="nextBtn">${nextLabel}</button>
        <button class="btn ghost" id="replayRound">重玩本轮</button>
        <button class="linkbtn" id="backLevels">返回选关</button>
      </div>
    </div>`);
  document.getElementById('nextBtn').onclick=advance;
  document.getElementById('replayRound').onclick=()=>{
    results.pop();
    resetRound(r.level,r.round-1);
    showIntro();
  };
  document.getElementById('backLevels').onclick=quitToMenu;
  overlay.querySelectorAll('.rv-chip').forEach(b=>{
    b.onclick=()=>{ ensureAudio(); speak(b.dataset.say); };
  });
}

function showFinal(){
  const total=results.reduce((s,r)=>s+r.score,0);
  const totalStars=results.reduce((s,r)=>s+r.stars,0);
  const maxStars=results.length*3;
  const caughtN=results.reduce((s,r)=>s+r.correct,0);
  const wrongN=results.reduce((s,r)=>s+r.wrong,0);
  const acc=(caughtN+wrongN)?Math.round(caughtN/(caughtN+wrongN)*100):0;
  const missedAll=[...new Map(results.flatMap(r=>r.missed).map(x=>[x.w,x])).values()];
  let rank='再来一次，先把音听清';
  if(totalStars>=maxStars*0.8) rank='音标大师 · 听音辨词稳如老矿工';
  else if(totalStars>=maxStars*0.55) rank='熟练矿工 · 已经很稳了';
  else if(totalStars>=maxStars*0.3) rank='见习矿工 · 继续练最小对立体';
  showOverlay(`
    <div class="ov-card">
      <div class="kicker">成 绩 单</div>
      <h2>挖矿报告</h2>
      <table class="score-table">
        <thead><tr><th>轮次</th><th>目标音</th><th>正确</th><th>失误</th><th>得分</th><th>星</th></tr></thead>
        <tbody>
          ${results.map(r=>`
            <tr>
              <td>${r.levelName} · 第${r.round}轮</td>
              <td>${r.label}</td>
              <td>${r.correct}</td>
              <td>${r.wrong}</td>
              <td class="gold">${r.score}</td>
              <td>${'★'.repeat(r.stars)}${'☆'.repeat(3-r.stars)}</td>
            </tr>`).join('')}
        </tbody>
      </table>
      <div class="total">总分 <b>${total}</b> · 星星 ${totalStars} / ${maxStars}</div>
      <p class="muted">共抓对 ${caughtN} 个单词 · ${wrongN} 次失误 · 总正确率 ${acc}%</p>
      <p class="rank">${rank}</p>
      ${missedAll.length?`
      <div class="review">
        <div class="rv-row"><span class="rv-label bad">错词本</span>${missedAll.map(c=>`<button class="rv-chip" data-say="${c.w}" title="点击再听"><b>${c.w}</b><i>${c.zh}</i></button>`).join('')}</div>
        <div class="muted" style="margin:.25em 0 0">这些是你误抓的青铜词，点一下再听，下次别再钓错。</div>
      </div>`:(caughtN?`<p class="muted">零失误通关，所有青铜干扰都被你躲开了。</p>`:`<p class="muted">这一轮还没抓到单词，先听清目标音再出发。</p>`)}
      <div class="row-btns">
        <button class="btn" id="againBtn">再玩一次</button>
        <button class="btn ghost" id="selBtn">选择关卡</button>
      </div>
    </div>`);
  document.getElementById('againBtn').onclick=()=>{ ensureAudio(); restart(); };
  document.getElementById('selBtn').onclick=quitToMenu;
  overlay.querySelectorAll('.rv-chip').forEach(b=>{
    b.onclick=()=>{ ensureAudio(); speak(b.dataset.say); };
  });
}

/* ============================================================
   输入
============================================================ */
window.addEventListener('keydown',e=>{
  if(e.code==='KeyP'||e.code==='Escape'){
    if(G.mode==='playing'){ e.preventDefault(); togglePause(); }
    return;
  }
  if(e.code==='Space'||e.code==='Enter'){
    if(G.mode==='playing'){
      e.preventDefault();
      if(G.paused) resumeGame(); else fire();
    }
  }
  if(e.code==='KeyR'&&G.mode==='playing'&&!G.paused){ e.preventDefault(); speak(G.sample); }
});
stage.addEventListener('pointerdown',e=>{
  if(e.target.closest('button')) return;
  if(G.mode==='playing') fire();
});
document.addEventListener('visibilitychange',()=>{ if(document.hidden) pauseGame(); });
els.pause.onclick=e=>{ e.stopPropagation(); togglePause(); };
els.replay.onclick=e=>{
  e.stopPropagation(); ensureAudio(); speak(G.sample);
};
els.sound.onclick=e=>{
  e.stopPropagation();
  soundOn=!soundOn;
  els.sound.textContent=soundOn?'🔊':'🔇';
  if(!soundOn&&TTS_OK) speechSynthesis.cancel();
};

/* ============================================================
   主循环
============================================================ */
let last=performance.now();
function loop(now){
  const dt=Math.min(0.05,(now-last)/1000);
  last=now;
  const t=now/1000;
  update(dt,t);
  render(t);
  requestAnimationFrame(loop);
}

/* 启动 */
showStart();
requestAnimationFrame(loop);

})();
</script>

<!DOCTYPE html>
<html data-game="08" lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>食物打地鼠 · Food Whack-a-Mole</title>
<style>
  :root{
    --ink:#4a3b33;
    --ink-soft:#8b7768;
    --cream:#fff8ee;
    --pink:#ff8fb1;
    --pink-deep:#e2608c;
    --mint:#6fd0a4;
    --mint-deep:#43ae83;
    --outline:#ffe6d6;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    min-height:100%;
    font-family:'Comic Sans MS','YouYuan','Microsoft YaHei','PingFang SC',sans-serif;
    color:var(--ink);
    background:
      radial-gradient(circle at 12% 10%, #ffe3f1 0, transparent 38%),
      radial-gradient(circle at 88% 16%, #dff1ff 0, transparent 40%),
      radial-gradient(circle at 50% 100%, #d9f6dd 0, transparent 55%),
      linear-gradient(180deg,#fff9fb,#f2fbf6);
    -webkit-tap-highlight-color:transparent;
    user-select:none;
    overflow-x:hidden;
  }
  body::before,body::after{
    content:"";position:fixed;z-index:-1;border-radius:50%;pointer-events:none;
  }
  body::before{width:340px;height:340px;top:-90px;right:-70px;background:radial-gradient(circle,#ffd9ea,transparent 70%);opacity:.85;}
  body::after{width:320px;height:320px;bottom:-100px;left:-80px;background:radial-gradient(circle,#d9f0ff,transparent 70%);opacity:.85;}

  .wrap{max-width:min(960px,94vw,104vh);margin:0 auto;padding:12px 16px 20px;}

  /* ---------- 顶部 ---------- */
  .topbar{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;}
  .brand{display:flex;align-items:center;gap:12px;}
  .logo{
    width:52px;height:52px;border-radius:17px;background:#fffdf8;
    border:3px solid #ffe0cf;display:grid;place-items:center;
    box-shadow:0 6px 0 rgba(220,180,150,.25);
    flex:0 0 auto;
  }
  .logo svg{width:38px;height:38px;}
  .brand h1{margin:0;font-size:clamp(21px,2.3vw,28px);letter-spacing:1px;line-height:1.15;}
  .brand .sub{font-size:11px;letter-spacing:2.5px;color:#a7958a;font-weight:700;margin-top:2px;}

  .mode-switch{
    display:flex;gap:4px;padding:4px;background:#fff;border:3px solid var(--outline);
    border-radius:999px;box-shadow:0 6px 0 rgba(220,180,150,.18);
  }
  .mode-btn{
    border:0;background:transparent;cursor:pointer;font-family:inherit;
    font-size:13.5px;font-weight:700;color:#a89589;padding:9px 16px;border-radius:999px;
    transition:transform .15s, background .2s, color .2s, box-shadow .2s;
  }
  .mode-btn:hover{color:#8a7365;}
  .mode-btn.active{
    color:#fff;background:linear-gradient(180deg,#ffabc5,#ff88ae);
    box-shadow:0 4px 0 #e2608c;
  }
  .mode-btn.active[data-mode="pic"]{
    background:linear-gradient(180deg,#9fe3c3,#6fd0a4);
    box-shadow:0 4px 0 var(--mint-deep);
  }
  .mode-btn:active{transform:translateY(1px);}

  .top-actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:flex-end;}
  .speed-btn{
    font-family:inherit;font-size:13.5px;font-weight:700;color:#7a8b5a;
    background:#fff;border:3px solid #e3efd0;border-radius:999px;padding:9px 16px;
    cursor:pointer;box-shadow:0 5px 0 rgba(160,190,120,.25);
    transition:transform .15s, box-shadow .15s;white-space:nowrap;
  }
  .speed-btn:hover{transform:translateY(-2px);}
  .speed-btn:active{transform:translateY(1px);box-shadow:0 2px 0 rgba(160,190,120,.25);}

  /* ---------- 计分板 ---------- */
  .hud{display:flex;gap:8px;align-items:stretch;margin:12px 0 14px;flex-wrap:wrap;}
  .hud-box{
    background:#fff;border:3px solid #ffe9da;border-radius:20px;
    padding:8px 12px;box-shadow:0 5px 0 rgba(220,180,150,.18);
  }
  .hud-label{display:block;font-size:10px;letter-spacing:1.4px;color:#b4a094;font-weight:700;margin-bottom:2px;}
  .hud-score{min-width:92px;}
  #score{font-size:29px;line-height:1.05;font-weight:800;color:#ff79a3;display:inline-block;}
  #score.bump{animation:bump .3s ease;}
  .hud-lives{min-width:138px;}
  .hearts{display:flex;gap:2px;font-size:20px;line-height:1.2;}
  .heart{color:#ff6b8a;text-shadow:0 2px 0 rgba(200,60,90,.16);transition:color .25s, transform .25s;}
  .heart.lost{color:#e8ded8;text-shadow:none;transform:scale(.9);}

  .reset-btn{
    flex:0 0 auto;margin-left:auto;font-family:inherit;font-size:14px;font-weight:700;color:#8b6b58;
    background:#fff;border:3px solid var(--outline);border-radius:18px;padding:10px 16px;
    cursor:pointer;box-shadow:0 5px 0 rgba(220,180,150,.2);
    transition:transform .15s, box-shadow .15s;
  }
  .reset-btn:hover{transform:translateY(-2px);}
  .reset-btn:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(220,180,150,.2);}

  /* ---------- 草地棋盘 ---------- */
  .board{
    display:grid;
    grid-template-columns:repeat(6,minmax(0,1fr));
    gap:7px;
    padding:14px;
    border:7px solid #fff;
    border-radius:30px;
    background:
      radial-gradient(circle at 18% 14%, rgba(255,255,255,.6), transparent 26%),
      radial-gradient(circle at 82% 82%, rgba(255,255,255,.5), transparent 28%),
      radial-gradient(#c9eeb9 2.5px, transparent 2.5px),
      linear-gradient(180deg,#d9f5cb,#b4e5b3);
    background-size:auto,auto,26px 26px,auto;
    box-shadow:0 20px 42px rgba(110,160,120,.28), inset 0 -10px 20px rgba(80,150,90,.12);
  }
  .cell{position:relative;aspect-ratio:1 / .86;overflow:hidden;}
  .hole{
    position:absolute;left:50%;bottom:2%;width:94%;height:31%;
    transform:translateX(-50%);border-radius:50%;
    background:radial-gradient(ellipse at 50% 32%, #705547 0%, #523a2e 55%, #39251d 100%);
    box-shadow:
      inset 0 9px 15px rgba(0,0,0,.55),
      inset 0 -3px 0 rgba(255,255,255,.06),
      0 0 0 5px #d6c29e,
      0 5px 10px rgba(80,110,60,.18);
  }

  .mole{
    position:absolute;left:50%;bottom:6%;width:84%;height:90%;
    transform:translate(-50%,118%);
    transition:transform .36s cubic-bezier(.34,1.56,.64,1);
    pointer-events:none;
    filter:drop-shadow(0 8px 7px rgba(60,40,25,.16));
    z-index:3;
  }
  .mole.up{transform:translate(-50%,0);pointer-events:auto;cursor:pointer;}
  .mole .head{
    position:absolute;top:2%;left:50%;transform:translateX(-50%);
    width:56%;height:33%;
    background:radial-gradient(circle at 38% 26%, #c79d73 0%, #b2855b 58%, #a1754e 100%);
    border:3px solid #7c5738;
    border-radius:46% 46% 40% 40% / 58% 58% 42% 42%;
    z-index:1;
    box-shadow:inset 0 -6px 8px rgba(120,80,50,.2);
  }
  .mole .ear{
    position:absolute;top:-10%;width:32%;height:32%;border-radius:50%;
    background:#b98b62;border:3px solid #7c5738;
  }
  .mole .ear.l{left:-9%;}
  .mole .ear.r{right:-9%;}
  .mole .eye{
    position:absolute;top:36%;width:12%;aspect-ratio:1/1;border-radius:50%;
    background:#3c2a1e;
  }
  .mole .eye::after{
    content:"";position:absolute;top:12%;left:16%;width:42%;height:42%;
    border-radius:50%;background:#fff;
  }
  .mole .eye.l{left:25%;}
  .mole .eye.r{right:25%;}
  .mole .snout{
    position:absolute;top:57%;left:50%;transform:translateX(-50%);
    width:34%;height:20%;border-radius:50%;background:#ffb4bd;border:2px solid #d98d99;
  }

  .mole .card{
    position:absolute;left:0;bottom:0;width:100%;height:72%;container-type:inline-size;
    background:linear-gradient(180deg,#fffefa,#fff6e7);
    border:4px solid #f2dcc1;border-radius:18px;
    box-shadow:0 5px 0 rgba(190,150,110,.26), 0 14px 22px rgba(120,90,60,.18), inset 0 3px 0 rgba(255,255,255,.9);
    display:flex;align-items:center;justify-content:center;
    z-index:2;overflow:hidden;
  }
  .card .word{
    font-size:clamp(11px,1.3vw,18px);
    font-size:clamp(10px,14cqw,19px);
    font-weight:700;color:#5b4636;letter-spacing:.4px;line-height:1.05;
    text-align:center;padding:0 6%;
  }
  .card.is-pic{padding:7%;}
  .card.is-pic .pic{width:100%;height:100%;object-fit:contain;display:block;}

  .mole.hit .card{
    animation:pop .34s ease;
    background:linear-gradient(180deg,#f4fff9,#e2fbee);
    border-color:#8fe0b0;
    box-shadow:0 0 0 5px rgba(127,214,160,.35), 0 5px 0 rgba(140,200,160,.3);
  }
  .mole.wrong .card{
    animation:shake .4s ease;
    background:linear-gradient(180deg,#fff0f0,#ffe2e2);
    border-color:#ffb0b0;
  }
  .mole.up:active .card{transform:scale(.96);}

  .float{
    position:absolute;left:50%;bottom:46%;transform:translateX(-50%);
    font-weight:800;font-size:19px;pointer-events:none;z-index:6;white-space:nowrap;
    animation:floatUp .8s ease-out forwards;
  }
  .float.good{color:#2fa96b;text-shadow:0 2px 0 #fff, 0 0 10px rgba(120,220,160,.6);}
  .float.bad{color:#e25555;text-shadow:0 2px 0 #fff;}

  .tip{
    text-align:center;font-size:12.5px;color:#93a08c;letter-spacing:.5px;
    margin:11px 0 0;
  }
  .tip b{color:#4f9b6a;}

  /* ---------- 提示条 ---------- */
  .toast{
    position:fixed;left:50%;bottom:18px;transform:translate(-50%,12px);
    background:#fff;border:4px solid #c9efd6;border-radius:22px;
    padding:10px 22px;font-weight:700;color:#3f8b5f;font-size:16px;
    box-shadow:0 14px 34px rgba(80,140,100,.25);z-index:70;
    opacity:0;pointer-events:none;transition:opacity .25s, transform .25s;white-space:nowrap;
  }
  .toast.show{opacity:1;transform:translate(-50%,0);}
  .toast .dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#7fd6a0;margin-right:7px;vertical-align:2px;}

  /* ---------- 弹窗 ---------- */
  .overlay{
    position:fixed;inset:0;z-index:80;display:flex;align-items:center;justify-content:center;
    padding:20px;background:rgba(74,59,51,.42);
    -webkit-backdrop-filter:blur(5px);backdrop-filter:blur(5px);
    opacity:1;visibility:visible;transition:opacity .25s, visibility .25s;
  }
  .overlay.hide{opacity:0;visibility:hidden;pointer-events:none;}
  .panel{
    width:min(450px,92vw);max-height:92vh;overflow:auto;
    background:linear-gradient(180deg,#fffdf8,#fff3e6);
    border:6px solid #ffdcc4;border-radius:32px;padding:26px 30px 30px;
    text-align:center;box-shadow:0 24px 50px rgba(90,60,40,.3);
  }
  .mascot{
    width:88px;height:88px;margin:0 auto 8px;border-radius:50%;
    background:radial-gradient(circle at 50% 30%,#fff,#fff1e4);
    border:4px solid #ffe2cf;display:grid;place-items:center;
    box-shadow:0 8px 0 rgba(220,180,150,.2);
  }
  .mascot svg{width:66px;height:66px;}
  .panel h2{margin:4px 0 4px;font-size:27px;letter-spacing:1px;}
  .panel .en{margin:0 0 16px;font-size:11px;letter-spacing:2.4px;color:#b5a195;font-weight:700;}
  .rules{list-style:none;margin:0 0 14px;padding:0;text-align:left;}
  .rules li{
    position:relative;padding-left:20px;margin:8px 0;
    font-size:13.5px;line-height:1.65;color:#7f6b5e;
  }
  .rules li::before{
    content:"";position:absolute;left:2px;top:9px;width:8px;height:8px;border-radius:50%;
    background:#ffb0c6;box-shadow:0 0 0 3px #ffe4ed;
  }
  .rules b{color:#e2608c;}
  .switch-tip{
    margin:0 0 18px;font-size:12px;color:#9a887b;background:#f7f3ee;
    border-radius:12px;padding:8px 12px;line-height:1.5;
  }
  .primary{
    font-family:inherit;font-size:17px;font-weight:800;color:#fff;letter-spacing:1px;
    background:linear-gradient(180deg,#ffa2c0,#ff7ba5);border:0;border-radius:999px;
    padding:14px 40px;cursor:pointer;
    box-shadow:0 6px 0 var(--pink-deep), 0 12px 22px rgba(255,120,160,.35);
    transition:transform .15s, box-shadow .15s;
  }
  .primary:hover{transform:translateY(-2px);}
  .primary:active{transform:translateY(3px);box-shadow:0 3px 0 var(--pink-deep);}

  .final-score{font-size:54px;font-weight:800;color:#ff79a3;line-height:1.05;margin:4px 0 0;}
  .final-score small{font-size:15px;color:#c0a79a;font-weight:700;margin-left:4px;}
  .stars{font-size:30px;letter-spacing:6px;color:#ffc93c;margin:6px 0 4px;text-shadow:0 3px 0 rgba(220,160,20,.18);}
  #finalMsg{margin:2px 0 12px;font-size:14px;color:#8a7568;line-height:1.6;}
  .final-hits{font-size:12.5px;color:#a39083;margin:0 0 18px;}
  .final-hits b{color:#4f9b6a;font-size:15px;}

  @keyframes floatUp{
    0%{opacity:0;transform:translate(-50%,12px) scale(.85);}
    22%{opacity:1;transform:translate(-50%,0) scale(1.08);}
    100%{opacity:0;transform:translate(-50%,-34px) scale(1);}
  }
  @keyframes shake{
    0%,100%{transform:translateX(0);}
    20%{transform:translateX(-6px) rotate(-2deg);}
    40%{transform:translateX(6px) rotate(2deg);}
    60%{transform:translateX(-4px);}
    80%{transform:translateX(4px);}
  }
  @keyframes pop{
    0%{transform:scale(1);}
    42%{transform:scale(1.12);}
    100%{transform:scale(1);}
  }
  @keyframes bump{
    0%{transform:scale(1);}
    45%{transform:scale(1.22);}
    100%{transform:scale(1);}
  }

  @media (max-width:700px){
    .brand h1{font-size:22px;}
    .mode-btn{font-size:12px;padding:8px 12px;}
  }
</style>
<link rel="stylesheet" href="/assets/games/game-display.css">
<script defer src="/assets/games/game-display.js"></script>
</head>

    <div class="brand">
      <div class="logo" aria-hidden="true">
        <svg viewBox="0 0 100 100">
          <circle cx="20" cy="31" r="11" fill="#b98b62" stroke="#7c5738" stroke-width="4"/>
          <circle cx="80" cy="31" r="11" fill="#b98b62" stroke="#7c5738" stroke-width="4"/>
          <path d="M50 16c19 0 33 14 33 33S69 82 50 82 17 68 17 49s14-33 33-33z" fill="#b98b62" stroke="#7c5738" stroke-width="4"/>

      <span class="hud-label">生命 LIVES</span>
      <div class="hearts" id="hearts" aria-label="剩余生命"></div>
    </div>
    <button class="reset-btn" id="resetBtn" type="button">重置游戏</button>
  </section>

  <main class="board" id="board" aria-label="4行6列打地鼠棋盘"></main>

        <circle cx="20" cy="31" r="11" fill="#b98b62" stroke="#7c5738" stroke-width="4"/>

        <ellipse cx="50" cy="60" rx="9" ry="7" fill="#ffb4bd" stroke="#d98d99" stroke-width="3"/>
        <path d="M50 66v5M43 74q7 5 14 0" fill="none" stroke="#7c5738" stroke-width="2.5" stroke-linecap="round"/>

    <h2>食物打地鼠</h2>
    <p class="en">FOOD WHACK-A-MOLE</p>

<div class="overlay hide" id="overOverlay">

    <p class="final-hits">一共打中 <b id="finalHits">0</b> 只目标地鼠</p>
    <button class="primary" id="replayBtn" type="button">再玩一次</button>
  </div>
</div>

<script>
"use strict";

/* ================= 词库与图片（base64 内嵌） ================= */
const WORDS = [
  { word:'rice',       zh:'米饭' },
  { word:'egg',        zh:'鸡蛋' },
  { word:'tomato',     zh:'西红柿' },
  { word:'bread',      zh:'面包' },
  { word:'juice',      zh:'果汁' },
  { word:'vegetables', zh:'蔬菜' },
  { word:'eat',        zh:'吃' },
  { word:'food',       zh:'食物' }

/* ================= 配置 ================= */
const ROWS = 4, COLS = 6;
const TOTAL_CELLS = ROWS * COLS;
const MAX_LIVES = 5;
const POINT = 10;
const MATCH_CHANCE = 0.5; /* 每只地鼠的读音与卡片相符的概率 */

/* 速度档位：stay = 地鼠停留时间(ms)，gap = 一只下去后隔多久上来下一只 */
const SPEEDS = [
  { key:'slow', label:'慢速', icon:'🐢', stayMin:3300, stayMax:4100, gap:1000, rate:.78 },
  { key:'mid',  label:'中速', icon:'🐰', stayMin:2200, stayMax:2900, gap:600,  rate:.85 },
  { key:'fast', label:'快速', icon:'🚀', stayMin:1400, stayMax:1900, gap:300,  rate:.95 }
];
let speedIdx = 1;
function curSpeed(){ return SPEEDS[speedIdx]; }

/* ================= 状态 ================= */
const state = {
  mode: 'word',
  running: false,
  over: false,
  score: 0,
  lives: MAX_LIVES,
  totalHits: 0,
  spawnTimer: null,
  session: 0
};

let slots = [];
let heartEls = [];

/* ================= DOM ================= */

const overOverlay  = document.getElementById('overOverlay');

/* ================= 音效（WebAudio，无外部文件） ================= */
let audioCtx = null;

function ensureAudio(){
  try{
    const AC = window.AudioContext || window.webkitAudioContext;
    if(!AC) return;
    if(!audioCtx) audioCtx = new AC();
    if(audioCtx.state === 'suspended') audioCtx.resume();
  }catch(e){ /* 忽略音频失败 */ }
}

function note(freq, delay, dur, type, vol){
  if(!audioCtx) return;
  const t = audioCtx.currentTime + delay;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = type || 'sine';
  osc.frequency.setValueAtTime(freq, t);
  gain.gain.setValueAtTime(0, t);
  gain.gain.linearRampToValueAtTime(vol || .18, t + .02);
  gain.gain.exponentialRampToValueAtTime(.0001, t + dur);
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start(t);
  osc.stop(t + dur + .03);
}

function sfxGood(){
  ensureAudio();
  note(740, 0, .14, 'sine', .18);
  note(988, .11, .16, 'sine', .18);
  note(1245, .24, .22, 'sine', .16);
}
function sfxBad(){
  ensureAudio();
  note(230, 0, .16, 'sawtooth', .1);
  note(150, .1, .24, 'sawtooth', .1);
}
function sfxOver(){
  ensureAudio();
  note(660, 0, .2, 'triangle', .14);
  note(520, .18, .25, 'triangle', .14);
  note(360, .38, .45, 'triangle', .12);
}

/* ================= 语音朗读（浏览器内置 TTS） ================= */
const synth = window.speechSynthesis || null;
let chosenVoice = null;
let speechQueue = [];
let speechBusy = false;
let speechBusyAt = 0;

function initSpeech(){
  if(!synth) return;
  loadVoices();
  if(synth.addEventListener) synth.addEventListener('voiceschanged', loadVoices);
}
function loadVoices(){
  if(!synth) return;
  try{
    const voices = synth.getVoices() || [];
    chosenVoice =
      voices.find(v => /^en[-_]US/i.test(v.lang) && /(zira|aria|jenny|samantha|female|natural)/i.test(v.name)) ||
      voices.find(v => /^en[-_]US/i.test(v.lang)) ||
      voices.find(v => /^en[-_]/i.test(v.lang)) ||
      null;
  }catch(e){}
}
function say(text, opts){
  if(!synth || !text) return;
  const clear = !!(opts && opts.clear);
  if(clear){
    try{ synth.cancel(); }catch(e){}
    speechQueue = [];
    speechBusy = false;
  }
  if(speechBusy && Date.now() - speechBusyAt > 2600) speechBusy = false;
  if(text === speechQueue[speechQueue.length - 1]) return;
  if(speechBusy && speechQueue.length >= 2) return;
  speechQueue.push(text);
  pumpSpeech();
}
function pumpSpeech(){
  if(!synth || speechBusy || !speechQueue.length) return;
  const text = speechQueue.shift();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'en-US';
  u.rate = curSpeed().rate;
  u.pitch = 1.1;
  u.volume = 1;
  if(chosenVoice) u.voice = chosenVoice;
  u.onend = function(){ speechBusy = false; setTimeout(pumpSpeech, 50); };
  u.onerror = function(){ speechBusy = false; setTimeout(pumpSpeech, 50); };
  speechBusy = true;
  speechBusyAt = Date.now();
  try{
    if(synth.paused) synth.resume();
    synth.speak(u);
  }catch(e){
    speechBusy = false;
  }
}
function stopSpeech(){
  speechQueue = [];
  speechBusy = false;
  if(synth){ try{ synth.cancel(); }catch(e){} }
}

/* ================= 工具 ================= */
const rand = (min, max) => min + Math.random() * (max - min);

/* ================= 棋盘 ================= */
function buildBoard(){
  boardEl.innerHTML = '';
  slots = [];
  for(let i = 0; i < TOTAL_CELLS; i++){
    const cell = document.createElement('div');
    cell.className = 'cell';
    cell.innerHTML =
      '<div class="hole"></div>' +
      '<div class="mole" role="button" aria-label="地鼠">' +
        '<div class="head">' +
          '<span class="ear l"></span><span class="ear r"></span>' +
          '<span class="eye l"></span><span class="eye r"></span>' +
          '<span class="snout"></span>' +
        '</div>' +
        '<div class="card"></div>' +
      '</div>';
    boardEl.appendChild(cell);

    const moleEl = cell.querySelector('.mole');
    const slot = {
      cell: cell,
      mole: moleEl,
      card: cell.querySelector('.card'),
      up: false,
      locked: false,
      word: null,    /* 卡片显示的词 */
      spoken: null,  /* 本次播放的读音 */
      match: false,  /* 读音与卡片是否相符 */
      timer: null
    };
    slots.push(slot);
    moleEl.addEventListener('click', () => onHit(slot));
  }
}

function buildHearts(){
  heartsEl.innerHTML = '';
  heartEls = [];
  for(let i = 0; i < MAX_LIVES; i++){
    const h = document.createElement('span');
    h.className = 'heart';
    h.textContent = '♥';
    heartsEl.appendChild(h);
    heartEls.push(h);
  }
}

/* ================= 渲染 ================= */
function renderHud(bump){
  scoreEl.textContent = state.score;
  if(bump){
    scoreEl.classList.remove('bump');
    void scoreEl.offsetWidth;
    scoreEl.classList.add('bump');
  }
  heartEls.forEach((h, i) => h.classList.toggle('lost', i >= state.lives));
}

function renderCard(slot, wordObj){
  if(state.mode === 'word'){
    slot.card.className = 'card is-word';
    slot.card.innerHTML = '<span class="word">' + wordObj.word + '</span>';
  }else{
    slot.card.className = 'card is-pic';
    slot.card.innerHTML = '<img class="pic" src="' + IMAGES[wordObj.word] + '" alt="">';
  }
}

function renderModeUi(){
  modeBtns.forEach(b => b.classList.toggle('active', b.dataset.mode === state.mode));
  tipEl.innerHTML = state.mode === 'word'
    ? '听读音、看单词：读音和单词<b>相符就打</b>（漏打扣生命），<b>不相符就等它下去</b>（打了扣生命）！'
    : '听读音、看图片：读音和图片<b>相符就打</b>（漏打扣生命），<b>不相符就等它下去</b>（打了扣生命）！';
}

function renderSpeed(){
  const sp = curSpeed();
  speedBtn.textContent = sp.icon + ' ' + sp.label;
  speedBtn.dataset.key = sp.key;
}

/* ================= 游戏状态 ================= */
function prepareState(){
  state.session++;
  state.running = false;
  clearTimeout(state.spawnTimer);
  state.spawnTimer = null;
  slots.forEach(retreat);
  state.over = false;
  state.score = 0;
  state.lives = MAX_LIVES;
  state.totalHits = 0;
  renderHud(false);
}

/* ================= 地鼠弹出（一次一只） ================= */
/* 每一轮：随机一个卡片词，再按概率决定读音与卡片是否相符 */
function pickRound(){
  const display = WORDS[Math.floor(Math.random() * WORDS.length)];
  if(Math.random() < MATCH_CHANCE){
    return { display: display, spoken: display, match: true };
  }
  const others = WORDS.filter(w => w.word !== display.word);
  const spoken = others[Math.floor(Math.random() * others.length)];
  return { display: display, spoken: spoken, match: false };
}

function scheduleNext(delay){
  clearTimeout(state.spawnTimer);
  state.spawnTimer = setTimeout(spawnLoop, delay);
}

function spawnLoop(){
  if(!state.running || state.over) return;
  if(slots.some(s => s.up)) return;
  const slot = slots[Math.floor(Math.random() * slots.length)];
  popSlot(slot, pickRound());
}

function popSlot(slot, round){
  clearTimeout(slot.timer);
  slot.up = true;
  slot.locked = false;
  slot.word = round.display;
  slot.spoken = round.spoken;
  slot.match = round.match;
  slot.mole.classList.remove('hit', 'wrong');
  renderCard(slot, round.display);
  slot.mole.classList.add('up');
  /* 清空语音队列再读，保证听到的就是本次播放的词，避免队列延迟导致误判 */
  say(round.spoken.word, { clear:true });
  const sp = curSpeed();
  slot.timer = setTimeout(() => onMoleDown(slot), rand(sp.stayMin, sp.stayMax));
}

/* 地鼠自己缩回：若读音与卡片相符而没打 → 漏打，扣 1 点生命 */
function onMoleDown(slot){
  if(!slot.up || slot.locked) { retreat(slot); return; }
  if(slot.match && state.running && !state.over){
    slot.locked = true;
    loseLife(slot, '读音和卡片相符，别漏打！');
    slot.mole.classList.add('wrong');
    setTimeout(() => retreat(slot), 450);
  }else{
    retreat(slot);
  }
}

function retreat(slot){
  if(slot.timer){ clearTimeout(slot.timer); slot.timer = null; }
  slot.up = false;
  slot.locked = false;
  slot.word = null;
  slot.spoken = null;
  slot.match = false;
  slot.mole.classList.remove('up');
  setTimeout(() => {
    if(!slot.up) slot.mole.classList.remove('hit', 'wrong');
  }, 320);
  /* 一只下去了，隔一会儿下一只再上来 */
  if(state.running && !state.over){
    scheduleNext(curSpeed().gap);
  }
}

/* ================= 点击判定 ================= */
function onHit(slot){
  if(!state.running || state.over) return;
  if(!slot.up || slot.locked || !slot.word) return;

  const correct = slot.match; /* 读音与卡片相符才该打 */
  slot.locked = true;
  clearTimeout(slot.timer);
  slot.timer = null;

  if(correct){
    state.score += POINT;
    state.totalHits += 1;
    sfxGood();
    showFloat(slot.cell, '+' + POINT, 'good');
    slot.mole.classList.add('hit');
    renderHud(true);
    setTimeout(() => retreat(slot), 400);
  }else{
    /* 读音与卡片不相符却打了 → 扣 1 点生命 */
    loseLife(slot);
    slot.mole.classList.add('wrong');
    setTimeout(() => retreat(slot), 420);
  }
}

function loseLife(slot, reason){
  state.lives = Math.max(0, state.lives - 1);
  sfxBad();
  showFloat(slot.cell, '-1 ♥', 'bad');
  renderHud(false);
  if(reason) showToast(reason);
  if(state.lives <= 0 && !state.over){
    state.over = true;
    state.running = false;
    clearTimeout(state.spawnTimer);
    const sid = state.session;
    setTimeout(() => {
      if(sid !== state.session) return;
      gameOver();
    }, 600);
  }
}

function showFloat(cell, text, cls){
  const el = document.createElement('div');
  el.className = 'float ' + cls;
  el.textContent = text;
  cell.appendChild(el);
  setTimeout(() => el.remove(), 820);
}

/* ================= 提示条 ================= */
let toastTimer = null;
function showToast(text){
  toastTextEl.textContent = text;
  toastEl.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove('show'), 1800);
}

/* ================= 流程控制 ================= */
function startGame(){
  ensureAudio();
  startOverlay.classList.add('hide');
  overOverlay.classList.add('hide');
  prepareState();
  state.running = true;
  renderModeUi();
  spawnLoop();
}

function gameOver(){
  state.running = false;
  state.over = true;
  clearTimeout(state.spawnTimer);
  state.spawnTimer = null;
  slots.forEach(retreat);
  stopSpeech();
  sfxOver();

  finalScoreEl.textContent = state.score;
  finalHitsEl.textContent = state.totalHits;

  let stars = 1;
  let msg = '继续加油，多听多读，你一定可以的！';
  if(state.totalHits >= 9){ stars = 3; msg = '太棒了！这些食物单词你都记住啦！'; }
  else if(state.totalHits >= 5){ stars = 2; msg = '很不错！再挑战一次，争取三颗星！'; }
  finalStarsEl.textContent = '★'.repeat(stars) + '☆'.repeat(3 - stars);
  finalMsgEl.textContent = msg;

  overOverlay.classList.remove('hide');
}

/* ================= 事件绑定 ================= */
modeBtns.forEach(btn => {
  btn.addEventListener('click', () => {
    if(state.mode === btn.dataset.mode) return;
    state.mode = btn.dataset.mode;
    renderModeUi();
    slots.forEach(s => { if(s.up && s.word) renderCard(s, s.word); });
    /* 切换模式后，重读当前地鼠的读音，避免学生来不及反应 */
    const cur = slots.find(s => s.up && s.spoken);
    if(state.running && !state.over && cur){
      say(cur.spoken.word, { clear:true });
    }
  });
});

resetBtn.addEventListener('click', () => {
  ensureAudio();
  startGame();
});

speedBtn.addEventListener('click', () => {
  ensureAudio();
  speedIdx = (speedIdx + 1) % SPEEDS.length;
  renderSpeed();
  showToast('速度切换为 ' + curSpeed().label + ' ' + curSpeed().icon);
});

document.getElementById('startBtn').addEventListener('click', startGame);
document.getElementById('replayBtn').addEventListener('click', startGame);

/* ================= 初始化 ================= */
(function init(){
  buildBoard();
  buildHearts();
  initSpeech();
  renderSpeed();
  renderModeUi();
  prepareState();
  renderHud(false);
})();
</script>
</body>
</html>

- title: Shandong’s Yellow River Cities Combine Smart Manufacturing with Green Energy
  title_zh: 山东沿黄城市推进智能制造与绿色能源
  url: https://www.news.cn/fortune/20261106/c681ecdb253a4931bf79a846e1afa3ae/c.html
  published: '2026-11-06T00:00:00+08:00'
  source: 新华社财经
  category: Business & economy
  source_id: xinhua-finance
  authority: news_agency
  coverage: china
  why: Xinhua Finance reported smart factories, industrial AI, vehicle production
    and offshore wind equipment across several Yellow River cities in Shandong. Provincial
    statistics showed a 7.4% year-on-year rise in industrial value added above designated
    size in the first three quarters, while equipment manufacturing grew 12%.
  why_zh: 新华社财经报道了山东多个沿黄城市的智能工厂、工业人工智能、汽车生产和海上风电装备。山东省统计局数据显示，前三季度规模以上工业增加值同比增长7.4%，装备制造业增长12%。
- title: ECB Publishes Consolidated EU Banking Data for End-June 2026
  title_zh: 欧洲央行发布截至2026年6月底的欧盟银行合并数据
  url: https://www.ecb.europa.eu/press/pr/date/2026/html/ecb.pr261106~356f2fc73a.en.html
  published: '2026-11-06T09:00:00+00:00'
  source: European Central Bank
  category: Business & economy
  source_id: ecb-data
  authority: central_bank
  coverage: world
  why: The ECB reported that EU-headquartered credit institutions’ total assets rose
    5.18% to €34.99 trillion in June 2026 from €33.27 trillion a year earlier. Their
    aggregate non-performing loan ratio increased 0.03 percentage points year on year
    to 1.99%.
  why_zh: 欧洲央行数据显示，欧盟总部信贷机构总资产由2025年6月的33.27万亿欧元增至2026年6月的34.99万亿欧元，同比增长5.18%。同期不良贷款率同比上升0.03个百分点，达到1.99%。
- title: NVIDIA Adds Four Open-Weight Cosmos 3 Simulation Checkpoints
  title_zh: 英伟达为Cosmos 3新增四个开放权重模拟检查点
  url: https://huggingface.co/blog/nvidia/cosmos-interactive-world-simulation
  published: '2026-11-05T19:35:16+00:00'
  source: Hugging Face
  category: AI tools & model releases
  source_id: huggingface
  authority: developer_primary
  coverage: world
  why: NVIDIA published four Cosmos 3 Nano post-training checkpoints for driving-data
    generation, streaming driving simulation, simulator-to-image conversion and bimanual
    robot video prediction via Hugging Face. NVIDIA said each checkpoint has 16 billion
    trainable parameters.
  why_zh: 英伟达通过Hugging Face发布了Cosmos 3 Nano的四个后训练检查点，分别用于驾驶数据生成、流式驾驶模拟、模拟器转图像和双臂机器人视频预测。英伟达称，每个检查点有160亿个可训练参数。
- title: Gemini Omni 1.2 Flash Adds Longer Video and Conversational Editing
  title_zh: Gemini Omni 1.2 Flash加入更长视频与对话式编辑
  url: https://blog.google/innovation-and-ai/technology/developers-tools/introducing-gemini-omni-1-2-flash
  published: '2026-11-05T17:00:00+00:00'
  source: Google AI
  category: AI tools & model releases
  source_id: google-ai
  authority: developer_primary
  coverage: world
  why: Google said Gemini Omni 1.2 Flash is generally available through the Gemini
    API and Google Cloud, with native video generation up to 15 seconds and multi-turn
    conversational editing. It said the 720p price is $0.07 per second, 30% below
    version 1.1.
  why_zh: Google称Gemini Omni 1.2 Flash已通过Gemini API和Google Cloud普遍提供，可原生生成最长15秒视频，并支持多轮对话式编辑。其720p价格为每秒0.07美元，比1.1版低30%。
- title: Agile Deliberation Makes Subjective Image Labeling Interactive
  title_zh: Agile Deliberation把主观图像标签转化为交互过程
  url: https://research.google/blog/agile-deliberation-how-ai-helps-humans-define-the-gray-areas
  published: '2026-11-04T18:07:05+00:00'
  source: Google Research
  category: Research tools
  source_id: google-research
  authority: developer_primary
  coverage: world
  why: Google Research presented Agile Deliberation, which helps users define subjective
    image categories through concept scoping, borderline-example feedback and automatic
    prompt refinement. Its evaluation included 18 live sessions of 1.5 hours each,
    and the underlying code was open-sourced.
  why_zh: Google Research提出Agile Deliberation，通过概念范围界定、边界样本反馈和自动提示优化，协助用户构建主观图像分类器。研究包括18次、每次1.5小时的真人实验，并开放了底层代码。

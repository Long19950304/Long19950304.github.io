  - id: chinese-passenger
    group: short-film
    title:
      zh: 普快列车
      en: Chinese Passenger
    format:
      zh: 实验短片
      en: Experimental short film
    description:
      zh: 澳门大学硕士论文作品，关注中国内地移民的生活经验。
      en: An experimental short film about Chinese inland migrants’ lived experience, produced as an MA thesis at the University of Macau.
    recognition:
      zh: 入围／展映：澳门国际电影节短片单元（2017）
      en: Shortlisted / selected for the Macao International Film Festival short film section (2017).

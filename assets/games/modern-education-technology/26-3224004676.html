const LEVELS = [
  { cols: 5, mines: 5, label: '5×5 新手' },

function shuffle(a) {
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

CATEGORIES.forEach(c => {
  c.words = c.w.split(',').map(s => { const [en, zh] = s.split('|'); return { en, zh, cat: c }; });
  delete c.w;
});
const ALL = [];
CATEGORIES.forEach(c => ALL.push(...c.words));

function genGame(cols, mines, cat) {
  const total = cols * cols;
  // 地雷单词：从类别中抽取，单词数量不足时允许每个词最多出现 2 次
  const cw = shuffle(cat.words.slice());
  const cap = Math.min(2, Math.max(1, Math.ceil(mines / cw.length)));
  const mpool = [];
  cw.forEach(w => { for (let k = 0; k < cap; k++) mpool.push(w); });
  shuffle(mpool);
  const mineUnits = mpool.slice(0, Math.min(mines, mpool.length));
  // 安全单词：从其他所有类别中抽取，互不重复
  const safePool = shuffle(ALL.filter(w => w.cat !== cat));
  const safeUnits = safePool.slice(0, total - mineUnits.length);
  const units = shuffle(mineUnits.concat(safeUnits));
  const cells = units.map(u => ({ w: u, mine: u.cat === cat, revealed: false, flagged: false, n: 0 }));
  // 计算每个格子周围的地雷数
  cells.forEach((c, i) => {
    if (c.mine) return;
    const r = Math.floor(i / cols), cc = i % cols;
    for (let dr = -1; dr <= 1; dr++) for (let dc = -1; dc <= 1; dc++) {
      if (!dr && !dc) continue;
      const nr = r + dr, nc = cc + dc;
      if (nr < 0 || nr >= cols || nc < 0 || nc >= cols) continue;
      if (cells[nr * cols + nc].mine) c.n++;
    }
  });
  const placedEn = new Set(mineUnits.map(w => w.en));
  return {
    cat, cells, cols, total, mines: mineUnits.length, placedEn, catWords: cat.words,
    revealed: 0, flags: 0, over: false, started: false, secs: 0, flagMode: false
  };
}
/*GEN-END*/

const $ = s => document.querySelector(s);
const grid = $('#grid'), banner = $('#banner');
const mineEl = $('#mineLeft'), progEl = $('#progress'), timeEl = $('#time');
let level = LEVELS[0], G = null, timerId = null, lpTimer = null, lpFired = false;

function buildLevels() {
  const box = $('#levels');
  LEVELS.forEach((lv, i) => {
    const b = document.createElement('button');
    b.className = 'level-btn';
    b.textContent = lv.label;
    b.onclick = () => {
      level = lv;
      [...box.children].forEach((x, k) => x.classList.toggle('active', k === i));
      newGame();
    };
    box.appendChild(b);
  });
  box.children[0].classList.add('active');
}

function newGame() {
  stopTimer();
  G = genGame(level.cols, level.mines, CATEGORIES[Math.floor(Math.random() * CATEGORIES.length)]);
  setFlagBtn(false);
  render();
  timeEl.textContent = '0s';
  updateHUD();
}

function render() {
  grid.innerHTML = '';
  grid.style.gridTemplateColumns = `repeat(${G.cols},1fr)`;
  grid.style.width = `${G.cols * 54 + (G.cols - 1) * 3}px`;
  const unplaced = G.catWords.filter(w => !G.placedEn.has(w.en));
  banner.innerHTML =
    `<div class="cat">地雷类别：${G.cat.n} ${G.cat.en}</div>` +
    `<div class="note">属于该类别的单词是地雷，点到即爆炸 · 本局地雷 ${G.mines} 个 · 排除全部安全单词即获胜</div>` +
    (unplaced.length
      ? `<div class="eg">同类词参考（不在本局棋盘上）：${unplaced.slice(0, 2).map(w => `${w.en} ${w.zh}`).join(' · ')}</div>`
      : '');
  G.cells.forEach((c, i) => {
    const d = document.createElement('div');
    d.className = 'cell';
    d.dataset.i = i;
    d.textContent = c.w.en; // 点击前只显示英文，中文意思点击后出现
    grid.appendChild(d);
  });
  requestAnimationFrame(sizeWords);
}

function sizeWords() {
  if (!G) return;
  const cellPx = (grid.clientWidth - (G.cols - 1) * 3) / G.cols;
  [...grid.children].forEach((el, i) => {
    const len = G.cells[i].w.en.length;
    let f = Math.min(cellPx * 0.36, cellPx * 1.8 / Math.max(3, len));
    f = Math.max(8.5, Math.min(15, f));
    el.style.fontSize = f + 'px';
  });
}

const cellEl = i => grid.children[i];

function updateHUD() {
  mineEl.textContent = G.mines - G.flags;
  progEl.textContent = `${G.revealed}/${G.total - G.mines}`;
}

function fmt(s) {
  return s < 60 ? s + 's' : Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
}

function startTimer() {
  G.t0 = Date.now();
  timerId = setInterval(() => {
    G.secs = Math.round((Date.now() - G.t0) / 1000);
    timeEl.textContent = fmt(G.secs);
  }, 500);
}

function stopTimer() {
  if (timerId) { clearInterval(timerId); timerId = null; }
}

grid.addEventListener('click', e => {
  if (lpFired) { lpFired = false; return; }
  const d = e.target.closest('.cell');
  if (!d) return;
  const i = +d.dataset.i;
  G.flagMode ? toggleFlag(i) : reveal(i);
});
grid.addEventListener('contextmenu', e => {
  e.preventDefault();
  if (lpFired) { lpFired = false; return; } // 手机长按已处理，避免重复切换
  const d = e.target.closest('.cell');
  if (d) toggleFlag(+d.dataset.i);
});
grid.addEventListener('touchstart', e => {
  const d = e.target.closest('.cell');
  if (!d) return;
  lpFired = false;
  lpTimer = setTimeout(() => {
    lpFired = true;
    toggleFlag(+d.dataset.i);
    if (navigator.vibrate) navigator.vibrate(30);
  }, 420);
}, { passive: true });
grid.addEventListener('touchend', () => clearTimeout(lpTimer));
grid.addEventListener('touchmove', () => clearTimeout(lpTimer));

function setContent(el, c, withNum) {
  el.innerHTML = `<span class="w">${c.w.en}</span><span class="zh">${c.w.zh}</span>` +
    (withNum && c.n ? `<span class="num n${Math.min(c.n, 8)}">${c.n}</span>` : '');
}

function reveal(i) {
  if (G.over) return;
  const c = G.cells[i];
  if (c.revealed || c.flagged) return;
  if (!G.started) { G.started = true; startTimer(); }
  if (c.mine) { lose(i); return; }
  const st = [i];
  while (st.length) {
    const j = st.pop(), cc = G.cells[j];
    if (cc.revealed || cc.flagged) continue;
    cc.revealed = true;
    G.revealed++;
    const el = cellEl(j);
    el.classList.add('revealed');
    setContent(el, cc, true);
    if (cc.n === 0) {
      const r = Math.floor(j / G.cols), ccx = j % G.cols;
      for (let dr = -1; dr <= 1; dr++) for (let dc = -1; dc <= 1; dc++) {
        if (!dr && !dc) continue;
        const nr = r + dr, nc = ccx + dc;
        if (nr < 0 || nr >= G.cols || nc < 0 || nc >= G.cols) continue;
        const k = nr * G.cols + nc;
        if (!G.cells[k].revealed && !G.cells[k].flagged) st.push(k);
      }
    }
  }
  updateHUD();
  if (G.revealed === G.total - G.mines) win();
}

function toggleFlag(i) {
  if (G.over) return;
  const c = G.cells[i];
  if (c.revealed) return;
  c.flagged = !c.flagged;
  G.flags += c.flagged ? 1 : -1;
  cellEl(i).classList.toggle('flagged', c.flagged);
  updateHUD();
}

function lose(i) {
  G.over = true;
  stopTimer();
  // 结束时翻开所有单词并显示中文，方便学习
  G.cells.forEach((c, j) => {
    const el = cellEl(j);
    if (c.mine) el.classList.add('mine');
    else if (c.flagged) el.classList.add('wrongflag');
    if (!c.revealed) setContent(el, c, false);
  });
  cellEl(i).classList.add('boom');
  setTimeout(() => showResult(false, i), 900);
}

function win() {
  G.over = true;
  stopTimer();
  G.cells.forEach((c, j) => { if (c.mine) cellEl(j).classList.add('flagged'); });
  setTimeout(() => showResult(true), 500);
}

function showResult(won, i) {
  $('#resultTitle').textContent = won ? '排雷成功！' : '砰！踩到地雷了';
  $('#resultDesc').innerHTML = won
    ? `用时 ${fmt(G.secs)}，成功排除全部 ${G.revealed} 个安全单词。`
    : `“${G.cells[i].w.en}”（${G.cells[i].w.zh}）属于地雷类别【${G.cat.n} ${G.cat.en}】。`;
  const chips = G.catWords.map(w =>
    `<span class="wchip${G.placedEn.has(w.en) ? ' placed' : ''}">${G.placedEn.has(w.en) ? '\u1F4A3 ' : ''}${w.en} ${w.zh}</span>`
  ).join('');
  $('#recap').innerHTML =
    `<div class="rt">地雷类别：${G.cat.n} ${G.cat.en}（\u1F4A3 = 本局棋盘上的地雷）</div><div class="chips">${chips}</div>`;
  $('#overlay').classList.remove('hidden');
}

$('#againBtn').onclick = () => { $('#overlay').classList.add('hidden'); newGame(); };
$('#newBtn').onclick = () => { $('#overlay').classList.add('hidden'); newGame(); };
$('#flagBtn').onclick = () => setFlagBtn(!G.flagMode);

function setFlagBtn(v) {
  G.flagMode = v;
  const b = $('#flagBtn');
  b.classList.toggle('on', v);
  b.textContent = `🚩 标记模式：${v ? '开' : '关'}`;
}

window.addEventListener('resize', () => sizeWords());
buildLevels();
newGame();
</script>
</body>
</html>

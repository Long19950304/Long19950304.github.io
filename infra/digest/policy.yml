version: 6
timezone: Asia/Shanghai
dedup_days: 7
lookback_hours: 48
weekend_lookback_hours: 72
min_items: 5
max_items: 7
min_sources: 3
min_healthy_sources: 4
max_per_source: 2
target_seconds: 600
min_seconds: 480
max_seconds: 720
text_model: MiniMax-M3
text_endpoint: https://api.minimaxi.com/anthropic/v1/messages
review_model: MiniMax-M3
review_endpoint: https://api.minimaxi.com/anthropic/v1/messages
tts_model: speech-2.8-hd
tts_endpoint: https://api.minimaxi.com/v1/t2a_v2
voice_zh: Chinese (Mandarin)_Gentleman
voice_en: English_Graceful_Lady
feed_proxy: http://127.0.0.1:7890
min_economy_items: 2
max_economy_items: 3
min_technology_items: 3
required_economy_coverage: [china, world]
selection_instruction: >-
  Include 2–3 finance/economy stories and 3–4 technology/research/education stories
  within the existing 5–7 total. Include at least one mainland-China economy story
  from a China-based authoritative source and one international economy story from
  an international authoritative source. Set coverage to china/world/other for each
  item according to the actual story, not the publisher's location. Do not use an
  overseas story published by a Chinese outlet as domestic news. If balanced fresh
  coverage is unavailable, hold publication rather than invent, backdate or recycle.
  Exclude events aired in the previous seven days, including the previous day,
  even if another publisher, URL, headline, language or angle reports the same news.
# Fail closed. A technical article touching these topics is omitted as a whole.
exclude_patterns:
  - '\b(lawsuits?|litigation|class.action|false advertising|allegations?|accusations?)\b|诉讼|虚假宣传|指控|集体起诉'
  - '\b(wars?|conflicts?|iran|iraq)\b|伊朗|伊拉克|地缘政治|武装冲突'
  - '\b(politic\w*|geopolitic\w*|elections?|presidents?|prime minister|parliament|congress|senators?|white house|government|governance|diploma\w*|sanctions?|tariffs?|export controls?|trade war|military|warfare|weapons?|defen[cs]e|missiles?|nuclear|terroris\w*|extremis\w*|protests?|censorship|propaganda|surveillance|human rights|sovereignty|territorial|taiwan|tibet|xinjiang|hong kong|russia|ukraine|israel|palestin\w*|trump|biden|xi jinping|communis\w*|democra\w*|fedramp|govcloud|pentagon|immigration|abortion|religio\w*|porn\w*|gambling|suicid\w*)\b'
  - '政治|政党|政府|执政|选举|总统|总理|议会|国会|白宫|外交|制裁|关税|出口管制|贸易战|军事|军用|国防|武器|战争|核武|恐怖|极端主义|抗议|示威|审查制度|舆论管控|宣传战|监控|人权|主权|领土|台湾|台独|西藏|新疆|香港|俄乌|乌克兰|以色列|巴勒斯坦|特朗普|拜登|习近平|共产党|宗教|色情|赌博|自杀'
  - '十五五|五年规划'
  - '\b(buy now|price target|investment advice|guaranteed returns?|medical advice|cures? cancer)\b|投资建议|荐股|保证收益|包治|处方|用药建议'
editorial_scope: >-
  Practical AI/software tools, reproducible research methods, teaching technology,
  non-clinical digital health research, and factual domestic/international economic
  statistics, company results, banking data, consumption and industry news from
  authoritative agencies or established newsrooms. No politics, public-policy debate,
  conflict, national security, identity disputes, stock recommendations, investment
  advice, return promises, price forecasts, medical advice, rumours or accusations.
  Economic coverage must identify the publisher, data period, units, currency,
  year-on-year versus month-on-month, and preliminary/revised figures where relevant.
  Distinguish reported facts from a suggested reading of the evidence. Do not infer
  causation from market moves or combine incompatible statistics. Exclude the whole
  story when in doubt; authoritative publication alone does not make a topic eligible.

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>英语单词PK对战 · 比赛模式</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;}
  body{
    font-family:"PingFang SC","Microsoft YaHei","Segoe UI",system-ui,-apple-system,sans-serif;
    color:#463b36;overflow:hidden;
    background:
      radial-gradient(62% 52% at 6% 0%,#ffe3d4 0%,rgba(255,227,212,0) 62%),
      radial-gradient(58% 48% at 100% 4%,#dceef8 0%,rgba(220,238,248,0) 60%),
      radial-gradient(70% 60% at 50% 110%,#ffe9cf 0%,rgba(255,233,207,0) 66%),
      linear-gradient(160deg,#fffaf5 0%,#fff3e8 52%,#fdf0e6 100%);
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;
    touch-action:manipulation;
  }
  button{font-family:inherit;border:none;background:none;color:inherit;}
  #app{height:100%;display:flex;flex-direction:column;position:relative;}
  #app::before{
    content:'';position:fixed;inset:-10%;z-index:-1;pointer-events:none;
    background:
      radial-gradient(circle at 14% 22%,rgba(255,177,140,.30),transparent 34%),
      radial-gradient(circle at 86% 26%,rgba(150,208,236,.26),transparent 36%),
      radial-gradient(circle at 28% 86%,rgba(255,214,164,.30),transparent 36%),
      radial-gradient(circle at 78% 84%,rgba(184,228,200,.24),transparent 34%);
    animation:ambientFloat 16s ease-in-out infinite alternate;
  }
  @keyframes ambientFloat{
    0%{transform:translate3d(0,0,0) scale(1);}
    100%{transform:translate3d(0,-2.2%,0) scale(1.05);}
  }

  /* ============ 顶部栏 ============ */
  .topbar{
    position:relative;z-index:60;flex:0 0 auto;
    display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:1vw;
    padding:1.3vh 2.2vw 1vh;
    background:linear-gradient(180deg,rgba(255,252,247,.97),rgba(255,246,236,.86));
    border-bottom:1px solid rgba(214,177,150,.32);
    box-shadow:0 6px 26px rgba(196,147,112,.08);
    -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
  }
  .topbar-left{display:flex;align-items:center;gap:1vw;min-width:0;}
  .mode-tag{
    font-size:clamp(11px,1.55vh,19px);font-weight:800;letter-spacing:.26em;
    color:#b26a3c;border:1px solid rgba(214,151,103,.45);
    background:rgba(255,226,199,.55);padding:.45em .75em .45em 1em;border-radius:6px;white-space:nowrap;
    box-shadow:0 2px 10px rgba(214,151,103,.14);
  }
  .bank-info{font-size:clamp(11px,1.5vh,17px);color:#9a8578;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .timer-wrap{
    display:flex;align-items:baseline;gap:.65vw;
    background:rgba(255,255,255,.72);border:1px solid rgba(214,177,150,.35);
    padding:.25em 1.2em;border-radius:999px;
    box-shadow:inset 0 1px 0 #fff,0 4px 16px rgba(196,147,112,.1);
  }
  .timer-label{font-size:clamp(10px,1.3vh,15px);color:#a8917f;letter-spacing:.16em;}
  .timer{
    font-size:clamp(24px,4.3vh,52px);font-weight:900;line-height:1;
    font-variant-numeric:tabular-nums;letter-spacing:.02em;
    background:linear-gradient(180deg,#6b5147,#a77e60);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    min-width:1.6em;text-align:center;
  }
  .timer.low{
    background:none!important;color:#d94f4f!important;-webkit-text-fill-color:#d94f4f;
    animation:pulseLow .8s infinite;
  }
  @keyframes pulseLow{50%{opacity:.4;}}
  .topbar-right{display:flex;justify-content:flex-end;gap:.55vw;}
  .icon-btn{
    font-size:clamp(11px,1.55vh,17px);font-weight:700;color:#7d6558;
    background:rgba(255,255,255,.72);border:1px solid rgba(214,177,150,.38);
    padding:.55em 1.05em;border-radius:9px;cursor:pointer;
    box-shadow:0 2px 8px rgba(196,147,112,.08),inset 0 1px 0 #fff;
    transition:background .15s,transform .1s,box-shadow .15s;white-space:nowrap;
  }
  .icon-btn:active{transform:scale(.96);background:#fff;box-shadow:0 1px 4px rgba(196,147,112,.12);}
  .timerbar{flex:0 0 auto;position:relative;height:5px;background:rgba(214,177,150,.2);z-index:60;}
  .timerbar i{
    display:block;height:100%;width:100%;
    background:linear-gradient(90deg,#f4845f,#f7c873 55%,#8ecae6);
    transition:width .12s linear;
  }

  /* ============ 分屏对战区 ============ */
  .arena{
    flex:1 1 auto;display:grid;grid-template-columns:1fr clamp(60px,5.5vw,96px) 1fr;
    min-height:0;
  }
  .side{position:relative;overflow:hidden;display:flex;--team:#fff;}
  .side-red{
    --team:#ee6c60;--team-line:rgba(238,108,96,.34);--team-soft:rgba(238,108,96,.16);--glow:rgba(238,108,96,.3);
    background:
      radial-gradient(88% 78% at 0% 6%,rgba(255,199,172,.55),transparent 64%),
      radial-gradient(70% 60% at 28% 104%,rgba(255,229,209,.5),transparent 72%),
      linear-gradient(160deg,#fff9f3,#fdeee4);
  }
  .side-blue{
    --team:#5b9bd5;--team-line:rgba(91,155,213,.34);--team-soft:rgba(91,155,213,.16);--glow:rgba(91,155,213,.28);
    background:
      radial-gradient(88% 78% at 100% 6%,rgba(186,224,242,.55),transparent 64%),
      radial-gradient(70% 60% at 72% 104%,rgba(224,243,248,.5),transparent 72%),
      linear-gradient(160deg,#f8fcfe,#eaf5fa);
  }
  .side::after{
    content:'';position:absolute;inset:0;pointer-events:none;
    background-image:radial-gradient(rgba(176,146,120,.16) 1px,transparent 1px);
    background-size:22px 22px;opacity:.55;
  }
  .panel{
    position:relative;z-index:1;display:grid;grid-template-rows:auto minmax(0,1fr) auto;
    gap:1.7vh;width:100%;padding:2vh 2.4vw 2.2vh;
  }
  .team-row{display:flex;align-items:center;justify-content:space-between;gap:1vw;}
  .team-name{
    display:flex;align-items:center;gap:.65vw;color:#463b36;
    font-size:clamp(15px,2.2vh,30px);font-weight:800;letter-spacing:.1em;
  }
  .team-name .dot{
    width:.8em;height:.8em;border-radius:50%;background:var(--team);
    box-shadow:0 0 .9em var(--team),0 0 .2em var(--team);
  }
  .score-box{position:relative;display:flex;align-items:baseline;gap:.25vw;}
  .score{
    font-size:clamp(30px,5.6vh,74px);font-weight:900;line-height:.85;
    font-variant-numeric:tabular-nums;color:#463b36;text-shadow:0 4px 22px var(--glow);
  }
  .score-unit{font-size:clamp(10px,1.45vh,16px);color:#a8917f;letter-spacing:.1em;}
  .score.bump{animation:bump .3s ease;}
  @keyframes bump{0%{transform:scale(1);}45%{transform:scale(1.16);}100%{transform:scale(1);}}
  .float{
    position:absolute;right:0;top:calc(100% + 1px);white-space:nowrap;pointer-events:none;
    font-size:clamp(13px,2vh,26px);font-weight:900;
    animation:floatUp .95s ease forwards;
  }
  .float.good{color:#2e9e63;text-shadow:0 0 14px rgba(74,222,128,.45);}
  .float.bad{color:#d94f4f;text-shadow:0 0 14px rgba(255,90,90,.35);}
  @keyframes floatUp{
    0%{opacity:0;transform:translateY(10px) scale(.8);}
    25%{opacity:1;transform:translateY(0) scale(1.05);}
    100%{opacity:0;transform:translateY(-34px) scale(1);}
  }

  .word-card{
    position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:1.4vh;min-height:0;overflow:hidden;padding:2vh 1.6vw;
    background:rgba(255,255,255,.82);
    border:2px solid var(--team-line);border-radius:clamp(14px,2.2vh,28px);
    box-shadow:0 18px 44px rgba(180,140,110,.14),0 2px 6px rgba(180,140,110,.08),inset 0 1px 0 #fff;
  }
  .prompt-label{
    font-size:clamp(10px,1.6vh,19px);color:#a08b7c;letter-spacing:.14em;text-align:center;
  }
  .word{
    font-size:clamp(32px,8.2vh,104px);font-weight:900;line-height:1.06;text-align:center;
    color:#463b36;word-break:break-word;max-width:100%;
    text-shadow:0 2px 16px rgba(255,255,255,.95),0 6px 24px var(--team-soft);
  }
  .word.small{font-size:clamp(26px,6.2vh,78px);}
  .word.enter{animation:wordIn .3s ease;}
  @keyframes wordIn{from{opacity:0;transform:translateY(12px) scale(.95);}to{opacity:1;transform:none;}}
  .hint{
    position:absolute;left:50%;top:50%;z-index:3;pointer-events:none;opacity:0;
    transform:translate(-50%,-50%);padding:.38em 1.1em;border-radius:999px;
    font-size:clamp(22px,3.4vh,46px);font-weight:900;white-space:nowrap;
    box-shadow:0 12px 40px rgba(140,100,80,.28);
  }
  .hint.show.good{background:linear-gradient(180deg,#3ddc84,#17a34a);color:#fff;animation:hintPop .9s ease forwards;}
  .hint.show.bad{background:linear-gradient(180deg,#ff5f5f,#c62828);color:#fff;animation:hintPop .9s ease forwards;}
  @keyframes hintPop{
    0%{opacity:0;transform:translate(-50%,-50%) scale(.7);}
    16%{opacity:1;transform:translate(-50%,-50%) scale(1.06);}
    72%{opacity:1;transform:translate(-50%,-50%) scale(1);}
    100%{opacity:0;transform:translate(-50%,-58%) scale(1);}
  }

  .options{display:grid;grid-template-columns:1fr 1fr;gap:1.4vh 1vw;}
  .option{
    display:flex;align-items:center;justify-content:center;text-align:center;
    min-height:clamp(56px,8.6vh,112px);padding:.4em .7em;line-height:1.2;
    font-size:clamp(15px,2.25vh,30px);font-weight:700;color:#4f4038;word-break:break-word;
    background:rgba(255,255,255,.78);border:2px solid var(--team-line);
    border-radius:clamp(10px,1.5vh,18px);cursor:pointer;
    box-shadow:0 4px 14px rgba(180,140,110,.1),inset 0 1px 0 #fff;
    transition:background .15s,border-color .15s,transform .1s,box-shadow .15s;
  }
  .option.sm{font-size:clamp(13px,1.9vh,25px);}
  .option:active{transform:scale(.972);background:#fff;box-shadow:0 2px 8px rgba(180,140,110,.12);}
  .option.correct{
    color:#fff;
    background:linear-gradient(180deg,#33cf72,#159c4a);
    border-color:#5cf09a;box-shadow:0 0 40px rgba(51,207,114,.6);animation:pop .3s ease;
  }
  .option.wrong{
    color:#fff;
    background:linear-gradient(180deg,#e65050,#a91f1f);
    border-color:#ff8a8a;box-shadow:0 0 40px rgba(230,80,80,.55);animation:shakeX .38s ease;
  }
  .options.locked .option{pointer-events:none;}
  @keyframes pop{0%{transform:scale(1);}50%{transform:scale(1.04);}100%{transform:scale(1);}}
  @keyframes shakeX{
    0%,100%{transform:translateX(0);}20%{transform:translateX(-9px);}
    40%{transform:translateX(8px);}60%{transform:translateX(-5px);}80%{transform:translateX(3px);}
  }
  .panel.shake{animation:shakeX .42s ease;}

  /* 中间 VS 分割 */
  .divider{
    position:relative;display:flex;align-items:center;justify-content:center;
    background:linear-gradient(180deg,transparent,rgba(255,255,255,.5) 22%,rgba(255,255,255,.5) 78%,transparent);
  }
  .divider::before{
    content:'';position:absolute;top:0;bottom:0;left:50%;width:2px;transform:translateX(-50%);
    background:linear-gradient(180deg,rgba(238,108,96,0),rgba(238,108,96,.6) 18%,#f3b98e 50%,rgba(91,155,213,.6) 82%,rgba(91,155,213,0));
    box-shadow:0 0 18px rgba(243,185,142,.4);opacity:.9;
  }
  .vs-badge{
    position:relative;z-index:2;display:flex;align-items:center;justify-content:center;
    width:clamp(50px,7.2vh,86px);height:clamp(50px,7.2vh,86px);border-radius:50%;
    font-size:clamp(17px,2.6vh,32px);font-weight:900;font-style:italic;color:#c06b45;
    background:radial-gradient(circle at 34% 24%,#fffdfa,#ffe9d6 78%);
    border:2px solid rgba(214,177,150,.65);
    box-shadow:0 0 0 .45em rgba(255,255,255,.55),0 10px 30px rgba(196,147,112,.22);
  }

  /* ============ 遮罩层 ============ */
  .overlay{
    position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;
    padding:3vh 3vw;background:rgba(255,247,239,.86);
    -webkit-backdrop-filter:blur(10px) saturate(1.05);backdrop-filter:blur(10px) saturate(1.05);
    opacity:0;pointer-events:none;transition:opacity .25s ease;
  }
  .overlay.show{opacity:1;pointer-events:auto;}
  .overlay::before{
    content:'';position:absolute;inset:0;pointer-events:none;
    background:
      radial-gradient(58% 68% at 6% 50%,rgba(255,196,164,.32),transparent 60%),
      radial-gradient(58% 68% at 94% 50%,rgba(176,220,240,.32),transparent 60%);
  }
  .overlay > *{position:relative;z-index:1;}

  .start-card{display:flex;flex-direction:column;align-items:center;gap:1.9vh;text-align:center;max-width:min(900px,92vw);}
  .start-title{font-size:clamp(28px,6.2vh,84px);font-weight:900;letter-spacing:.03em;line-height:1.12;color:#463b36;text-shadow:0 4px 30px rgba(255,255,255,.85);}
  .start-title .pk{
    background:linear-gradient(90deg,#e2604d,#e89b4f 50%,#5a9ec9);
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .start-sub{color:#9a8578;font-size:clamp(12px,1.85vh,21px);letter-spacing:.22em;}
  .start-teams{display:flex;align-items:center;gap:1.3vw;}
  .chip{font-size:clamp(13px,1.95vh,24px);font-weight:800;letter-spacing:.1em;padding:.42em 1.35em;border-radius:999px;}
  .chip.red{color:#b85a4f;background:rgba(255,188,166,.35);border:1px solid rgba(238,108,96,.4);box-shadow:0 8px 24px rgba(238,108,96,.16);}
  .chip.blue{color:#4a7fa8;background:rgba(186,224,242,.38);border:1px solid rgba(91,155,213,.4);box-shadow:0 8px 24px rgba(91,155,213,.16);}
  .vs-small{color:#c08a4e;font-weight:900;font-style:italic;font-size:clamp(12px,1.8vh,20px);}
  .start-meta{color:#9a8578;font-size:clamp(11px,1.65vh,18px);}
  .start-hint{color:#a8917f;font-size:clamp(10px,1.45vh,16px);}

  .primary-btn{
    font-size:clamp(17px,2.5vh,30px);font-weight:900;letter-spacing:.16em;color:#fff;
    padding:.95em 2.9em;border-radius:999px;cursor:pointer;
    background:linear-gradient(120deg,#f79d65 0%,#f4845f 55%,#ef7b64 100%);
    box-shadow:0 12px 30px rgba(238,123,100,.32),inset 0 0 0 2px rgba(255,255,255,.28);
    transition:transform .12s,filter .15s,box-shadow .15s;
  }
  .primary-btn:active{transform:scale(.97);filter:brightness(1.06);box-shadow:0 8px 20px rgba(238,123,100,.3),inset 0 0 0 2px rgba(255,255,255,.32);}
  .ghost-btn{
    font-size:clamp(12px,1.75vh,20px);font-weight:700;color:#7d6558;
    padding:.7em 1.7em;border-radius:999px;cursor:pointer;
    background:rgba(255,255,255,.5);border:1px solid rgba(125,101,88,.28);
    transition:background .15s;
  }
  .ghost-btn:active{background:#fff;}

  /* Ready Go */
  #readyOverlay{background:rgba(255,241,229,.62);z-index:30;}
  #readyOverlay::before{background:radial-gradient(60% 70% at 50% 50%,rgba(255,196,164,.3),transparent 70%);}
  #readyText{
    font-size:clamp(86px,26vh,300px);font-weight:900;line-height:1;color:#463b36;
    text-shadow:0 10px 60px rgba(255,255,255,.9),0 0 40px rgba(243,179,142,.5);letter-spacing:.02em;
  }
  #readyText.go{
    background:linear-gradient(90deg,#e2604d,#e89b4f 50%,#5a9ec9);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 6px 30px rgba(243,179,142,.55));
  }
  @keyframes readyPop{
    0%{opacity:0;transform:scale(.4);}
    55%{opacity:1;transform:scale(1.08);}
    100%{opacity:1;transform:scale(1);}
  }

  /* 结算 */
  #endOverlay{z-index:40;background:rgba(255,247,239,.92);}
  .end-card{
    display:flex;flex-direction:column;align-items:center;gap:2.8vh;
    padding:3.6vh 4.6vw;border-radius:clamp(18px,3vh,34px);
    background:linear-gradient(180deg,#fffdf9,#fff4e8);
    border:1px solid rgba(214,177,150,.5);
    box-shadow:0 40px 100px rgba(196,147,112,.26),inset 0 1px 0 #fff;
    min-width:min(760px,88vw);
  }
  .end-kicker{font-size:clamp(11px,1.6vh,18px);letter-spacing:.42em;color:#c08a4e;}
  .win-banner{font-size:clamp(28px,5.8vh,78px);font-weight:900;line-height:1.1;text-align:center;}
  .win-banner.red-win{color:#d95c50;text-shadow:0 4px 40px rgba(238,108,96,.32);}
  .win-banner.blue-win{color:#4a86bd;text-shadow:0 4px 40px rgba(91,155,213,.3);}
  .win-banner.tie-win{color:#c08a4e;text-shadow:0 4px 40px rgba(243,179,142,.35);}
  .final-scores{display:flex;gap:clamp(18px,4vw,72px);}
  .final{
    display:flex;flex-direction:column;align-items:center;gap:.5vh;
    padding:1.3vh 2.6vw;border-radius:16px;min-width:clamp(140px,16vw,250px);
    border:2px solid;background:rgba(255,255,255,.6);
    box-shadow:0 8px 24px rgba(196,147,112,.1);
  }
  .final.red{border-color:rgba(238,108,96,.42);background:rgba(255,232,222,.72);}
  .final.blue{border-color:rgba(91,155,213,.42);background:rgba(226,243,250,.72);}
  .final-team{font-size:clamp(11px,1.65vh,19px);letter-spacing:.24em;color:#8b7264;}
  .final-score{font-size:clamp(36px,7.6vh,104px);font-weight:900;line-height:1;font-variant-numeric:tabular-nums;}
  .final.red .final-score{color:#d95c50;text-shadow:0 6px 28px rgba(238,108,96,.25);}
  .final.blue .final-score{color:#4a86bd;text-shadow:0 6px 28px rgba(91,155,213,.25);}
  .end-actions{display:flex;gap:1.4vw;align-items:center;}

  /* 设置 */
  #settingsOverlay{z-index:50;background:rgba(255,247,239,.93);}
  .settings-card{
    display:flex;flex-direction:column;gap:2vh;
    width:min(780px,92vw);max-height:92vh;overflow:auto;
    padding:3vh 3vw;border-radius:clamp(14px,2.2vh,24px);
    background:linear-gradient(180deg,#fffdf9,#fff5e9);
    border:1px solid rgba(214,177,150,.5);
    box-shadow:0 40px 100px rgba(196,147,112,.24),inset 0 1px 0 #fff;
  }
  .settings-card h2{
    font-size:clamp(18px,2.6vh,30px);font-weight:900;letter-spacing:.12em;color:#463b36;
    display:flex;align-items:center;justify-content:space-between;
  }
  .settings-card h2 span{font-size:clamp(10px,1.4vh,15px);font-weight:600;color:#a8917f;letter-spacing:.05em;}
  .field{display:flex;flex-direction:column;gap:.9vh;}
  .field > label{font-size:clamp(11px,1.6vh,18px);color:#7d6558;letter-spacing:.08em;}
  .field .tip{color:#a8917f;font-weight:400;letter-spacing:0;margin-left:.4em;}
  .chips{display:flex;flex-wrap:wrap;gap:.7vw;}
  .chips button{
    font-size:clamp(11px,1.6vh,18px);font-weight:700;color:#7d6558;
    padding:.55em 1.3em;border-radius:999px;cursor:pointer;
    background:rgba(255,255,255,.75);border:1px solid rgba(214,177,150,.4);
    box-shadow:0 2px 8px rgba(196,147,112,.08);
    transition:all .15s;
  }
  .chips button.active{
    color:#fff;background:linear-gradient(120deg,#f79d65,#ef7b64);border-color:#ef7b64;font-weight:900;
    box-shadow:0 6px 18px rgba(238,123,100,.3);
  }
  textarea{
    width:100%;height:26vh;min-height:150px;resize:vertical;
    font-family:"Consolas","Menlo","Courier New",monospace;
    font-size:clamp(12px,1.65vh,17px);line-height:1.7;color:#5a4a41;
    background:#fffdf9;border:1px solid rgba(214,177,150,.45);
    border-radius:12px;padding:1.2em 1.3em;outline:none;
    -webkit-user-select:text;user-select:text;
  }
  textarea:focus{border-color:rgba(239,123,100,.6);box-shadow:0 0 0 3px rgba(239,123,100,.12);}
  .field-foot{display:flex;justify-content:space-between;font-size:clamp(10px,1.45vh,16px);color:#a8917f;}
  .warn{color:#d94f4f;}
  .settings-actions{display:flex;justify-content:flex-end;gap:1vw;margin-top:.6vh;}

  @media (max-width:820px){
    .bank-info{display:none;}
    .option{min-height:48px;}
    .panel{padding:1.4vh 3vw;}
  }
</style>
</head>
<body oncontextmenu="return false">
<div id="app">
  <header class="topbar">
    <div class="topbar-left">
      <span class="mode-tag">比赛模式</span>
      <span class="bank-info" id="bankInfo">初中词库 · 42 词 · 60 秒</span>
    </div>

  <!-- 开始页 -->

  <!-- 设置 -->
  <div class="overlay" id="settingsOverlay">
    <div class="settings-card">
      <h2>对局设置 <span>设置将在下一局生效</span></h2>

      <div class="field">
        <label>对战时长</label>

          <button type="button" data-sec="30">30 秒</button>

        <label>自定义词库<span class="tip">每行一个单词，英文与中文用空格、逗号或 Tab 分隔</span></label>
        <textarea id="bankInput" spellcheck="false" placeholder="apple 苹果&#10;banana 香蕉"></textarea>
        <div class="field-foot">
          <span id="bankCount">共 0 个单词</span>
          <span class="warn" id="bankWarn"></span>
        </div>
      </div>

        <button class="ghost-btn" id="cancelSettings" type="button">取消</button>
        <button class="primary-btn" id="saveSettings" type="button">保存并使用</button>

</div>

<script>
(function(){
'use strict';

/* ================= 词库预设 ================= */
var PRESET_JUNIOR = [
  'apple 苹果','banana 香蕉','orange 橙子','water 水','bread 面包',
  'book 书','pencil 铅笔','teacher 老师','student 学生','school 学校',
  'friend 朋友','family 家庭','mother 母亲','father 父亲','animal 动物',
  'dog 狗','cat 猫','bird 鸟','tree 树','flower 花',
  'music 音乐','sport 运动','summer 夏天','winter 冬天','morning 早晨',
  'evening 傍晚','happy 快乐的','angry 生气的','beautiful 美丽的','difficult 困难的',
  'easy 容易的','important 重要的','question 问题','answer 答案','doctor 医生',
  'hospital 医院','library 图书馆','weather 天气','holiday 假期','picture 图片',
  'letter 信','window 窗户'
].join('\n');

var PRESET_SENIOR = [
  'abandon 放弃','absorb 吸收','achieve 实现','adapt 适应','admire 钦佩',
  'analyse 分析','ancient 古代的','approach 方法','argue 争论','assume 假设',
  'attitude 态度','benefit 益处','challenge 挑战','comfortable 舒适的','communicate 交流',
  'compare 比较','concentrate 集中','confident 自信的','consider 考虑','contribute 贡献',
  'convenient 方便的','curious 好奇的','declare 宣布','determine 决定','develop 发展',
  'distinguish 区分','efficient 高效的','emphasize 强调','enthusiastic 热情的','establish 建立',
  'evaluate 评估','evidence 证据','expand 扩展','familiar 熟悉的','generous 慷慨的',
  'guarantee 保证','identify 辨认','ignore 忽视','impress 使印象深刻','independent 独立的',
  'influence 影响','investigate 调查','maintain 维持','obvious 明显的','participate 参加',
  'persuade 说服','previous 先前的','recommend 推荐','reduce 减少','reliable 可靠的',
  'require 需要','respond 回应','responsible 有责任的','significant 重要的','solution 解决方案',
  'strategy 策略','sufficient 充足的','tolerate 容忍'
].join('\n');

var STORE_KEY = 'wordpk.config.v1';
var DEFAULTS = { duration:60, penalty:1, bankText:PRESET_JUNIOR, bankName:'初中词库' };

/* ================= 基础工具 ================= */
function $(sel){ return document.querySelector(sel); }
function range(n){ var a=[]; for(var i=0;i<n;i++) a.push(i); return a; }
function shuffle(arr){
  for(var i=arr.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=arr[i]; arr[i]=arr[j]; arr[j]=t; }
  return arr;
}
function show(el){ el.classList.add('show'); }
function hide(el){ el.classList.remove('show'); }

function parseBank(text){
  var out = [], seen = {};
  String(text||'').split(/\r?\n/).forEach(function(line){
    line = line.trim();
    if(!line || line.charAt(0)==='#') return;
    var parts = line.split(/[,，\t;；|]+/);
    var en, zh;
    if(parts.length >= 2){
      en = parts[0].trim();
      zh = parts.slice(1).join(' ').trim();
    }else{
      var m = line.match(/^(.*\S)\s+(\S.*)$/);
      if(!m) return;
      en = m[1].trim(); zh = m[2].trim();
    }
    if(!en || !zh) return;
    var key = en.toLowerCase() + '|' + zh;
    if(seen[key]) return;
    seen[key] = 1;
    out.push({ en:en, zh:zh });
  });
  return out;
}

/* ================= 配置 ================= */
function loadConfig(){
  try{
    var raw = localStorage.getItem(STORE_KEY);
    if(raw){
      var o = JSON.parse(raw);
      if(o && typeof o.bankText === 'string' && parseBank(o.bankText).length >= 4){
        return {
          duration: [30,60,90,120].indexOf(+o.duration) >= 0 ? +o.duration : 60,
          penalty: +o.penalty ? 1 : 0,
          bankText: o.bankText,
          bankName: o.bankName || '自定义词库'
        };
      }
    }
  }catch(e){}
  return { duration:DEFAULTS.duration, penalty:DEFAULTS.penalty, bankText:DEFAULTS.bankText, bankName:DEFAULTS.bankName };
}
function saveConfig(){
  try{ localStorage.setItem(STORE_KEY, JSON.stringify(cfg)); }catch(e){}
}

var cfg = loadConfig();
var bank = parseBank(cfg.bankText);

/* ================= 状态 ================= */
var state = {
  running:false, ending:false,
  timerId:null, readyTimer:null, endTimer:null, duration:60
};

function makeEls(id){
  var root = document.getElementById(id);
  return {
    root:root,
    panel:root.querySelector('.panel'),
    card:root.querySelector('.word-card'),
    label:root.querySelector('.prompt-label'),
    word:root.querySelector('.word'),
    hint:root.querySelector('.hint'),
    options:root.querySelector('.options'),
    score:root.querySelector('.score'),
    scoreBox:root.querySelector('.score-box')
  };
}

var teams = {
  red:  { key:'red',  score:0, locked:true, q:null, order:[], pos:0, nextTimer:null, el:makeEls('sideRed') },
  blue: { key:'blue', score:0, locked:true, q:null, order:[], pos:0, nextTimer:null, el:makeEls('sideBlue') }
};

/* ================= 声音 ================= */
var audioCtx = null, muted = false;
function sound(kind){
  if(muted) return;
  try{
    var AC = window.AudioContext || window.webkitAudioContext;
    if(!AC) return;
    if(!audioCtx) audioCtx = new AC();
    if(audioCtx.state === 'suspended') audioCtx.resume();
    var now = audioCtx.currentTime + 0.01;
    function beep(freq, start, dur, type, vol){
      var o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.type = type || 'sine';
      o.frequency.value = freq;
      g.gain.setValueAtTime(0.0001, now + start);
      g.gain.linearRampToValueAtTime(vol, now + start + 0.012);
      g.gain.exponentialRampToValueAtTime(0.0001, now + start + dur);
      o.connect(g); g.connect(audioCtx.destination);
      o.start(now + start); o.stop(now + start + dur + 0.03);
    }
    if(kind === 'good'){ beep(880,0,0.13,'sine',0.14); beep(1320,0.085,0.2,'sine',0.1); }
    else if(kind === 'bad'){ beep(220,0,0.2,'sawtooth',0.08); beep(150,0.09,0.24,'sawtooth',0.06); }
    else if(kind === 'tick'){ beep(660,0,0.08,'square',0.045); }
    else if(kind === 'go'){ beep(1046,0,0.24,'square',0.08); }
    else if(kind === 'end'){ beep(523,0,0.24,'sine',0.1); beep(392,0.16,0.4,'sine',0.09); }
  }catch(e){}
}

/* ================= 界面刷新 ================= */
var timerEl = $('#timer'), timerFill = $('#timerFill'), bankInfoEl = $('#bankInfo'),
    startMetaEl = $('#startMeta'), startHintEl = $('#startHint');

function updateInfo(){
  var meta = '词库：' + cfg.bankName + ' · ' + bank.length + ' 词 · ' + cfg.duration + ' 秒';
  startMetaEl.textContent = meta;
  bankInfoEl.textContent = cfg.bankName + ' · ' + bank.length + ' 词 · ' + cfg.duration + ' 秒';
  startHintEl.textContent = '答对 +10 分 · ' + (cfg.penalty ? '答错 -5 分' : '答错不扣分');
}
function setTimerUI(ms, running){
  var secs = Math.max(0, Math.ceil(ms / 1000));
  timerEl.textContent = secs;
  var pct = Math.max(0, Math.min(1, ms / (cfg.duration * 1000)));
  timerFill.style.width = (pct * 100).toFixed(2) + '%';
  timerEl.classList.toggle('low', !!running && secs <= 10);
}
function updateScore(key, silent){
  var t = teams[key];
  t.el.score.textContent = t.score;
  if(!silent){
    t.el.score.classList.remove('bump');
    void t.el.score.offsetWidth;
    t.el.score.classList.add('bump');
  }
}
function floatScore(t, text, type){
  var s = document.createElement('span');
  s.className = 'float ' + type;
  s.textContent = text;
  t.el.scoreBox.appendChild(s);
  setTimeout(function(){ if(s.parentNode) s.parentNode.removeChild(s); }, 980);
}
function flashHint(t, text, type){
  var h = t.el.hint;
  h.className = 'hint';
  void h.offsetWidth;
  h.textContent = text;
  h.className = 'hint show ' + type;
}

/* ================= 题目 ================= */
function nextQuestion(t){
  if(!state.running) return;
  if(t.pos >= t.order.length){
    t.order = shuffle(range(bank.length));
    t.pos = 0;
  }
  var idx = t.order[t.pos++];
  var word = bank[idx];
  if(!word) return;
  var dir = (idx % 2 === 0) ? 'en2zh' : 'zh2en';
  var target = dir === 'en2zh' ? word.zh : word.en;
  var pool = [];
  for(var i=0;i<bank.length;i++){
    if(i === idx) continue;
    var txt = dir === 'en2zh' ? bank[i].zh : bank[i].en;
    if(!txt || txt === target || pool.indexOf(txt) >= 0) continue;
    pool.push(txt);
  }
  shuffle(pool);
  var options = shuffle([{ text:target, correct:true }].concat(
    pool.slice(0,3).map(function(x){ return { text:x, correct:false }; })
  ));
  t.q = { word:word, dir:dir, options:options };
  renderQuestion(t);
}

function renderQuestion(t){
  var el = t.el, q = t.q;
  el.label.textContent = q.dir === 'en2zh' ? '看英文，选中文释义' : '看中文，选英文单词';
  var prompt = q.dir === 'en2zh' ? q.word.en : q.word.zh;
  el.word.textContent = prompt;
  el.word.classList.toggle('small', prompt.length > 9);
  el.word.classList.remove('enter');
  void el.word.offsetWidth;
  el.word.classList.add('enter');

  el.options.innerHTML = '';
  el.options.classList.remove('locked');
  q.options.forEach(function(o){
    var b = document.createElement('button');
    b.type = 'button';
    b.className = 'option' + (o.text.length > 13 ? ' sm' : '');
    b.textContent = o.text;
    b.dataset.correct = o.correct ? '1' : '0';
    b.addEventListener('click', function(){ answer(t, b, o); });
    el.options.appendChild(b);
  });
}

function answer(t, btn, opt){
  if(!state.running || t.locked) return;
  t.locked = true;
  t.el.options.classList.add('locked');
  var buttons = Array.prototype.slice.call(t.el.options.children);

  if(opt.correct){
    t.score += 10;
    btn.classList.add('correct');
    flashHint(t, '答对啦  +10', 'good');
    floatScore(t, '+10', 'good');
    sound('good');
  }else{
    btn.classList.add('wrong');
    for(var i=0;i<buttons.length;i++){
      if(buttons[i].dataset.correct === '1'){ buttons[i].classList.add('correct'); break; }
    }
    if(cfg.penalty){
      t.score = Math.max(0, t.score - 5);
      flashHint(t, '答错了  -5', 'bad');
      floatScore(t, '-5', 'bad');
    }else{
      flashHint(t, '答错了', 'bad');
    }
    t.el.panel.classList.add('shake');
    setTimeout(function(){ t.el.panel.classList.remove('shake'); }, 440);
    sound('bad');
  }
  updateScore(t.key);

  var delay = opt.correct ? 650 : 950;
  clearTimeout(t.nextTimer);
  t.nextTimer = setTimeout(function(){
    if(!state.running) return;
    t.locked = false;
    nextQuestion(t);
  }, delay);
}

/* ================= 流程 ================= */
function runReadyGo(done){
  var ov = $('#readyOverlay'), txt = $('#readyText');
  show(ov);
  var steps = ['3','2','1','GO!'], i = 0;
  function step(){
    if(i >= steps.length){
      hide(ov);
      done();
      return;
    }
    var s = steps[i++];
    txt.textContent = s;
    txt.classList.toggle('go', s === 'GO!');
    txt.style.animation = 'none';
    void txt.offsetWidth;
    txt.style.animation = 'readyPop .5s cubic-bezier(.2,.9,.3,1.4)';
    sound(s === 'GO!' ? 'go' : 'tick');
    state.readyTimer = setTimeout(step, s === 'GO!' ? 620 : 640);
  }
  step();
}

function startTimer(){
  clearInterval(state.timerId);
  var end = performance.now() + cfg.duration * 1000;
  setTimerUI(cfg.duration * 1000, true);
  state.timerId = setInterval(function(){
    var remain = end - performance.now();
    if(remain <= 0){
      setTimerUI(0, false);
      endRound();
      return;
    }
    setTimerUI(remain, true);
  }, 100);
}

function startRound(){
  clearTimeout(state.readyTimer);
  clearInterval(state.timerId);
  clearTimeout(state.endTimer);
  state.running = false;
  state.ending = false;

  hide($('#startOverlay'));
  hide($('#endOverlay'));
  hide($('#settingsOverlay'));
  setTimerUI(cfg.duration * 1000, false);

  var base = shuffle(range(bank.length));
  ['red','blue'].forEach(function(k){
    var t = teams[k];
    t.score = 0;
    t.q = null;
    t.locked = true;
    t.pos = 0;
    t.order = base.slice();
    clearTimeout(t.nextTimer);
    updateScore(k, true);
    t.el.options.innerHTML = '';
    t.el.options.classList.add('locked');
    t.el.hint.className = 'hint';
    t.el.word.textContent = '准备';
    t.el.word.classList.remove('small','enter');
    t.el.label.textContent = '准备好了吗？';
  });

  runReadyGo(function(){
    state.running = true;
    teams.red.locked = false;
    teams.blue.locked = false;
    nextQuestion(teams.red);
    nextQuestion(teams.blue);
    startTimer();
  });
}

function endRound(){
  if(state.ending) return;
  state.ending = true;
  state.running = false;
  clearInterval(state.timerId);
  state.timerId = null;
  clearTimeout(state.readyTimer);
  setTimerUI(0, false);

  ['red','blue'].forEach(function(k){
    var t = teams[k];
    clearTimeout(t.nextTimer);
    t.locked = true;
    t.el.options.classList.add('locked');
  });

  var r = teams.red.score, b = teams.blue.score;
  $('#finalRed').textContent = r;
  $('#finalBlue').textContent = b;
  var banner = $('#winBanner');
  if(r > b){ banner.textContent = '红队获胜！'; banner.className = 'win-banner red-win'; }
  else if(b > r){ banner.textContent = '蓝队获胜！'; banner.className = 'win-banner blue-win'; }
  else { banner.textContent = '平局！势均力敌'; banner.className = 'win-banner tie-win'; }

  sound('end');
  state.endTimer = setTimeout(function(){ show($('#endOverlay')); }, 380);
}

/* ================= 设置弹窗 ================= */
var modal = null;

function openSettings(){
  clearInterval(state.timerId);
  state.timerId = null;
  clearTimeout(state.readyTimer);
  clearTimeout(state.endTimer);
  state.running = false;
  state.ending = false;
  ['red','blue'].forEach(function(k){
    var t = teams[k];
    clearTimeout(t.nextTimer);
    t.locked = true;
  });
  hide($('#readyOverlay'));
  hide($('#endOverlay'));
  setTimerUI(cfg.duration * 1000, false);

  modal = { duration:cfg.duration, penalty:cfg.penalty, bankText:cfg.bankText, bankName:cfg.bankName };
  $('#bankInput').value = modal.bankText;
  syncChips();
  updateBankCount();

  show($('#settingsOverlay'));
  show($('#startOverlay'));
  // 让设置层保持在最上方
  $('#settingsOverlay').classList.add('show');
}

function syncChips(){
  Array.prototype.forEach.call($('#durationChips').children, function(b){
    b.classList.toggle('active', +b.dataset.sec === modal.duration);
  });
  Array.prototype.forEach.call($('#penaltyChips').children, function(b){
    b.classList.toggle('active', +b.dataset.v === modal.penalty);
  });
}

function updateBankCount(){
  var n = parseBank(modal.bankText).length;
  $('#bankCount').textContent = '共 ' + n + ' 个单词';
  $('#bankWarn').textContent = n < 8 ? '至少需要 8 个单词才能开始' : '';
}

function closeSettings(){
  hide($('#settingsOverlay'));
  show($('#startOverlay'));
  setTimerUI(cfg.duration * 1000, false);
  modal = null;
}

/* ================= 事件绑定 ================= */
$('#startBtn').addEventListener('click', startRound);
$('#againBtn').addEventListener('click', startRound);
$('#openSettingsBtn').addEventListener('click', openSettings);
$('#settingsBtn').addEventListener('click', openSettings);
$('#endSettingsBtn').addEventListener('click', openSettings);
$('#restartBtn').addEventListener('click', function(){
  if(!bank.length) return;
  startRound();
});

$('#fsBtn').addEventListener('click', function(){
  if(!document.fullscreenElement){
    if(document.documentElement.requestFullscreen) document.documentElement.requestFullscreen().catch(function(){});
  }else if(document.exitFullscreen){
    document.exitFullscreen();
  }
});

$('#soundBtn').addEventListener('click', function(){
  muted = !muted;
  this.textContent = muted ? '声音关' : '声音开';
});

Array.prototype.forEach.call($('#durationChips').children, function(b){
  b.addEventListener('click', function(){
    modal.duration = +b.dataset.sec;
    syncChips();
  });
});
Array.prototype.forEach.call($('#penaltyChips').children, function(b){
  b.addEventListener('click', function(){
    modal.penalty = +b.dataset.v;
    syncChips();
  });
});
$('#loadJunior').addEventListener('click', function(){
  modal.bankText = PRESET_JUNIOR;
  modal.bankName = '初中词库';
  $('#bankInput').value = PRESET_JUNIOR;
  updateBankCount();
});
$('#loadSenior').addEventListener('click', function(){
  modal.bankText = PRESET_SENIOR;
  modal.bankName = '高中词库';
  $('#bankInput').value = PRESET_SENIOR;
  updateBankCount();
});
$('#bankInput').addEventListener('input', function(){
  modal.bankText = this.value;
  modal.bankName = '自定义词库';
  updateBankCount();
});

$('#cancelSettings').addEventListener('click', closeSettings);
$('#saveSettings').addEventListener('click', function(){
  var list = parseBank(modal.bankText);
  if(list.length < 8){
    $('#bankWarn').textContent = '单词数量不足，至少需要 8 个';
    return;
  }
  cfg.duration = modal.duration;
  cfg.penalty = modal.penalty;
  cfg.bankText = modal.bankText;
  cfg.bankName = modal.bankName;
  bank = list;
  saveConfig();
  updateInfo();
  closeSettings();
});

/* ================= 初始化 ================= */
if(bank.length < 4){
  bank = parseBank(PRESET_JUNIOR);
  cfg.bankText = PRESET_JUNIOR;
  cfg.bankName = '初中词库';
}
updateInfo();
setTimerUI(cfg.duration * 1000, false);
show($('#startOverlay'));

})();
</script>
</body>
</html>

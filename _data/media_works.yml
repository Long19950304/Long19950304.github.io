  - id: tongjian-shian
    group: series
    title:
      zh: 通鉴史案
      en: LongXiGE Reads Zizhi Tongjian
    format:
      zh: 中英双语历史节目
      en: Bilingual history series
    description:
      zh: 基于《资治通鉴》，以史案复盘、文本解读与决策分析组织历史叙事。
      en: A bilingual history video-podcast series based on Zizhi Tongjian, combining historical case reconstruction, close reading, and decision analysis.

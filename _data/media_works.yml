groups:
  - id: short-film
    title:
      zh: 实验短片
      en: Experimental film
    description:
      zh: 以影像创作探索叙事与生活经验。
      en: Exploring narrative and lived experience through film.
  - id: series
    title:
      zh: 影像系列
      en: Video series
    description:
      zh: 虚构访谈、人物对话与历史文本解读。
      en: Fictional interviews, imagined conversations, and readings of historical texts.


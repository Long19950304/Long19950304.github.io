long1-desk1-macao-media-ecology-generational-differences:
  language: en
  provider: notebooklm
  audio: assets/audio/notebooklm/long1-desk1-macao-media-ecology-generational-differences-en.mp3
  take_home: A “small-society” Macau case helps theorize how intergenerational media use patterns emerge and how local ecosystems shape them.

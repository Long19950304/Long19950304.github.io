# Authoritative economy sources plus attributable technical primary sources.
# Every story still passes topic, evidence, freshness and bilingual review gates.
sources:
  - id: nbs-china
    name: 国家统计局
    category: Business & economy
    topic: economy
    region: china
    authority: statistical_agency
    index_url: https://www.stats.gov.cn/sj/zxfb/
    link_pattern: '/sj/zxfb/\d{6}/t\d{8}_\d+\.html$'
    date_pattern: 't(\d{8})_'
    body_classes: [txt-content]
    hosts: [www.stats.gov.cn]
    direct: true
    max_articles: 6
  - id: xinhua-finance
    name: 新华社财经
    category: Business & economy
    topic: economy
    region: china
    authority: news_agency
    index_url: https://www.news.cn/fortune/index.htm
    link_pattern: '/fortune/\d{8}/[a-zA-Z0-9]+/c\.html$'
    date_pattern: '/(\d{8})/'
    body_ids: [detailContent, detail-content]
    hosts: [www.news.cn]
    direct: true
    max_articles: 12

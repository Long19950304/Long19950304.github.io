- title: China’s October Energy Output
  title_zh: 国家统计局发布2026年10月能源生产数据
  url: https://www.stats.gov.cn/sj/zxfb/202611/t20261116_1965837.html
  published: '2026-11-16T10:00:00+08:00'
  source: 国家统计局
  category: Business & economy
  source_id: nbs-china
  authority: statistical_agency
  publisher_id: nbs-china
  coverage: china
  why: 'China’s National Bureau of Statistics reported mixed October energy production:
    coal output fell more slowly, while crude oil and natural gas output grew. Electricity
    generation declined for the month, although wind and solar generation recorded
    faster growth.'
  why_zh: 国家统计局称，2026年10月规上工业原煤产量同比下降，原油和天然气产量增长，发电量下降。1至10月规上工业发电量同比增长1.8%。
- title: US Bank Customers Report Service Disruptions
  title_zh: 美国多家主要银行客户报告服务中断
  url: https://www.bbc.co.uk/news/articles/cj752wvqneq6o
  published: '2026-11-17T00:18:01+00:00'
  source: BBC News Business
  category: Business & economy
  source_id: bbc-business
  authority: public_media
  publisher_id: bbc
  coverage: world
  why: BBC News Business reported that customers at several major US banks experienced
    outages affecting online banking, ATMs, transfers and other services on Monday
    afternoon. By 18:00 EST, reported outages were declining, although the precise
    cause of the disruption had not been established.
  why_zh: BBC News Business 报道，美国多家主要银行的客户于当地时间周一遇到网上银行、ATM、转账等服务问题。截至美东时间18:00，Chase、美国银行和US
    Bank的报告数量均已下降，但具体故障原因尚未查明。
- title: Wireless Near-Infrared Switch for Neural Activity
  title_zh: 无线近红外“开关”调控小鼠神经活动
  url: https://www.cas.cn/syky/202611/t20261117_5124408.shtml
  published: '2026-11-17T14:11:00+08:00'
  source: 中国科学院科研进展
  category: Science & research
  source_id: cas-research
  authority: research_primary
  publisher_id: cas-research
  coverage: china
  why: The Chinese Academy of Sciences reported a wireless, near-infrared technique
    that switched neuronal excitation on and off in freely moving mice without implanted
    fibers or head-mounted devices. Mouse tests covered three brain regions and timescales
    from seconds to tens of minutes, but the evidence does not include outcomes in
    people or clinical applications.
  why_zh: 中国科学院脑科学与智能技术卓越创新中心研发“双近红外开关”，以两束穿颅近红外光开启和终止神经元兴奋。小鼠实验覆盖三个脑区及数秒至数十分钟的调控时长，来源未涉及人体结果或临床应用。
- title: Researchers report a more stable methanol-to-hydrogen catalyst
  title_zh: 中国科学院团队报告更稳定的甲醇制氢催化剂
  url: https://www.cas.cn/syky/202611/t20261112_5124098.shtml
  published: '2026-11-17T10:44:00+08:00'
  source: 中国科学院科研进展
  category: Science & research
  source_id: cas-research
  authority: research_primary
  publisher_id: cas-research
  coverage: china
  why: The Chinese Academy of Sciences reports that a molecular-sieve catalyst combined
    methanol steam reforming with high hydrogen output and low carbon monoxide levels
    in laboratory tests. The study also reports stable operation over more than 600
    hours, while its broader industrial applicability remains untested.
  why_zh: 中国科学院称，过程工程研究所团队开发了一种分子筛限域催化剂，在实验室测试中兼具较高产氢速率和较低一氧化碳副产物。团队还报告该催化剂历经4次再生循环累计稳定运行超600小时，但完整商业重整系统中的适用性仍未经检验。
- title: Open-weight models gain a unified serving route
  title_zh: 开放权重模型获得统一调用路径
  url: https://huggingface.co/blog/openrouter
  published: '2026-11-16T00:00:00+00:00'
  source: Hugging Face
  category: AI tools & model releases
  source_id: huggingface
  authority: developer_primary
  publisher_id: huggingface
  coverage: world
  why: Hugging Face says it has switched language-model inference to OpenRouter, allowing
    one token and API to access open-weight models across more than 80 providers.
    Its figures show sharply lower average prices than closed models, but the best
    open-weight systems still trail leading proprietary models on difficult benchmarks.
  why_zh: Hugging Face称，其语言模型推理现已改由OpenRouter路由，可通过同一令牌和接口调用多家服务商支持的开放权重模型。发布方数据显示，开放权重模型平均价格较低，但在高难度基准测试中仍落后于领先的专有模型。

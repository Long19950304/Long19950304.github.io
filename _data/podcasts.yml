long1-desk1-news-title-framing-older-adults:
  language: en
  provider: notebooklm
  audio: assets/audio/notebooklm/long1-desk1-news-title-framing-older-adults-en.mp3
  take_home: Examines associations between news title framing of older adults and views, shares, collections, and rewards, with different patterns for negative and positive frames.

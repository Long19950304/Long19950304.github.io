<!DOCTYPE html>
<html data-game="20" lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Feelings单词记忆翻牌游戏</title>
<style>
  /* ===== 基础样式 ===== */
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    min-height: 100vh;
    font-family: "Comic Sans MS", "Microsoft YaHei", "PingFang SC", sans-serif;
    background: linear-gradient(160deg, #fff2f9 0%, #f3f0ff 45%, #e9f8ff 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: clamp(12px, 2vw, 28px);
    color: #4b3b6b;
    overflow-x: hidden;
  }

  /* ===== 顶部标题与工具栏（字体统一） ===== */
  header {
    width: 100%;
    max-width: 1560px;
    text-align: center;
  }

  h1 {
    font-family: inherit;
    font-size: clamp(26px, 3.2vw, 50px);
    color: #ff7fb2;
    text-shadow: 0 4px 0 #ffd7e8, 0 8px 18px rgba(255, 127, 178, .35);
    letter-spacing: 1px;
  }

  .toolbar {
    margin-top: clamp(10px, 1.6vw, 20px);
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: center;
    gap: clamp(10px, 1.6vw, 24px);
  }

  .stat {
    background: #fff;
    border: 3px solid #ffe0ef;
    border-radius: 999px;
    padding: clamp(8px, 1vw, 12px) clamp(18px, 2.2vw, 30px);
    font-size: clamp(16px, 1.5vw, 24px);
    box-shadow: 0 6px 14px rgba(255, 150, 195, .22);
    white-space: nowrap;
  }

  .stat b {
    color: #ff5f9e;
    font-size: 1.15em;
  }

  /* 重新开始按钮 */
  .btn {
    font-family: inherit;
    font-size: clamp(17px, 1.5vw, 23px);
    font-weight: bold;
    color: #fff;
    background: linear-gradient(180deg, #ffb347, #ff8c42);
    border: none;
    border-radius: 999px;
    padding: clamp(10px, 1.1vw, 14px) clamp(24px, 2.6vw, 40px);
    cursor: pointer;
    box-shadow: 0 6px 0 #e0712f, 0 10px 18px rgba(255, 140, 66, .35);
    transition: transform .12s, box-shadow .12s;
  }

  .btn:active { transform: translateY(4px); box-shadow: 0 2px 0 #e0712f; }

  /* ===== 卡牌棋盘：16 张，电脑端 8 列 × 2 行 ===== */
  .board {
    width: 100%;
    max-width: 1560px;
    margin-top: clamp(14px, 2vw, 28px);
    display: grid;
    grid-template-columns: repeat(8, minmax(0, 1fr));
    gap: clamp(8px, 1.1vw, 18px);
  }

  /* 单张卡牌（3D 透视） */
  .card {
    aspect-ratio: 3 / 4;
    background: transparent;
    border: none;
    padding: 0;
    perspective: 1200px;
    cursor: pointer;
    outline: none;
    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
  }

  .card-inner {
    position: relative;
    display: block;
    width: 100%;
    height: 100%;
    transform-style: preserve-3d;
    transition: transform .45s ease;
  }

  /* 只有 click 后加上 .flipped 才会翻面；卡片没有 hover 效果 */
  .card.flipped .card-inner { transform: rotateY(180deg); }

  .card-face {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: clamp(14px, 1.4vw, 22px);
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
    overflow: hidden;
  }

  /* --- 卡牌背面（未翻开，纯 CSS 花纹） --- */
  .card-back {
    border: 4px solid #fff;
    box-shadow: 0 8px 0 #e77fb3, 0 12px 22px rgba(231, 127, 179, .35);
    color: #fff;
    font-size: clamp(30px, 3.2vw, 58px);
    font-weight: bold;
    text-shadow: 0 3px 0 #e77fb3;
    background-image:
      radial-gradient(circle at 30% 25%, #ffd6ea, #ffaed4 60%, #f79bc8),
      radial-gradient(rgba(255,255,255,.55) 18%, transparent 19%);
    background-size: 100% 100%, 26px 26px;
    background-blend-mode: overlay;
  }

  /* --- 卡牌正面 --- */
  .card-front {
    transform: rotateY(180deg);
    background: #fffdf8;
    border: 4px solid #d9d0ff;
    box-shadow: 0 8px 0 #d9d0ff, 0 12px 22px rgba(150, 130, 220, .25);
    padding: 8px;
    text-align: center;
  }

  /* 正面：只显示英文单词，不显示中文 */
  .card-front.word {
    font-size: clamp(18px, 2vw, 38px);
    font-weight: bold;
    line-height: 1.1;
    color: #7c5cd6;
    word-break: break-word;
  }

  /* 正面：emoji 图片 */
  .card-front.emoji {
    font-size: clamp(36px, 4.8vw, 94px);
    line-height: 1;
    font-family: "Segoe UI Emoji", "Apple Color Emoji", "Noto Color Emoji", sans-serif;
  }

  /* 配对成功：绿色高亮并保持翻开 */
  .card.matched .card-front {
    background: #e8fff0;
    border-color: #6fd48f;
    box-shadow: 0 8px 0 #8be0a5, 0 0 0 6px rgba(111, 212, 143, .25);
    animation: pop .45s ease;
  }

  .card.matched { cursor: default; }

  /* 配对失败：轻微抖动 */
  .card.wrong .card-front { animation: shake .4s ease; }

  @keyframes pop {
    0% { transform: rotateY(180deg) scale(1); }
    50% { transform: rotateY(180deg) scale(1.08); }
    100% { transform: rotateY(180deg) scale(1); }
  }

  @keyframes shake {
    0%, 100% { transform: rotateY(180deg) translateX(0); }
    25% { transform: rotateY(180deg) translateX(-8px); }
    75% { transform: rotateY(180deg) translateX(8px); }
  }

  /* ===== 通关弹窗（只提示，不自动重置） ===== */
  .win-popup {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    display: none;
    pointer-events: none;   /* 不拦截鼠标，仍可点击【重新开始】 */
    z-index: 30;
    background: #fff;
    border: 6px solid #ffe0ef;
    border-radius: 32px;
    padding: clamp(24px, 3vw, 44px) clamp(30px, 4vw, 62px);
    text-align: center;
    box-shadow: 0 18px 40px rgba(120, 90, 170, .35);
  }

  .win-popup.show { display: block; }

  .win-popup h2 {
    margin-bottom: 12px;
    font-size: clamp(22px, 2.4vw, 38px);
    color: #ff5f9e;
  }

  .win-popup p {
    font-size: clamp(17px, 1.7vw, 25px);
    margin-top: 6px;
  }

  .win-popup p b { color: #7c5cd6; font-size: 1.2em; }

  .win-tip {
    color: #9b86c4;
    font-size: clamp(14px, 1.3vw, 19px) !important;
    margin-top: 14px !important;
  }

  /* ===== 小屏适配（投影端为 8 列 × 2 行） ===== */
  @media (max-width: 1200px) {
    .board { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  }

  @media (max-width: 640px) {
    .board { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  }
</style>
<link rel="stylesheet" href="/assets/games/game-display.css">
<script defer src="/assets/games/game-display.js"></script>
</head>
<body>

  <header>
    <h1>Feelings 单词记忆翻牌游戏</h1>
    <div class="toolbar">
      <div class="stat">翻牌次数：<b id="flipCount">0</b></div>
      <button class="btn" id="restartBtn">重新开始</button>
    </div>
  </header>

  <main class="board" id="board"></main>

  <!-- 通关提示：只提示，必须手动点【重新开始】才重置 -->
  <div class="win-popup" id="winPopup">
    <h2>恭喜你！全部配对成功！</h2>
    <p>你一共翻了 <b id="winFlips">0</b> 次牌</p>
    <p class="win-tip">请点击【重新开始】再玩一次</p>
  </div>

<script>
  /* ===== 严格固定 8 组配对，无其它单词、无其它表情 ===== */
  const PAIRS = [
    { word: "sad",     emoji: "😔" },
    { word: "worried", emoji: "😟" },
    { word: "excited", emoji: "🥳" },
    { word: "wrong",   emoji: "❌" },
    { word: "angry",   emoji: "😠" },
    { word: "afraid",  emoji: "😨" },
    { word: "parent",  emoji: "👨‍👩‍👧" },
    { word: "ask",     emoji: "❓" }
  ];

  const TOTAL_PAIRS = PAIRS.length;   // 8 组，共 16 张卡
  const JUDGE_DELAY = 500;            // 配对成功后的判定锁时长（毫秒）
  const FLIP_BACK_DELAY = 900;        // 配对失败后翻回并解锁的时长（毫秒）

  const board       = document.getElementById("board");
  const flipCountEl = document.getElementById("flipCount");
  const winPopup    = document.getElementById("winPopup");
  const winFlipsEl  = document.getElementById("winFlips");

  let firstCard  = null;   // 第一张翻开的牌
  let secondCard = null;   // 第二张翻开的牌
  let locked     = false;  // 游戏锁：翻开两张后上锁，判定结束必定解锁
  let flips      = 0;      // 翻牌次数
  let matched    = 0;      // 已配对数
  let round      = 0;      // 局数标记：重新开始后让旧延时回调失效

  /* 洗牌：Fisher-Yates 算法 */
  function shuffle(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }

  /* 生成 16 张牌的数据（每组拆成"单词牌"和"emoji 牌"） */
  function buildDeck() {
    const deck = [];
    PAIRS.forEach((pair, index) => {
      deck.push({ pairId: index, type: "word",  content: pair.word });
      deck.push({ pairId: index, type: "emoji", content: pair.emoji });
    });
    return shuffle(deck);
  }

  /* 开始 / 重新开始：只由【重新开始】按钮触发 */
  function startGame() {
    round++;               // 新的一局，作废之前尚未执行的延时回调
    firstCard = null;
    secondCard = null;
    locked = false;
    flips = 0;
    matched = 0;
    flipCountEl.textContent = "0";
    winPopup.classList.remove("show");

    // 渲染 16 张牌：初始全部背面朝上，不会自动翻开
    board.innerHTML = "";
    buildDeck().forEach(card => {
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "card";
      btn.dataset.pair = card.pairId;
      btn.dataset.type = card.type;
      btn.setAttribute("aria-label", "卡牌");

      btn.innerHTML = `
        <span class="card-inner">
          <span class="card-face card-back">?</span>
          <span class="card-face card-front ${card.type}">${card.content}</span>
        </span>
      `;

      // 唯一的事件：click 点击。没有 mouseover / mouseenter
      btn.addEventListener("click", () => onCardClick(btn));
      board.appendChild(btn);
    });
  }

  /* 点击卡牌：一次最多翻开两张 */
  function onCardClick(card) {
    // 已上锁、已配对、已翻开（含重复点同一张）都不响应
    if (locked || card.classList.contains("flipped") || card.classList.contains("matched")) return;

    // 翻面并累计翻牌次数
    card.classList.add("flipped");
    flips++;
    flipCountEl.textContent = flips;

    if (!firstCard) {
      // 第一张：等待第二张
      firstCard = card;
      return;
    }

    // 第二张：立刻上锁，判定结束后解锁
    secondCard = card;
    locked = true;

    // 固定住本回合的两张牌，避免延时期间被重置影响
    const a = firstCard;
    const b = secondCard;
    const currentRound = round;

    if (a.dataset.pair === b.dataset.pair) {
      // 配对成功：保持翻开并变绿；延时结束必定解锁
      setTimeout(() => {
        if (currentRound !== round) return;   // 期间点了【重新开始】，放弃本次回调
        a.classList.add("matched");
        b.classList.add("matched");
        matched++;
        firstCard = null;
        secondCard = null;
        locked = false;                       // 解锁，面板可继续点击

        // 8 组全部完成：只弹出恭喜，不自动重置
        if (matched === TOTAL_PAIRS) {
          winFlipsEl.textContent = flips;
          winPopup.classList.add("show");
        }
      }, JUDGE_DELAY);
    } else {
      // 配对失败：延时翻回；延时结束必定解锁
      a.classList.add("wrong");
      b.classList.add("wrong");
      setTimeout(() => {
        if (currentRound !== round) return;   // 期间点了【重新开始】，放弃本次回调
        a.classList.remove("flipped", "wrong");
        b.classList.remove("flipped", "wrong");
        firstCard = null;
        secondCard = null;
        locked = false;                       // 解锁，面板可继续点击
      }, FLIP_BACK_DELAY);
    }
  }

  /* 手动重置：只有这一个入口，不会自动重启 */
  document.getElementById("restartBtn").addEventListener("click", startGame);

  // 页面加载只渲染牌面：不翻牌、不演示、不启动任何循环定时器
  startGame();
</script>
</body>
</html>

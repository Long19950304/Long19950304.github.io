<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>女巫的毒药 Witch's Poison — 五年级英语课堂游戏</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family:"Comic Sans MS","Microsoft YaHei",sans-serif; }
  body {
    min-height:100vh; color:#fff; overflow-x:hidden;
    background: radial-gradient(ellipse at 50% 0%, #3b1d5e 0%, #1a0b2e 55%, #0d0518 100%);
  }
  /* ---------- 顶部 ---------- */
  header { text-align:center; padding:14px 10px 6px; }
  header h1 { font-size:2rem; text-shadow:0 0 18px #a259ff; letter-spacing:2px; }
  header p  { color:#c9a7f5; margin-top:2px; font-size:.95rem; }
  /* ---------- 计分板 ---------- */
  #scoreboard { display:flex; justify-content:center; gap:14px; flex-wrap:wrap; padding:10px; }
  .team {
    background:rgba(255,255,255,.08); border:2px solid #5b2d8f; border-radius:14px;
    padding:8px 20px; text-align:center; min-width:120px; transition:.3s;
  }
  .team .tname { font-size:1rem; color:#d9c2ff; }
  .team .tscore { font-size:2rem; font-weight:bold; color:#ffd94d; text-shadow:0 0 10px #ffaa00; }
  .team.active { border-color:#ffd94d; background:rgba(255,217,77,.15); transform:scale(1.08);
                 box-shadow:0 0 20px rgba(255,217,77,.5); }
  .team.active .tname::after { content:" 👈 请抽卡"; color:#ffd94d; font-size:.85rem; }
  #infoBar { text-align:center; color:#9f86c9; font-size:.9rem; padding-bottom:6px; }
  /* ---------- 卡阵 ---------- */
  #board {
    display:grid; grid-template-columns:repeat(auto-fill,minmax(120px,1fr));
    gap:16px; max-width:1100px; margin:0 auto; padding:14px 24px 40px;
  }
  .card { perspective:800px; height:150px; cursor:pointer; }
  .card-inner {
    position:relative; width:100%; height:100%; transition:transform .6s;
    transform-style:preserve-3d;
  }
  .card.flipped .card-inner { transform:rotateY(180deg); }
  .card.flipped { pointer-events:none; cursor:default; }
  .face {
    position:absolute; inset:0; border-radius:14px; backface-visibility:hidden;
    -webkit-backface-visibility:hidden;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    font-weight:bold; padding:6px; text-align:center;
  }
  .face.back {
    background:linear-gradient(135deg,#5b2d8f,#2c1250); border:3px solid #a259ff;
    font-size:2.2rem; box-shadow:0 4px 14px rgba(0,0,0,.5);
  }
  .face.back small { font-size:.7rem; color:#c9a7f5; margin-top:4px; }
  .card:not(.flipped):hover .card-inner { transform:scale(1.06); }
  .face.front { transform:rotateY(180deg); border:3px solid #fff; font-size:1.05rem; }
  .front.word-subject { background:linear-gradient(135deg,#1e6fd9,#0d3a75); }
  .front.word-day     { background:linear-gradient(135deg,#0f9d6c,#075236); }
  .front .en { font-size:1.25rem; }
  .front .cn { font-size:.85rem; opacity:.85; margin-top:4px; }
  .front .tag{ font-size:.7rem; margin-top:6px; background:rgba(255,255,255,.2);
               border-radius:8px; padding:2px 8px; }
  /* ---------- 全屏遮罩弹窗 ---------- */
  .overlay {
    position:fixed; inset:0; background:rgba(5,0,15,.88); display:none;
    align-items:center; justify-content:center; z-index:50; padding:16px;
  }
  .overlay.show { display:flex; }
  .modal {
    background:linear-gradient(160deg,#2c1250,#150826); border:3px solid #a259ff;
    border-radius:22px; padding:26px 30px; max-width:720px; width:100%;
    text-align:center; box-shadow:0 0 50px rgba(162,89,255,.6);
    animation:pop .35s ease; max-height:92vh; overflow-y:auto;
  }
  @keyframes pop { from{transform:scale(.6);opacity:0} to{transform:scale(1);opacity:1} }
  .modal h2 { font-size:2.4rem; margin:6px 0; text-shadow:0 0 14px #a259ff; }
  .modal .meaning { font-size:1.15rem; color:#d9c2ff; min-height:1.6em; }
  .step-label { color:#ffd94d; font-size:.95rem; margin:14px 0 6px; }
  .big-btn {
    font-size:1.15rem; font-weight:bold; border:none; border-radius:12px;
    padding:10px 24px; margin:5px; cursor:pointer; color:#fff; transition:.2s;
  }
  .big-btn:hover { transform:scale(1.07); }
  .big-btn.sel { outline:3px solid #ffd94d; box-shadow:0 0 14px rgba(255,217,77,.7); }
  .btn-blue  { background:#1e6fd9; } .btn-green { background:#0f9d6c; }
  .btn-gold  { background:#c98a00; } .btn-red   { background:#c0392b; }
  .btn-grey  { background:#555; }
  .cat-btn.wrong-pick { animation:shake .4s; background:#c0392b !important; }
  @keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-8px)} 75%{transform:translateX(8px)} }
  .sentence {
    font-size:1.6rem; background:rgba(255,217,77,.12); border:2px dashed #ffd94d;
    border-radius:14px; padding:12px; margin:10px 0; color:#ffe98a;
  }
  .witch-zone { font-size:3.4rem; animation:bob 1.2s ease-in-out infinite; }
  @keyframes bob { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-10px)} }
  .question {
    font-size:1.7rem; color:#c8ff7a; background:rgba(124,252,0,.1);
    border:2px solid #7CFC00; border-radius:14px; padding:14px; margin:10px 0;
    text-shadow:0 0 10px #7CFC00;
  }
  .hint { color:#9f86c9; font-size:.9rem; margin-top:4px; }
  /* ---------- 选毒药界面 ---------- */
  .pick-grid {
    display:grid; grid-template-columns:repeat(auto-fill,minmax(110px,1fr));
    gap:10px; margin-top:10px;
  }
  .pick-card {
    border:2px solid #5b2d8f; border-radius:12px; padding:10px 4px; cursor:pointer;
    background:rgba(255,255,255,.07); transition:.15s;
  }
  .pick-card:hover { transform:scale(1.06); border-color:#ffd94d; }
  .pick-card.taken { opacity:.25; pointer-events:none; }
  .pick-card .pe { font-size:1.05rem; font-weight:bold; }
  .pick-card .pc { font-size:.75rem; color:#c9a7f5; }
  .eyes { font-size:3rem; }
  footer { text-align:center; color:#6b4d99; font-size:.78rem; padding-bottom:14px; }
</style>
</head>
<body>

<header>
  <h1>🧙 女巫的毒药 Witch's Poison 🧪</h1>
  <p>粤沪版五年级上册 Unit 2 · Subjects &amp; Days · 秘密放毒版</p>
</header>

<div id="scoreboard"></div>
<div id="infoBar">准备开始……</div>
<div id="board"></div>

<!-- 通用弹窗 -->
<div id="overlay" class="overlay"><div class="modal" id="modalBox"></div></div>

<!-- 开始界面 -->
<div id="overlay2" class="overlay show">
  <div class="modal" style="max-width:540px;">
    <div style="font-size:3.5rem;">🧙</div>
    <h2 style="font-size:1.8rem;">女巫的毒药</h2>
    <p style="color:#c9a7f5;margin:8px 0 4px;">每个小组将秘密选择 1 个单词，炼成自己的毒药……</p>
    <p style="color:#9f86c9;font-size:.9rem;line-height:1.7;">
      抽到普通单词卡：读词 + 中文 + 分类 + 句型回答，答对加分<br>
      抽到别人的毒药词：放毒组提问，答题组必须用这个词回答！<br>
      答对正常拿分，答错本轮 0 分，放毒组加分！
    </p>
    <div class="step-label">选择小组数量：</div>
    <div id="teamCount" style="margin-bottom:14px;">
      <button class="big-btn btn-blue" data-n="2">2</button>
      <button class="big-btn btn-blue" data-n="3">3</button>
      <button class="big-btn btn-blue sel" data-n="4">4</button>
      <button class="big-btn btn-blue" data-n="5">5</button>
      <button class="big-btn btn-blue" data-n="6">6</button>
    </div>
    <button class="big-btn btn-gold" style="font-size:1.4rem;" onclick="beginPick()">🧪 开始选毒药</button>
  </div>
</div>

<footer>Witch's Poison · Subjects &amp; Days · 课堂竞赛游戏</footer>

<script>
/* ================= 数据 ================= */
var WORDS = [
  {en:"Chinese",  cn:"语文",   type:"subject"},
  {en:"Maths",    cn:"数学",   type:"subject"},
  {en:"English",  cn:"英语",   type:"subject"},
  {en:"PE",       cn:"体育",   type:"subject"},
  {en:"Art",      cn:"美术",   type:"subject"},
  {en:"Music",    cn:"音乐",   type:"subject"},
  {en:"Science",  cn:"科学",   type:"subject"},
  {en:"Monday",   cn:"星期一", type:"day"},
  {en:"Tuesday",  cn:"星期二", type:"day"},
  {en:"Wednesday",cn:"星期三", type:"day"},
  {en:"Thursday", cn:"星期四", type:"day"},
  {en:"Friday",   cn:"星期五", type:"day"},
  {en:"Saturday", cn:"星期六", type:"day"},
  {en:"Sunday",   cn:"星期日", type:"day"}
];

/* ================= 状态 ================= */
var deck = [], teams = [], poisons = {}, cur = 0, left = 0, lock = false;
var teamNum = 4, pickIdx = 0, scored = false;
/* poisons: { 单词en: 组号 } —— 某单词是哪个组的毒药 */

/* ================= 工具 ================= */
function shuffle(a){
  for(var i=a.length-1;i>0;i--){
    var j=Math.floor(Math.random()*(i+1));
    var t=a[i]; a[i]=a[j]; a[j]=t;
  }
  return a;
}
function $(id){ return document.getElementById(id); }
function overlayOpen(){ return $('overlay').classList.contains('show'); }
function openOverlay(){ $('overlay').classList.add('show'); }
function closeOverlay(){ $('overlay').classList.remove('show'); }
function modal(html){ $('modalBox').innerHTML = html; openOverlay(); }

/* ================= 第1步：每组秘密选毒药 ================= */
document.querySelectorAll('#teamCount button').forEach(function(b){
  b.onclick = function(){
    document.querySelectorAll('#teamCount button').forEach(function(x){ x.classList.remove('sel'); });
    b.classList.add('sel'); teamNum = +b.dataset.n;
  };
});

function beginPick(){
  $('overlay2').classList.remove('show');
  teams = [];
  for(var i=0;i<teamNum;i++) teams.push({name:"Group "+(i+1), score:0});
  poisons = {}; pickIdx = 0;
  renderScore();
  pickCover();
}

/* 遮挡屏：其他组闭眼，当前组看屏幕 */
function pickCover(){
  var t = teams[pickIdx];
  modal(
    '<div class="eyes">🙈</div>' +
    '<h2 style="font-size:1.7rem;">其他小组请闭眼 / 转身！</h2>' +
    '<p style="color:#c9a7f5;margin:8px 0;">只由 <b style="color:#ffd94d;">' + t.name + '</b> 看屏幕，秘密选择你们的毒药词</p>' +
    '<p class="hint">选定后只有你们自己知道，千万别出声！</p>' +
    '<button class="big-btn btn-gold" style="font-size:1.2rem;margin-top:12px;" onclick="pickGrid()">我是 ' + t.name + '，开始选择 🧪</button>'
  );
}

/* 选词界面 */
function pickGrid(){
  var html = '<div class="step-label" style="font-size:1.1rem;">' + teams[pickIdx].name + '：秘密点击 1 个单词，炼成你们的毒药 ☠️</div>' +
    '<p class="hint">已被其他组选走的词不能重复选</p><div class="pick-grid">';
  WORDS.forEach(function(w){
    var taken = poisons.hasOwnProperty(w.en);
    html += '<div class="pick-card' + (taken ? ' taken' : '') + '" onclick="confirmPick(\'' + w.en + '\')">' +
            '<div class="pe">' + w.en + '</div>' +
            '<div class="pc">' + w.cn + ' · ' + (w.type==='subject' ? '学科' : '星期') + '</div></div>';
  });
  html += '</div>';
  modal(html);
}

function confirmPick(en){
  poisons[en] = pickIdx;
  modal(
    '<div style="font-size:2.6rem;">☠️</div>' +
    '<h2 style="font-size:1.5rem;">你们的毒药词是：<span style="color:#c8ff7a;">' + en + '</span></h2>' +
    '<p style="color:#c9a7f5;">记住它，不要告诉别的小组！</p>' +
    '<button class="big-btn btn-green" style="margin-top:10px;" onclick="nextPick()">记住了 ✅</button>'
  );
}

function nextPick(){
  pickIdx++;
  if(pickIdx < teamNum) pickCover();
  else startGame();
}

/* ================= 第2步：正式游戏 ================= */
function startGame(){
  deck = shuffle(WORDS.map(function(w){
    return {en:w.en, cn:w.cn, type:w.type};
  }));
  cur = 0; left = deck.length; lock = false;
  closeOverlay();
  renderBoard(); renderScore();
}

function renderBoard(){
  var bd = $('board'); bd.innerHTML = '';
  deck.forEach(function(c, i){
    var d = document.createElement('div');
    d.className = 'card';
    d.innerHTML =
      '<div class="card-inner">' +
        '<div class="face back">🃏<small>Witch\'s Deck</small></div>' +
        '<div class="face front word-' + c.type + '">' +
          '<div class="en">' + c.en + '</div>' +
          '<div class="cn">' + c.cn + '</div>' +
          '<div class="tag">' + (c.type==='subject' ? 'Subject 学科' : 'Day 星期') + '</div>' +
        '</div></div>';
    d.onclick = function(){ draw(i, d); };
    bd.appendChild(d);
  });
}

function renderScore(){
  var sb = $('scoreboard'); sb.innerHTML = '';
  teams.forEach(function(t, i){
    sb.innerHTML += '<div class="team' + (i===cur ? ' active' : '') + '">' +
      '<div class="tname">' + t.name + '</div>' +
      '<div class="tscore">' + t.score + '</div></div>';
  });
  $('infoBar').textContent =
    left > 0 ? '轮到 ' + teams[cur].name + ' 抽卡 · 剩余卡片 ' + left + ' 张'
             : '全部卡片已抽完！';
}

function draw(i, el){
  if(lock || left <= 0 || el.classList.contains('flipped') || overlayOpen()) return;
  lock = true; scored = false;
  el.classList.add('flipped'); left--;
  renderScore();
  var c = deck[i];
  setTimeout(function(){
    var owner = poisons[c.en];
    /* 毒药触发：是别人组的毒药（抽到自己组的毒药不触发，按普通卡处理，避免暴露） */
    if(owner !== undefined && owner !== cur) showPoison(c, owner);
    else showWord(c);
  }, 550);
}

/* ---------- 普通单词卡 ---------- */
function showWord(c){
  modal(
    '<div class="step-label">✅ 普通单词卡！请 ' + teams[cur].name + ' 完成：</div>' +
    '<h2>' + c.en + '</h2>' +
    '<div class="meaning" id="mz">（① 请大声读出单词并说出中文意思）</div>' +
    '<button class="big-btn btn-grey" onclick="revealCn()">🔍 核对中文</button>' +
    '<div class="step-label">② 它是哪一类？</div>' +
    '<button class="big-btn btn-blue cat-btn"  onclick="pickCat(this,\'subject\',\'' + c.type + '\',\'' + c.en + '\')">📚 Subject 学科</button>' +
    '<button class="big-btn btn-green cat-btn" onclick="pickCat(this,\'day\',\'' + c.type + '\',\'' + c.en + '\')">📅 Day 星期</button>' +
    '<div id="step2"></div>'
  );
  window._curCn = c.cn;
}

function revealCn(){ $('mz').textContent = '中文：' + window._curCn; }

function pickCat(btn, pick, real, en){
  if(pick !== real){
    btn.classList.add('wrong-pick');
    setTimeout(function(){ btn.classList.remove('wrong-pick'); }, 450);
    $('mz').textContent = '❌ 再想想！它是 ' + (real==='subject' ? '学科 Subject' : '星期 Day');
    return;
  }
  var frame = real==='subject' ? 'I have ' + en + '.' : 'It\'s ' + en + '.';
  var q = real==='subject' ? '— What subjects do you have?' : '— What day is it today?';
  $('step2').innerHTML =
    '<div class="step-label">③ 进阶任务 · 用句型大声回答：</div>' +
    '<div class="sentence">' + q + '<br>— <b>' + frame + '</b></div>' +
    '<div class="step-label">老师评分：</div>' +
    '<button class="big-btn btn-gold" onclick="award(2)">⭐ 全部完成 +2</button>' +
    '<button class="big-btn btn-blue" onclick="award(1)">👍 基础正确 +1</button>' +
    '<button class="big-btn btn-red"  onclick="award(0)">✖ 答错 +0</button>';
}

/* ---------- 毒药触发！ ---------- */
function showPoison(c, owner){
  var asker = teams[owner], answerer = teams[cur];
  var q   = c.type==='subject' ? 'What subjects do you have?' : 'What day is it today?';
  var ans = c.type==='subject' ? 'I have ' + c.en + '.' : 'It\'s ' + c.en + '.';
  modal(
    '<div class="witch-zone">🧙☠️</div>' +
    '<h2 style="color:#c8ff7a;font-size:2rem;">POISON! 毒药生效！</h2>' +
    '<p style="color:#c9a7f5;font-size:1.05rem;">' +
      '<b style="color:#ffd94d;">' + answerer.name + '</b> 抽中了 ' +
      '<b style="color:#ff8a8a;">' + asker.name + '</b> 的毒药词 ' +
      '<b style="color:#c8ff7a;">' + c.en + '</b>（' + c.cn + '）！</p>' +
    '<div class="step-label">🎤 请 ' + asker.name + ' 起立提问（放毒）：</div>' +
    '<div class="question">"' + q + '"</div>' +
    '<div class="step-label">🗣 ' + answerer.name + ' 合作回答，答案必须用上毒药词：</div>' +
    '<div class="sentence"><b>' + ans + '</b></div>' +
    '<p class="hint">先让两组开口问答，再由老师判定 ↓</p>' +
    '<button class="big-btn btn-green" onclick="poisonResult(' + owner + ',true)">✔ 答对 · ' + answerer.name + ' 正常得分 +2</button>' +
    '<button class="big-btn btn-red"   onclick="poisonResult(' + owner + ',false)">✘ 答错 · 本轮 0 分，' + asker.name + ' +2</button>'
  );
}

function poisonResult(owner, ok){
  if(scored) return; scored = true;
  var asker = teams[owner], answerer = teams[cur];
  if(ok){
    teams[cur].score += 2;
    modal('<div style="font-size:3rem;">🎉</div>' +
      '<h2 style="font-size:1.6rem;">' + answerer.name + ' 解毒成功！+2 分</h2>' +
      '<button class="big-btn btn-gold" onclick="next()">继续游戏</button>');
  } else {
    teams[owner].score += 2;
    modal('<div style="font-size:3rem;">🧪</div>' +
      '<h2 style="font-size:1.5rem;color:#ff8a8a;">' + answerer.name + ' 中毒！本轮 0 分</h2>' +
      '<p style="color:#c8ff7a;font-size:1.1rem;">' + asker.name + ' 放毒成功 +2 分！</p>' +
      '<button class="big-btn btn-gold" onclick="next()">继续游戏</button>');
  }
  renderScore();
}

/* ---------- 计分 & 轮换 ---------- */
function award(n){
  if(scored) return; scored = true;   /* 防止连点重复加分 */
  teams[cur].score += n;
  next();
}

function next(){
  closeOverlay();
  renderScore();
  if(left === 0){ setTimeout(showEnd, 400); return; }
  cur = (cur + 1) % teams.length;
  renderScore();
  /* 短暂延迟解锁，避免关闭弹窗瞬间误点翻卡 */
  setTimeout(function(){ lock = false; }, 300);
}

/* ---------- 结算 ---------- */
function showEnd(){
  var max = Math.max.apply(null, teams.map(function(t){ return t.score; }));
  var win = teams.filter(function(t){ return t.score === max; })
                 .map(function(t){ return t.name; }).join(' & ');
  var poisonList = Object.keys(poisons).map(function(en){
    return teams[poisons[en]].name + ' 的毒药：' + en;
  }).join('<br>');
  var scores = teams.map(function(t){
    return '<p style="color:#c9a7f5;">' + t.name + '：' + t.score + ' 分</p>';
  }).join('');
  modal(
    '<div style="font-size:4rem;">👑</div>' +
    '<h2 style="color:#ffd94d;">' + win + '</h2>' +
    '<p style="font-size:1.2rem;color:#ffe98a;">获得 "Poison Breakers 解毒小能手" 称号！</p>' +
    scores +
    '<p class="hint" style="margin-top:10px;">' + poisonList + '</p>' +
    '<button class="big-btn btn-gold" style="margin-top:12px;" onclick="location.reload()">🔄 再玩一次</button>'
  );
}
</script>
</body>
</html>

items:
- title: China Retail Growth Through October
  title_zh: 国家统计局：2026年1—10月社会消费品零售总额增长1.0%
  url: https://www.stats.gov.cn/sj/zxfb/202611/t20261116_1965839.html
  published: '2026-11-16T10:00:00+08:00'
  source: 国家统计局
  category: Business & economy
  source_id: nbs-china
  authority: statistical_agency
  publisher_id: nbs-china
  coverage: china
  why: China’s National Bureau of Statistics reported 1.0% year-on-year growth in
    total retail sales from January through October 2026, with October growth at 0.4%.
    Online goods and services grew faster, although expanded platform coverage limits
    comparison with the former online retail series.
  why_zh: 国家统计局数据显示，2026年1—10月社会消费品零售总额为416464亿元，同比增长1.0%，10月同比增长0.4%。网上商品和服务零售额增长3.7%，但统计局扩大了网络服务平台统计范围，明确说明新旧指标不可比。
- title: In-Person Work and Office Design
  title_zh: 面对面办公与真实互动
  url: https://www.npr.org/2026/11/14/nx-s1-6040158/these-economists-say-in-person-work-boosts-creativity-but-office-mandates-fall-short
  published: '2026-11-14T12:40:28+00:00'
  source: NPR Business
  category: Business & economy
  source_id: npr-business
  authority: public_media
  publisher_id: npr
  coverage: world
  why: NPR Business reports that economists Natalia Emanuel and Emma Harrington argue
    that working together in person can support creativity and collaboration. Their
    fall 2026 survey also indicates that simply requiring office attendance does not
    necessarily create meaningful face-to-face interaction.
  why_zh: NPR商业报道，经济学家纳塔莉娅·埃马努埃尔与艾玛·哈灵顿认为，共同当面工作有助于创意、反馈和协作。二人2026年秋季的调查显示，仅要求员工到岗，并不一定能带来有意义的面对面交流。
- title: Chinese researchers directly image non-equilibrium Thomson cooling
  title_zh: 中国科学院：纳米沟道直接成像观测非平衡汤姆孙冷却
  url: https://www.cas.cn/syky/202611/t20261111_5124016.shtml
  published: '2026-11-16T09:17:00+08:00'
  source: 中国科学院科研进展
  category: Science & research
  source_id: cas-research
  authority: research_primary
  publisher_id: cas-research
  coverage: china
  why: The Chinese Academy of Sciences reports that a research team directly imaged
    electron temperature, lattice temperature and thermoelectric response in HgTe
    and HgCdTe nanodevices. The study observed enhanced non-equilibrium Thomson cooling
    in a 1μm-wide HgTe channel, with reported compensation ratios of about 9% and
    14.3%.
  why_zh: 中国科学院称，研究团队在HgTe和HgCdTe纳米沟道中同步成像电子温度、晶格温度及热电响应，并观测到超出经典理论预期的非平衡汤姆孙冷却效应。中国科学院2026年11月16日报道，1μm宽HgTe沟道的汤姆孙冷却补偿比在晶格通道和电子通道分别约为9%和14.3%。
- title: Stacked Mylar Insulation for Lunar Use
  title_zh: 层叠迈拉薄膜：为月球基地试验耐用隔热材料
  url: https://www.sciencedaily.com/releases/2026/11/261115085549.htm
  published: '2026-11-16T03:51:01+00:00'
  source: ScienceDaily
  category: Science & research
  source_id: sciencedaily
  authority: established_newsroom
  publisher_id: sciencedaily
  coverage: world
  why: University of Pennsylvania researchers report that hundreds of stacked Mylar
    sheets can combine vacuum insulation with resistance to bending and compression.
    The early laboratory material is about one square centimetre, so scale-up and
    further durability testing remain necessary.
  why_zh: 据《ScienceDaily》2026年11月15日报道，宾夕法尼亚大学研究人员把数百层极薄的迈拉薄膜叠成隔热材料，在真空中兼顾保温、柔韧性和抗压能力。当前样品仅约一平方厘米，规模化制造与耐久性验证仍待完成。
- title: ECNU Unveils Hyperspectral Satellite
  title_zh: 华东师大首颗自主研发高光谱卫星亮相
  url: https://news.sciencenet.cn/htmlnews/2026/11/574807.shtm
  published: '2026-11-16T13:38:32+08:00'
  source: 科学网新闻
  category: Science & research
  source_id: sciencenet-news
  authority: established_newsroom
  publisher_id: sciencenet-news
  coverage: china
  why: ScienceNet reports that East China Normal University unveiled its first independently
    led hyperspectral satellite, Huashi-Kedaxing, on November 15, 2026. The university
    also launched the Liangtian Constellation plan, targeting a 200-satellite network
    around 2030.
  why_zh: 科学网新闻报道，华东师范大学于2026年11月15日揭牌首颗自主牵头研制的低轨高光谱卫星“华师-科达星”，并启动“量天星座”计划。学校规划在2030年前后完成200颗卫星组网，相关性能与在轨能力仍属规划。

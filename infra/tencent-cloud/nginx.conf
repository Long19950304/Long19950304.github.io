server {
    listen 80;
    listen [::]:80;
    server_name zhaozhilong.com www.zhaozhilong.com;
    root /var/www/zhaozhilong.com;
    index index.html;
    error_page 404 /404.html;
    location /api/ { proxy_pass http://127.0.0.1:8080; proxy_http_version 1.1; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; }
    location / { try_files $uri $uri/ $uri.html =404; }
}

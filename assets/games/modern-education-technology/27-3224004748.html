<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gold Miner · 单词寻宝</title>
<style>
:root{--ink:#f9edcf;--gold:#ffca55;--deep:#172b31;--panel:#203a3d}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% 0,#385d57,#172b31 65%);color:var(--ink);font-family:Inter,"Trebuchet MS",system-ui,sans-serif}.wrap{max-width:1100px;margin:auto;padding:26px 20px 40px}.top{display:flex;align-items:center;justify-content:space-between;gap:14px}.brand{font-size:clamp(25px,4vw,42px);font-weight:900;letter-spacing:1px}.brand span{color:var(--gold)}.tag{opacity:.75;letter-spacing:2px;font-size:12px}.hud{display:flex;gap:12px}.pill{background:#ffffff12;border:1px solid #ffffff25;padding:10px 15px;border-radius:14px;font-weight:700}.pill b{color:var(--gold);font-size:19px;margin-left:6px}.game{margin-top:20px;background:linear-gradient(#274541,#1c3335);border:1px solid #ffffff25;border-radius:24px;overflow:hidden;box-shadow:0 22px 60px #07141680}.sky{height:155px;position:relative;background:linear-gradient(#9bc3a7,#d8c58d);overflow:hidden}.sun{position:absolute;right:10%;top:24px;width:64px;height:64px;background:#ffe7a0;border-radius:50%;box-shadow:0 0 45px #fff1af}.hill{position:absolute;bottom:-75px;width:120%;height:140px;left:-10%;border-radius:50%;background:#526b49}.hill:after{content:"";position:absolute;left:55%;top:-25px;width:60%;height:135px;border-radius:50%;background:#637d53}.cable{position:absolute;z-index:2;top:0;left:50%;width:3px;height:95px;background:#40392c;transform-origin:top;transition:height .7s,transform .5s}.hook{position:absolute;bottom:-16px;left:-8px;font-size:22px;color:#40392c}.miner{position:absolute;z-index:3;left:calc(50% - 58px);top:70px;font-size:48px;filter:drop-shadow(0 4px 2px #0004)}.mine{padding:18px 22px 26px;background:linear-gradient(#3b5140,#273a35);min-height:320px}.prompt{display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap}.listen{border:0;border-radius:50%;width:48px;height:48px;background:var(--gold);font-size:22px;cursor:pointer;box-shadow:0 4px 0 #b67b27}.status{min-height:24px;text-align:center;color:#ffdf89;font-weight:700;margin:10px}.rocks{display:grid;grid-template-columns:repeat(5,minmax(100px,1fr));gap:14px;max-width:900px;margin:18px auto 0}.rock{position:relative;min-height:96px;border:0;color:#f7efdc;font-size:20px;font-weight:800;cursor:pointer;background:linear-gradient(145deg,#89908b,#59615e 58%,#414946);border-radius:35% 40% 32% 38% / 40% 34% 45% 38%;box-shadow:inset 4px 5px 8px #ffffff38,inset -7px -8px 9px #20292785,0 8px 0 #26342e;transition:transform .2s,filter .2s}.rock:after{content:"";position:absolute;left:18%;top:15%;width:32%;height:12%;background:#ffffff38;border-radius:50%;transform:rotate(-23deg)}.rock:hover:not(:disabled){transform:translateY(-5px);filter:brightness(1.13)}.rock:disabled{cursor:default}.rock.gold{background:linear-gradient(145deg,#ffe992,#edb82d 60%,#b87914);color:#553a0b;box-shadow:inset 4px 5px 8px #fff9bd,0 8px 0 #815418}.rock.wrong{filter:brightness(.75)}.controls{display:flex;justify-content:center;margin-top:20px}.reset{border:1px solid #ffdc7d;background:#ffffff10;color:#ffe6a0;padding:10px 20px;border-radius:12px;font-weight:700;cursor:pointer}.hint{text-align:center;font-size:13px;opacity:.7;margin-top:14px}.foot{text-align:center;margin-top:14px;font-size:12px;opacity:.6}@media(max-width:700px){.rocks{grid-template-columns:repeat(2,1fr)}.rock:last-child:nth-child(odd){grid-column:span 2}.hud{gap:6px}.pill{padding:8px 10px}.sky{height:130px}}
</style></head><body><main class="wrap"><header class="top"><div><div class="brand">⛏ GOLD <span>MINER</span></div><div class="tag">LISTEN · THINK · DIG</div></div><div class="hud"><div class="pill">回合 <b id="round">1</b></div><div class="pill">金币 <b id="score">0</b></div></div></header><section class="game"><div class="sky"><div class="sun"></div><div class="hill"></div><div class="miner">👷</div><div class="cable" id="cable"><span class="hook">⌁</span></div></div><div class="mine"><div class="prompt"><button class="listen" id="listen" title="播放单词发音">🔊</button><strong>听录音，点击你听到的单词</strong></div><div class="status" id="status" aria-live="polite">准备好了吗？点击喇叭开始！</div><div class="rocks" id="rocks"></div><div class="controls"><button class="reset" id="next">↻ 下一题</button></div><div class="hint">答对的石头会变成黄金 · 点击喇叭可重复播放</div></div></section><div class="foot">初一基础词汇 · 美式英语发音</div></main><script>
const words=[['apple','苹果'],['school','学校'],['teacher','老师'],['family','家庭'],['friend','朋友'],['morning','早晨'],['water','水'],['window','窗户'],['pencil','铅笔'],['basketball','篮球'],['beautiful','美丽的'],['library','图书馆'],['holiday','假期'],['computer','电脑'],['elephant','大象'],['welcome','欢迎'],['kitchen','厨房'],['weather','天气'],['student','学生'],['orange','橙子']];let target,round=1,score=0,locked=false;const rocks=document.querySelector('#rocks'),status=document.querySelector('#status'),cable=document.querySelector('#cable');
function say(word){if(!('speechSynthesis'in window)){status.textContent='此浏览器暂不支持语音合成';return}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(word);u.lang='en-US';u.rate=.78;const voices=speechSynthesis.getVoices();const en=voices.find(v=>v.lang==='en-US')||voices.find(v=>v.lang.startsWith('en'));if(en)u.voice=en;speechSynthesis.speak(u)}
function newRound(){locked=false;cable.style.height='95px';cable.style.transform='translateX(0)';const picks=[];while(picks.length<5){let w=words[Math.floor(Math.random()*words.length)];if(!picks.includes(w))picks.push(w)}target=Math.floor(Math.random()*picks.length);rocks.innerHTML='';picks.forEach((w,i)=>{const b=document.createElement('button');b.className='rock';b.textContent=w[0];b.title='点击 '+w[0];b.onclick=()=>dig(b,i,w[0]);rocks.append(b)});status.textContent='点击喇叭听单词，然后选择石头';document.querySelector('#round').textContent=round}
function dig(btn,i,word){if(locked)return;locked=true;cable.style.height='225px';cable.style.transform=`translateX(${(i-2)*145}px)`;status.textContent='矿工正在挖掘……';setTimeout(()=>{if(i===target){btn.classList.add('gold');score++;document.querySelector('#score').textContent=score;status.textContent=`✨ 正确！${word} — ${words.find(w=>w[0]===word)[1]}`}else{btn.classList.add('wrong');status.textContent='差一点！听一听，再试试下一题。'}[...rocks.children].forEach(x=>x.disabled=true);round++},850)}
document.querySelector('#listen').onclick=()=>say(words.find((_,i)=>i===0)?.[0]&&rocks.children[target]?.textContent?words.find(w=>w[0]===rocks.children[target].textContent)?.[0]:'');document.querySelector('#next').onclick=newRound;newRound();speechSynthesis?.getVoices?.();
</script></body></html>

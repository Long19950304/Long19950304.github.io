    group: series
    title:
      zh: 先贤对谈
      en: Xianxian Dialogues
    format:
      zh: AI 虚构对话
      en: AI-generated fictional dialogues
    description:
      zh: 通过 AI 生成画面与声音，呈现人物之间的虚构对话，并以不同机位组织叙事。
      en: Imagined conversations presented through AI-generated imagery and voices, with multiple camera viewpoints.

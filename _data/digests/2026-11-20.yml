items:
- title: Port Tech and Faster China–Peru Trade
  title_zh: 钱凯港智能系统与中秘贸易数据
  url: https://www.chinanews.com.cn/cj/2026/11-20/10734988.shtml
  published: '2026-11-20T06:06:26+08:00'
  source: 中国新闻网财经
  category: Business & economy
  source_id: chinanews-finance
  authority: news_agency
  publisher_id: chinanews-finance
  coverage: china
  why: China News Service reports that Qianhai Port’s smart systems and expanding
    routes coincided with higher throughput and faster shipping to Shanghai. The figures
    cover 2025 and January–September 2026, while the source does not independently
    establish the systems’ causal effect.
  why_zh: 中国新闻网称，钱凯港的智能系统和航线扩展伴随吞吐量提升，中秘海运周期由35天至40天缩短至23天。报道涵盖2025年及2026年前9个月数据，但未独立证明智能系统是增长原因。
- title: Booking consolidates partner travel operations
  title_zh: Booking整合合作伙伴旅游业务
  url: https://www.cnbc.com/2026/11/18/booking-holdings-enterprise.html
  published: '2026-11-18T12:55:01+00:00'
  source: CNBC Business
  category: Business & economy
  source_id: cnbc-business
  authority: established_newsroom
  publisher_id: cnbc-business
  coverage: world
  why: Booking Holdings will combine two business-to-business travel operations in
    a new enterprise division beginning in January, according to CNBC. Agoda CEO Omri
    Morgenshtern will lead the unit, but Booking has not disclosed its expected contribution
    to group revenue or profit.
  why_zh: 据CNBC商业报道，Booking Holdings计划自明年1月整合两项企业旅游业务，并由Agoda首席执行官Omri Morgenshtern负责新部门。Booking尚未披露该部门对公司收入或利润的预期贡献。
- title: Gene Identified for Tea’s Freshness Storage
  title_zh: 研究团队鉴定茶树储存茶氨酸的关键基因
  url: https://news.sciencenet.cn/htmlnews/2026/11/575021.shtm
  published: '2026-11-19T21:41:55+08:00'
  source: 科学网新闻
  category: Science & research
  source_id: sciencenet-news
  authority: established_newsroom
  publisher_id: sciencenet-news
  coverage: china
  why: ScienceNet News reports that researchers identified CsVTT1, a gene whose protein
    transports theanine into tea-tree vacuoles for storage. The team combined yeast,
    frog-oocyte and tea hairy-root experiments to support its function, while the
    work’s broader breeding and crop-nitrogen applications remain prospective.
  why_zh: 科学网新闻援引《中国科学报》称，研究团队历时6年鉴定出将茶氨酸运入液泡的基因CsVTT1。相关论文10月30日发表于《植物细胞》，多种实验支持其功能，而育种、减量施肥和作物改良用途仍属后续方向。
- title: Quantum Contextuality Becomes a Hardware Benchmark
  title_zh: 量子情境性成为量子硬件评测工具
  url: https://research.google/blog/a-game-you-cannot-win-unless-you-have-a-quantum-computer
  published: '2026-11-19T20:03:00+00:00'
  source: Google Research
  category: Research tools
  source_id: google-research
  authority: developer_primary
  publisher_id: google-research
  coverage: world
  why: Google Research reports that superconducting qubits exceeded classical limits
    on several contextuality-based tasks, including a magic-square game and tests
    spanning up to 105 qubits. The team also says these experiments exposed subtle
    coherent errors that conventional random-circuit benchmarks can miss.
  why_zh: Google Research 报告，其超导量子处理器在魔方游戏等情境性任务中超过经典策略上限，并在扩展至105量子比特的实验中保持分离。团队还称，这些任务发现了传统随机电路基准可能掩盖的相干误差。
- title: Dry Ultrasound Material for Wearable Patches
  title_zh: 无需凝胶的可穿戴超声材料
  url: https://news.mit.edu/2026/ultrasound-imaging-without-gel-1119
  published: '2026-11-19T19:00:00+00:00'
  source: MIT News
  category: Science & research
  source_id: mit-news
  authority: research_primary
  publisher_id: mit-news
  coverage: world
  why: MIT News reports that engineers developed a dry, stretchy polymer that could
    replace gel in wearable ultrasound patches. Tests found clear imaging for around
    nine days and sustained blood-flow imaging during a 30-minute bike ride.
  why_zh: MIT News报道，麻省理工学院与新加坡—麻省理工学院研究团队开发出一种干燥、可拉伸的聚合物，有望替代可穿戴超声贴片中的凝胶。实验显示，该材料可连续约九天保持清晰成像，并在三十分钟骑行中持续准确记录血流图像。

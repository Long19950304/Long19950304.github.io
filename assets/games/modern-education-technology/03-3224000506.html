<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Unit 4 食物闯关小游戏</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{
    margin:0;min-height:100vh;color:#2f3b33;
    font-family:"PingFang SC","Microsoft YaHei","Segoe UI",system-ui,sans-serif;
    background:
      radial-gradient(circle at 8% 6%,#FFE3BF 0,transparent 42%),
      radial-gradient(circle at 94% 4%,#D6F5E1 0,transparent 40%),
      radial-gradient(circle at 50% 100%,#FFE9EC 0,transparent 45%),
      #FFF9F0;
  }
  .app{max-width:940px;margin:0 auto;padding:16px 16px 44px}
  header.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
  .logo{font-size:15px;font-weight:800;letter-spacing:.5px;color:#8a6a3c}
  .logo b{color:#e2643f}
  .steps{display:flex;gap:6px;margin-left:auto}
  .step{width:26px;height:26px;border-radius:50%;background:#fff;border:2px solid #eadcc7;
        display:grid;place-items:center;font-size:12px;font-weight:800;color:#b9a68b;cursor:pointer;
        transition:.15s}
  .step:hover{border-color:#FFC94D}
  .step.on{background:#FFC94D;border-color:#FFC94D;color:#5a3d0c;box-shadow:0 3px 0 #e0a52f}
  .step.done{background:#3FAE7C;border-color:#3FAE7C;color:#fff}
  .pill{display:flex;align-items:center;gap:6px;background:#fff;border-radius:999px;
        padding:7px 14px;font-weight:800;font-size:15px;box-shadow:0 4px 14px rgba(160,120,70,.13)}
  .pill span{color:#e2643f;font-variant-numeric:tabular-nums}
  .mute{border:none;background:#fff;width:36px;height:36px;border-radius:50%;cursor:pointer;
        font-size:16px;box-shadow:0 4px 14px rgba(160,120,70,.13)}
  .panel{background:#fff;border-radius:26px;padding:22px 22px 26px;
         box-shadow:0 16px 40px rgba(170,130,80,.14);animation:rise .35s ease both}
  @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  h1{font-size:clamp(24px,4.6vw,40px);line-height:1.15;margin:6px 0 6px;letter-spacing:-.5px}
  h1 em{font-style:normal;color:#e2643f}
  h2{font-size:20px;margin:0 0 6px}
  .sub{color:#8c8172;font-size:14px;line-height:1.75;margin:0 0 16px}
  .sub b{color:#5c4d38}
  .kicker{display:inline-block;background:#FFF1D6;color:#a1731b;font-weight:800;font-size:12px;
          padding:5px 12px;border-radius:999px;letter-spacing:1px}

  /* 首页 */
  .menu{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:18px 0 20px}
  @media(max-width:620px){.menu{grid-template-columns:1fr}}
  .menu-item{display:flex;gap:12px;align-items:flex-start;background:#FFFBF4;border:2px solid #F3E7D4;
             border-radius:18px;padding:14px}
  .menu-item .ico{font-size:24px;line-height:1.1}
  .menu-item h3{margin:0 0 3px;font-size:15px}
  .menu-item p{margin:0;font-size:12.5px;color:#918473;line-height:1.55}
  .btn{border:none;border-radius:16px;padding:13px 24px;font-size:16px;font-weight:800;cursor:pointer;
       font-family:inherit;transition:transform .12s,box-shadow .12s}
  .btn:active{transform:translateY(2px)}
  .btn-main{background:#3FAE7C;color:#fff;box-shadow:0 6px 0 #2c8a60}
  .btn-main:active{box-shadow:0 3px 0 #2c8a60}
  .btn-ghost{background:#F5EFE4;color:#7c6a54}
  .qbtn{border:none;font-family:inherit;cursor:pointer;border-radius:999px;padding:6px 12px;
        font-size:12.5px;font-weight:800;background:#FFF3D9;color:#8a5f14;box-shadow:0 3px 0 #EBD3A6}
  .qbtn:active{transform:translateY(2px);box-shadow:0 1px 0 #EBD3A6}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

  /* ============ 第1关 跑酷 ============ */
  .hud{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px;
       flex-wrap:wrap}
  .hearts{font-size:20px;letter-spacing:2px;line-height:1}
  .goal{font-size:13px;font-weight:800;color:#8a6a3c;background:#FFF5E3;border-radius:999px;padding:6px 12px}
  .runner-wrap{position:relative;border-radius:20px;overflow:hidden;border:3px solid #F0DFC4;
               box-shadow:0 10px 24px rgba(170,130,80,.16)}
  canvas#cv{display:block;width:100%;height:auto;background:#FFF2DC;touch-action:manipulation}
  .prompt{position:absolute;left:12px;top:10px;background:rgba(255,255,255,.92);border-radius:14px;
          padding:8px 12px;display:flex;align-items:center;gap:8px;font-size:13px;font-weight:800;
          color:#7c6238;box-shadow:0 4px 12px rgba(120,90,40,.15);transition:opacity .2s}
  .prompt .em{font-size:28px;line-height:1}
  .overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
           background:rgba(48,40,32,.55);backdrop-filter:blur(3px);padding:16px;text-align:center}
  .ov-card{background:#fff;border-radius:22px;padding:22px 26px;max-width:340px;
           box-shadow:0 18px 40px rgba(0,0,0,.25);animation:rise .3s ease both}
  .ov-card h3{margin:6px 0 6px;font-size:20px}
  .ov-card p{margin:0 0 16px;font-size:13.5px;color:#8c8172;line-height:1.65}
  .controls{display:flex;gap:8px;margin-top:10px;align-items:center;flex-wrap:wrap}
  .tbtn{flex:1;min-width:110px;border:none;font-family:inherit;font-size:16px;font-weight:800;
        padding:12px;border-radius:14px;background:#FFF3D9;color:#8a5f14;cursor:pointer;
        box-shadow:0 4px 0 #EBD3A6}
  .tbtn:active{transform:translateY(2px);box-shadow:0 2px 0 #EBD3A6}
  .hintline{font-size:12.5px;color:#a99a86;line-height:1.6}
  .speedbar{display:flex;align-items:center;gap:6px;margin-top:10px;font-size:12.5px;
            font-weight:800;color:#a28f76}
  .speedbar button{border:none;font-family:inherit;font-weight:800;font-size:12.5px;cursor:pointer;
                   padding:6px 14px;border-radius:999px;background:#F5EFE4;color:#8a7660;transition:.15s}
  .speedbar button.on{background:#FFC94D;color:#5a3d0c;box-shadow:0 3px 0 #e0a52f}
  .collect{display:flex;gap:6px;min-height:30px;margin-top:10px;font-size:20px;flex-wrap:wrap}

  /* ============ 第2关 账单 ============ */
  .receipt{background:#FFFDF7;border-radius:14px;padding:18px 16px;border:2px dashed #E8D5B5;
           position:relative;box-shadow:inset 0 0 0 6px #fff}
  .receipt .head{text-align:center;font-size:12px;letter-spacing:3px;color:#b9a68b;font-weight:800;margin-bottom:12px}
  .line{display:flex;gap:10px;align-items:flex-start;padding:10px 4px;border-bottom:1px dashed #EEE1CC}
  .line:last-child{border-bottom:none}
  .line .no{width:20px;flex:none;font-size:12px;font-weight:800;color:#c9b89c;padding-top:6px}
  .tokens{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
  .tok{border:none;font-family:inherit;cursor:pointer;background:#F7F1E6;color:#5a4a34;border-radius:8px;
       padding:5px 8px;font-size:14px;line-height:1.4;transition:.15s}
  .tok:hover{background:#FFE9BF}
  .tok.fixed{background:#DFF6E9;color:#1f7350;font-weight:800;box-shadow:0 0 0 2px #8ED6B3 inset}
  .tok.shake{animation:shake .35s}
  .line .why{display:none;font-size:12px;color:#8a6a3c;background:#FFF8E8;border-radius:8px;
             padding:6px 10px;margin-top:8px;line-height:1.6}
  .line.done .why{display:block}
  .shake{animation:shake .35s}
  @keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

  /* ============ 第3关 餐厅点单 ============ */
  .scene-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;
             font-size:12.5px;font-weight:800;color:#a28f76}
  .rest-scene{position:relative;height:clamp(250px,44vw,360px);border-radius:20px;overflow:hidden;
              border:3px solid #F0DFC4;box-shadow:0 10px 24px rgba(170,130,80,.16);background:#E9D6BD}
  .rest-scene .bgart{position:absolute;inset:0;width:100%;height:100%}
  .rest-scene .veil{position:absolute;inset:0;
    background:linear-gradient(180deg,rgba(255,250,240,0),rgba(58,40,24,.22))}
  .actor{position:absolute;bottom:16px;display:flex;flex-direction:column;align-items:center;z-index:2}
  .actor.left{left:4%}
  .actor.right{right:4%}
  .actor .face{font-size:clamp(40px,7vw,58px);line-height:1;
               filter:drop-shadow(0 6px 10px rgba(0,0,0,.3))}
  .actor .tag{font-size:10px;font-weight:800;color:#fff;background:rgba(50,35,20,.55);
              padding:2px 8px;border-radius:999px;margin-top:4px;letter-spacing:.5px}
  .speech{position:relative;background:#fff;border-radius:14px;padding:8px 12px;margin-bottom:8px;
          font-size:clamp(11px,1.55vw,13.5px);font-weight:800;color:#4d3f2d;
          max-width:min(220px,42vw);line-height:1.5;box-shadow:0 6px 16px rgba(0,0,0,.2);transition:.2s}
  .speech:after{content:"";position:absolute;bottom:-6px;width:12px;height:12px;background:#fff;transform:rotate(45deg)}
  .actor.left .speech:after{left:18px}
  .actor.right .speech:after{right:18px}
  .actor.right .speech{text-align:right}
  .table{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);z-index:2;text-align:center}
  .table .plate{width:76px;height:76px;border-radius:50%;background:rgba(255,255,255,.94);
                display:grid;place-items:center;font-size:38px;border:3px solid #fff;
                box-shadow:0 8px 18px rgba(0,0,0,.22)}
  .table .cap{font-size:10px;font-weight:800;color:#fff;margin-top:4px;min-height:14px;
              max-width:160px;line-height:1.3;text-shadow:0 1px 3px rgba(0,0,0,.55)}
  .fly{position:fixed;z-index:999;font-size:40px;line-height:1;pointer-events:none;
       transition:transform .62s cubic-bezier(.35,.9,.35,1),opacity .62s}
  .order-opts{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:12px}
  .order-opt{border:2px solid #F0E4CF;background:#fff;border-radius:16px;padding:12px 6px;cursor:pointer;
             font-family:inherit;display:flex;flex-direction:column;align-items:center;gap:3px;transition:.15s}
  .order-opt:hover{border-color:#FFC94D;transform:translateY(-2px)}
  .order-opt .em{font-size:30px;line-height:1.1}
  .order-opt .nm{font-size:11.5px;font-weight:800;color:#7c6a54;text-align:center;line-height:1.3}
  .order-opt.shake{animation:shake .35s}

  /* ============ 第4关 三餐 ============ */
  .passage{background:#FFFBF4;border-radius:18px;padding:16px 18px;font-size:15px;
           line-height:1.95;color:#4a4238;margin-bottom:14px}
  .passage b{color:#e2643f}
  .meals{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px}
  @media(max-width:620px){.meals{grid-template-columns:1fr 1fr}}
  .plate{font-family:inherit;cursor:pointer;border:2px dashed #E8D5B5;border-radius:18px;
         background:#FFFDF7;padding:10px;text-align:left;min-height:96px;transition:.15s}
  .plate:hover{border-color:#FFC94D}
  .plate .ttl{font-size:12.5px;font-weight:800;color:#8a6a3c;display:block;margin-bottom:6px}
  .plate .slot{display:flex;flex-wrap:wrap;gap:4px;font-size:20px;line-height:1}
  .plate.less{background:#FFF3EE;border-color:#F5C4B4}
  .plate.shake{animation:shake .35s}
  .plate.ok{border-color:#3FAE7C;background:#F2FBF6}
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
  .chip{font-family:inherit;cursor:pointer;border:2px solid #F0E4CF;background:#fff;border-radius:14px;
        padding:8px 12px;display:flex;align-items:center;gap:6px;font-size:13px;font-weight:800;color:#6b5a44;transition:.15s}
  .chip:hover{border-color:#FFC94D}
  .chip .em{font-size:22px}
  .chip.sel{border-color:#3FAE7C;background:#EAF9F1;box-shadow:0 0 0 3px #C9EFDC}
  .chips-empty{font-size:12.5px;color:#b9a68b;padding:6px 0}

  /* ============ 结算 ============ */
  .stars{font-size:38px;letter-spacing:6px;margin:6px 0 2px}
  .result-score{font-size:46px;font-weight:900;color:#e2643f;line-height:1.1}
  .result-score small{font-size:15px;color:#a99a86;font-weight:700}
  .wordlist{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px;justify-content:center}
  .wordlist span{background:#FFF3D9;border-radius:999px;padding:6px 12px;font-size:13px;
                 font-weight:700;color:#8a5f14}

  #toast{position:fixed;left:50%;bottom:34px;transform:translate(-50%,20px);opacity:0;
         background:#2f3b33;color:#fff;padding:12px 20px;border-radius:999px;font-size:14px;
         font-weight:700;transition:.25s;pointer-events:none;max-width:86vw;text-align:center;z-index:99}
  #toast.show{opacity:1;transform:translate(-50%,0)}
  #toast.good{background:#2c8a60}
  #toast.bad{background:#c14b31}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="logo">UNIT 4 · <b>What do we like to eat?</b></div>
    <div class="steps" id="steps">
      <div class="step on">1</div><div class="step">2</div><div class="step">3</div><div class="step">4</div>
    </div>
    <div class="pill">⭐ <span id="score">0</span> 分</div>
    <button class="mute" id="muteBtn" title="音效开关">🔊</button>
  </header>
  <main id="stage"></main>
</div>
<div id="toast"></div>

<script>
(function () {
  "use strict";

  /* ================= 基础工具 ================= */
  var $ = function (s) { return document.querySelector(s); };
  var stage = $("#stage");
  var scoreEl = $("#score");
  var toastEl = $("#toast");
  var MAX_SCORE = 800;
  var score = 0, muted = false, audioCtx = null, toastTimer = null;

  // 每一关独立计分：总分 = 四关各自最好成绩相加
  var best = { 1: 0, 2: 0, 3: 0, 4: 0 };
  var curLevel = 0, runScore = 0;

  function unlockAudio() {
    if (!audioCtx) {
      try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { audioCtx = null; }
    }
    if (audioCtx && audioCtx.state === "suspended") { audioCtx.resume(); }
  }
  function tone(freq, dur, delay, type) {
    if (muted || !audioCtx) return;
    var t0 = audioCtx.currentTime + (delay || 0);
    var osc = audioCtx.createOscillator(), g = audioCtx.createGain();
    osc.type = type || "sine";
    osc.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(0.16, t0 + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    osc.connect(g); g.connect(audioCtx.destination);
    osc.start(t0); osc.stop(t0 + dur + 0.05);
  }
  function sndOk() { tone(660, 0.12, 0); tone(990, 0.16, 0.1); }
  function sndBad() { tone(170, 0.22, 0, "square"); }
  function sndWin() { tone(523, 0.14, 0); tone(659, 0.14, 0.13); tone(784, 0.3, 0.26); }

  function toast(msg, kind) {
    toastEl.textContent = msg;
    toastEl.className = "show " + (kind || "");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toastEl.className = ""; }, 1800);
  }
  function refreshScore() {
    score = best[1] + best[2] + best[3] + best[4] - (best[curLevel] || 0) + runScore;
    scoreEl.textContent = score;
  }
  function award(n) { runScore += n; refreshScore(); }
  function commitLevel() {
    best[curLevel] = Math.max(best[curLevel] || 0, runScore);
    runScore = 0;
    curLevel = 0;
    refreshScore();
  }
  function enterLevel(n) { curLevel = n; runScore = 0; refreshScore(); setStep(n); }
  function goLevel(n) {
    unlockAudio();
    if (PK.running) { PK.running = false; cancelAnimationFrame(PK.raf); }
    if (runScore > 0 && curLevel > 0) commitLevel();
    if (n === 1) level1();
    else if (n === 2) level2();
    else if (n === 3) level3();
    else level4();
  }
  function shuffle(arr) {
    for (var i = arr.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = arr[i]; arr[i] = arr[j]; arr[j] = t;
    }
    return arr;
  }
  function setStep(n) {
    var st = document.querySelectorAll(".step");
    for (var i = 0; i < st.length; i++) {
      var lv = i + 1;
      st[i].dataset.lv = lv;
      st[i].className = "step" + (lv === n ? " on" : (best[lv] > 0 ? " done" : ""));
      st[i].title = "进入第 " + lv + " 关";
      st[i].onclick = function () { goLevel(+this.dataset.lv); };
    }
  }
  function shake(el) {
    el.classList.remove("shake");
    void el.offsetWidth;
    el.classList.add("shake");
  }
  function nextBtn(text, fn) {
    var b = document.createElement("button");
    b.className = "btn btn-main";
    b.textContent = text;
    b.onclick = fn;
    return b;
  }
  function endPanel(text, fn) {
    var panel = stage.querySelector(".panel");
    var box = document.createElement("div");
    box.style.marginTop = "16px";
    box.innerHTML = '<p class="sub" style="margin:0 0 12px">' + text + "</p>";
    box.appendChild(nextBtn("进入下一关 →", fn));
    panel.appendChild(box);
    box.scrollIntoView({ behavior: "smooth", block: "nearest" });
  }

  document.getElementById("muteBtn").onclick = function () {
    muted = !muted;
    this.textContent = muted ? "🔈" : "🔊";
  };

  /* ================= 单词数据 ================= */
  var foods = [
    { en: "watermelon", zh: "西瓜", emoji: "🍉" },
    { en: "cabbage",    zh: "卷心菜", emoji: "🥬" },
    { en: "mutton",     zh: "羊肉", emoji: "🍖" },
    { en: "cookie",     zh: "曲奇饼干", emoji: "🍪" },
    { en: "onion",      zh: "洋葱", emoji: "🧅" },
    { en: "carrot",     zh: "胡萝卜", emoji: "🥕" }
  ];

  /* ================= 首页 ================= */
  function home() {
    curLevel = 0; runScore = 0; refreshScore(); setStep(0);
    stage.innerHTML =
      '<section class="panel">' +
        '<span class="kicker">七年级 · 英语闯关</span>' +
        '<h1>What would you <em>like</em>?</h1>' +
        '<p class="sub">四关互相独立：跑酷抢单词 → 给账单找茬 → 在餐厅当服务员 → 按短文配三餐。' +
          '哪一关都能直接进，满分 800 分。</p>' +
        '<div class="menu">' +
          '<div class="menu-item"><div class="ico">🏃</div><div><h3>第 1 关 · 食物跑酷</h3><p>冲过三栏单词牌，撞对单词收集食物。5 颗心，撞错就扣。</p></div></div>' +
          '<div class="menu-item"><div class="ico">🧾</div><div><h3>第 2 关 · 账单找茬</h3><p>餐厅账单里全是 a / some 的错误，点出错的那个词改对。</p></div></div>' +
          '<div class="menu-item"><div class="ico">🍽️</div><div><h3>第 3 关 · 餐厅点单</h3><p>你当服务员：顾客说 I’d like…，选对菜并送到他面前。</p></div></div>' +
          '<div class="menu-item"><div class="ico">🍱</div><div><h3>第 4 关 · 健康三餐</h3><p>读完 Jane 的一天，把食物放进早/午/晚餐盘。</p></div></div>' +
        '</div>' +
        '<div class="row">' +
          '<button class="btn btn-main" id="startBtn">开始闯关 →</button>' +
          '<span style="font-size:13px;color:#a99a86">教室玩法：分组抢答，每组派一人操作</span>' +
        '</div>' +
        '<div class="row" style="margin-top:10px;gap:8px">' +
          '<span style="font-size:12.5px;color:#a99a86;font-weight:700">直接进入：</span>' +
          '<button class="qbtn" data-lv="1">1 跑酷</button>' +
          '<button class="qbtn" data-lv="2">2 账单</button>' +
          '<button class="qbtn" data-lv="3">3 点单</button>' +
          '<button class="qbtn" data-lv="4">4 三餐</button>' +
        '</div>' +
      '</section>';
    $("#startBtn").onclick = function () { unlockAudio(); level1(); };
    var qb = stage.querySelectorAll(".qbtn");
    for (var i = 0; i < qb.length; i++) {
      qb[i].onclick = function () { goLevel(+this.dataset.lv); };
    }
  }

  /* =========================================================
     第 1 关 · 食物跑酷（canvas）
     ========================================================= */
  var CW = 860, CH = 420;
  var LANES = [212, 300, 388];
  var speedRate = 1;
  var cvs = null, ctx = null;

  var PK = {
    running: false, raf: 0, startScore: 0,
    hearts: 5, got: 0, goal: 8, lane: 1, y: LANES[1],
    speed: 100, scroll: 0, gates: [], parts: [],

  function level1() {

  function moveLane(n) {
    if (!PK.running) return;
    PK.lane = Math.max(0, Math.min(2, n));
  }

  window.addEventListener("keydown", function (e) {
    if (!PK.running) return;

      e.preventDefault(); moveLane(PK.lane - 1);

      e.preventDefault(); moveLane(PK.lane + 1);

  });

  function drawHearts() {
    var h = PK.hearts;

  }

  function pickFood(except) {
    var pool = foods.filter(function (f) { return f.en !== except; });
    return pool[Math.floor(Math.random() * pool.length)];
  }

  function spawnGateGroup() {
    var f = pickFood("");
    var wrong = shuffle(foods.filter(function (x) { return x.en !== f.en; }).slice()).slice(0, 2);
    var words = shuffle([f.en, wrong[0].en, wrong[1].en]);
    var items = [];
    for (var i = 0; i < 3; i++) {
      items.push({
        lane: i, x: CW + 30, w: 152, h: 56,
        word: words[i], correct: words[i] === f.en, resolved: false
      });
    }
    PK.gates.push({ food: f, items: items });
  }

  function loop(ts) {
    if (!PK.running) return;
    var dt = Math.min((ts - PK.last) / 1000, 0.05);
    PK.last = ts;
    update(dt);
    render();
    if (!PK.running) return;
    PK.raf = requestAnimationFrame(loop);
  }

  function update(dt) {
    PK.y += (LANES[PK.lane] - PK.y) * Math.min(1, dt * 16);
    PK.scroll += PK.speed * speedRate * dt;
    PK.flash = Math.max(0, PK.flash - dt * 2.2);

    PK.spawnT -= dt * speedRate;
    if (PK.spawnT <= 0) {
      spawnGateGroup();
      PK.spawnT = 3.9;
    }

    var pb = { x: 116, y: PK.y - 24, w: 48, h: 48 };
    var i, j, it;

    for (i = 0; i < PK.gates.length; i++) {
      var g = PK.gates[i];
      for (j = 0; j < 3; j++) {
        it = g.items[j];
        it.x -= PK.speed * speedRate * dt;
        if (it.resolved) continue;
        if (it.lane !== PK.lane) continue;
        if (it.x < pb.x + pb.w && it.x + it.w > pb.x) {
          resolveGate(g, it);
          break;
        }
      }
    }
    PK.gates = PK.gates.filter(function (g) {
      return g.items[0].x + g.items[0].w > -40;
    });

    for (i = 0; i < PK.parts.length; i++) {
      var p = PK.parts[i];
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.vy += 520 * dt;
      p.life -= dt;
    }
    PK.parts = PK.parts.filter(function (p) { return p.life > 0; });

    drawPrompt();
  }

  function resolveGate(g, it) {
    g.items.forEach(function (x) { x.resolved = true; });
    if (it.correct) {
      PK.got++;
      award(25);
      sndOk();
      PK.speed += 6;
      PK.collected.push(g.food.emoji);
      PK.flash = 0.5; PK.flashColor = "63,174,124";
      burst(200, PK.y, "#3FAE7C");
      var col = $("#collect");
      if (col) col.textContent = PK.collected.join(" ");
      toast("✔ " + g.food.en + " = " + g.food.zh + "  +25", "good");
      var goalEl = $("#goal");
      if (goalEl) goalEl.textContent = "已收集 " + PK.got + " / 8";
      if (PK.got >= PK.goal) winL1();
    } else {
      PK.flash = 0.7; PK.flashColor = "226,100,63";
      burst(200, PK.y, "#E2643F");
      it.wrongHit = true;
      hurt("❌ 那不对哦，正确答案是 " + g.food.en);
    }
  }

  function hurt(msg) {
    PK.hearts--;

  function burst(x, y, color) {
    for (var i = 0; i < 14; i++) {
      PK.parts.push({
        x: x, y: y,
        vx: (Math.random() - 0.5) * 320,
        vy: -Math.random() * 260,
        life: 0.55 + Math.random() * 0.3,
        color: color, r: 3 + Math.random() * 4
      });
    }
  }

  function drawPrompt() {
    var near = null;
    for (var i = 0; i < PK.gates.length; i++) {
      var g = PK.gates[i];
      if (g.items[0].resolved) continue;
      if (g.items[0].x > 640) continue;
      if (!near || g.items[0].x < near.items[0].x) near = g;
    }
    var wrap = $("#prompt");
    if (!wrap) return;
    if (near) {
      wrap.style.opacity = "1";
      wrap.querySelector(".em").textContent = near.food.emoji;

      $("#promptTx").textContent = "准备下一块单词牌…";
    }
  }

  function rr(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function render() {
    if (!ctx) return;
    ctx.clearRect(0, 0, CW, CH);

    var sky = ctx.createLinearGradient(0, 0, 0, 180);
    sky.addColorStop(0, "#FFF3DD");
    sky.addColorStop(1, "#FFDCC4");
    ctx.fillStyle = sky;
    ctx.fillRect(0, 0, CW, 180);

    ctx.fillStyle = "#FFD37A";
    ctx.beginPath(); ctx.arc(748, 58, 32, 0, 7); ctx.fill();

    // 云
    ctx.fillStyle = "rgba(255,255,255,.85)";
    for (var c = 0; c < 3; c++) {
      var cx = ((c * 320 - PK.scroll * 0.12) % 1100 + 1100) % 1100 - 120;
      ctx.beginPath();
      ctx.arc(cx, 60 + c * 18, 26, 0, 7);
      ctx.arc(cx + 30, 58 + c * 18, 20, 0, 7);
      ctx.arc(cx + 58, 62 + c * 18, 22, 0, 7);
      ctx.fill();
    }

    // 远山
    ctx.fillStyle = "#EADCC2";
    for (var i = -1; i < 5; i++) {
      var bx = i * 250 - (PK.scroll * 0.25 % 250);
      ctx.beginPath(); ctx.arc(bx + 120, 200, 110, Math.PI, 0); ctx.fill();
    }

    // 路面
    ctx.fillStyle = "#FBF1E0";
    ctx.fillRect(0, 170, CW, CH - 170);
    ctx.fillStyle = "#F6E7CF";
    ctx.fillRect(0, 170, CW, 90);

    // 车道分隔虚线
    ctx.strokeStyle = "#E7D3B3";
    ctx.lineWidth = 4;
    ctx.setLineDash([26, 22]);
    ctx.lineDashOffset = -PK.scroll % 48;
    [256, 344].forEach(function (y) {
      ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(CW, y); ctx.stroke();
    });
    ctx.setLineDash([]);

    // 路边装饰
    ctx.font = "26px 'Segoe UI Emoji','Apple Color Emoji',sans-serif";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    var deco = ["🌳", "🌻", "🌷", "🍀"];
    for (var d = 0; d < 6; d++) {
      var dx = ((d * 210 - PK.scroll * 0.6) % 1260 + 1260) % 1260 - 100;
      ctx.globalAlpha = 0.85;
      ctx.fillText(deco[d % deco.length], dx, 178);
      ctx.globalAlpha = 1;
    }

    // 单词牌
    for (var g = 0; g < PK.gates.length; g++) {
      var grp = PK.gates[g];
      for (var j = 0; j < 3; j++) {
        var it = grp.items[j];
        var yTop = LANES[it.lane] - it.h / 2;
        var far = it.x > 620;
        ctx.globalAlpha = it.resolved ? 0.18 : (far ? 0.45 : 1);
        ctx.fillStyle = "#fff";
        ctx.strokeStyle = it.wrongHit ? "#E2643F" : "#DFC9A6";
        ctx.lineWidth = 3;
        rr(it.x, yTop, it.w, it.h, 14);
        ctx.fill();
        ctx.stroke();
        var size = 20;
        ctx.font = "800 " + size + "px 'Segoe UI',system-ui,sans-serif";
        while (ctx.measureText(it.word).width > it.w - 20 && size > 10) {
          size--;
          ctx.font = "800 " + size + "px 'Segoe UI',system-ui,sans-serif";
        }
        ctx.fillStyle = it.wrongHit ? "#C0392B" : "#5A4630";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText(it.word, it.x + it.w / 2, LANES[it.lane] + 1);
        ctx.globalAlpha = 1;
      }
    }

    // 玩家
    var px = 140, py = PK.y + Math.sin(PK.scroll / 26) * 3;
    ctx.fillStyle = "rgba(120,90,50,.13)";
    ctx.beginPath(); ctx.ellipse(px, PK.y + 30, 24, 7, 0, 0, 7); ctx.fill();
    ctx.save();
    ctx.translate(px, py);
    ctx.scale(-1, 1);
    ctx.font = "46px 'Segoe UI Emoji','Apple Color Emoji',sans-serif";
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillText("🏃", 0, 0);
    ctx.restore();

    // 粒子
    for (var p = 0; p < PK.parts.length; p++) {
      var pt = PK.parts[p];
      ctx.globalAlpha = Math.max(0, pt.life * 2);
      ctx.fillStyle = pt.color;
      ctx.beginPath(); ctx.arc(pt.x, pt.y, pt.r, 0, 7); ctx.fill();
    }
    ctx.globalAlpha = 1;

    if (PK.flash > 0) {
      ctx.fillStyle = "rgba(" + PK.flashColor + "," + (PK.flash * 0.35) + ")";
      ctx.fillRect(0, 0, CW, CH);
    }
  }

            '</g>' +
            '<g>' +
              '<rect x="308" y="56" width="84" height="62" rx="4" fill="#FFF9EE" stroke="#B9905F" stroke-width="5"/>' +
              '<path d="M320 104c10-18 21-27 32-32 11 5 22 14 32 32z" fill="#9CC08F"/>' +
              '<rect x="470" y="56" width="84" height="62" rx="4" fill="#FFF9EE" stroke="#B9905F" stroke-width="5"/>' +
              '<circle cx="498" cy="82" r="11" fill="#E7A05F"/>' +
              '<path d="M484 108c8-9 18-13 29-13s21 4 29 13z" fill="#B8CD8F"/>' +
            '</g>' +
            '<rect y="232" width="860" height="74" fill="#DDB88A"/>' +
            '<g stroke="#C9A071" stroke-width="3">' +
              '<line x1="0" y1="232" x2="860" y2="232"/><line x1="0" y1="270" x2="860" y2="270"/>' +
              '<line x1="140" y1="232" x2="140" y2="306"/><line x1="430" y1="232" x2="430" y2="306"/>' +
              '<line x1="720" y1="232" x2="720" y2="306"/>' +
            '</g>' +
            '<rect y="306" width="860" height="54" fill="url(#floorG)"/>' +
            '<g stroke="#8E6540" stroke-width="2" opacity=".45">' +
              '<line x1="0" y1="306" x2="860" y2="306"/>' +
              '<line x1="140" y1="306" x2="76" y2="360"/><line x1="360" y1="306" x2="332" y2="360"/>' +
              '<line x1="560" y1="306" x2="588" y2="360"/><line x1="760" y1="306" x2="820" y2="360"/>' +
            '</g>' +
          '</svg>' +
          '<div class="veil"></div>' +
          '<div class="actor left">' +
            '<div class="speech" id="waiterSay">What would you like?</div>' +
            '<div class="face">🧑‍🍳</div><div class="tag">WAITER</div>' +
          '</div>' +
          '<div class="actor right">' +
            '<div class="speech" id="custSay"></div>' +
            '<div class="face" id="custFace">👧</div><div class="tag">CUSTOMER</div>' +
          '</div>' +
          '<div class="table">' +
            '<div class="plate" id="plate">🍽️</div>' +
            '<div class="cap" id="plateCap"></div>' +
          '</div>' +
        '</div>' +
        '<div class="order-opts" id="orderOpts"></div>' +
      '</section>';

    renderRound();
  }

  function renderRound() {
    var r = orderRounds[ORD.i];
    $("#custFace").textContent = r.face;
    $("#custSay").textContent = r.line;
    $("#waiterSay").textContent = "What would you like?";
    $("#plate").textContent = "🍽️";
    $("#plateCap").textContent = "";
    $("#ordProg").textContent = "顾客 " + (ORD.i + 1) + " / " + orderRounds.length;

    var correct = dishPool.filter(function (d) { return d.id === r.dish; })[0];
    var decoys = shuffle(dishPool.filter(function (d) { return d.id !== r.dish; }).slice()).slice(0, 2);
    var opts = shuffle([correct].concat(decoys));

    var wrap = $("#orderOpts");
    wrap.innerHTML = "";
    opts.forEach(function (d) {
      var b = document.createElement("button");
      b.className = "order-opt";
      b.innerHTML = '<span class="em">' + d.emoji + '</span><span class="nm">' + d.en + "</span>";
      b.onclick = function () { chooseDish(d, b); };
      wrap.appendChild(b);
    });
  }

  function chooseDish(d, btn) {
    if (ORD.locked) return;
    unlockAudio();
    var r = orderRounds[ORD.i];

    if (d.id === r.dish) {
      ORD.locked = true;
      award(25);
      sndOk();
      $("#waiterSay").textContent = "Here you are!";
      var others = stage.querySelectorAll(".order-opt");
      for (var i = 0; i < others.length; i++) others[i].disabled = true;

      flyDish(d.emoji, btn, $("#plate"), function () {
        $("#plate").textContent = d.emoji;
        $("#plateCap").textContent = d.en;
        $("#custFace").textContent = "😋";
        $("#custSay").textContent = "Thank you! It looks great!";
        toast("✔ " + d.en + " 上对啦 +25", "good");

        setTimeout(function () {
          ORD.locked = false;
          ORD.i++;
          if (ORD.i >= orderRounds.length) {
            sndWin();
            commitLevel();
            endPanel("六位顾客都吃上了！I’d like some… 这句点餐话你现在一定很熟了。", level4);
          } else {
            renderRound();
          }
        }, 1300);
      });
    } else {
      sndBad();
      shake(btn);
      toast("顾客要的不是 " + d.en + "，再读一遍他说的话。", "bad");
    }
  }

  function flyDish(emoji, fromEl, toEl, done) {
    var a = fromEl.getBoundingClientRect();
    var b = toEl.getBoundingClientRect();
    var f = document.createElement("div");
    f.className = "fly";
    f.textContent = emoji;
    f.style.left = (a.left + a.width / 2 - 20) + "px";
    f.style.top = (a.top + a.height / 2 - 20) + "px";
    document.body.appendChild(f);

    var dx = (b.left + b.width / 2) - (a.left + a.width / 2);
    var dy = (b.top + b.height / 2) - (a.top + a.height / 2);
    requestAnimationFrame(function () {
      f.style.transform = "translate(" + dx + "px," + dy + "px) scale(1.35)";
      f.style.opacity = "0.95";
    });
    setTimeout(function () { f.remove(); done(); }, 660);
  }

  /* =========================================================
     第 4 关 · 健康三餐
     ========================================================= */
  var meals = [
    { id: "b", ttl: "🌅 Breakfast 早餐" },
    { id: "l", ttl: "☀️ Lunch 午餐" },
    { id: "d", ttl: "🌙 Dinner 晚餐" },
    { id: "x", ttl: "🙅 少吃 Less" }
  ];

  var mealChips = [
    { em: "🥣", name: "porridge", meal: "b", why: "早饭 Jane 通常喝粥。" },
    { em: "🥚", name: "egg", meal: "b", why: "早饭还有一个鸡蛋。" },
    { em: "🥛", name: "milk", meal: "b", why: "早饭喝一杯牛奶。" },
    { em: "🍚", name: "rice", meal: "l", why: "午饭吃米饭。" },
    { em: "🍗", name: "chicken", meal: "l", why: "午饭吃一些鸡肉。" },
    { em: "🥬", name: "cabbage", meal: "l", why: "午饭吃很多蔬菜，比如卷心菜。" },
    { em: "🐟", name: "fish", meal: "d", why: "晚饭吃一些鱼。" },
    { em: "🥗", name: "salad", meal: "d", why: "晚饭还有一份沙拉。" },
    { em: "🍪", name: "cookies", meal: "x", why: "Jane 不吃太多曲奇，所以放进“少吃”。" },
    { em: "🍦", name: "ice cream", meal: "x", why: "冰激凌同样在“少吃”清单里。" }
  ];

  var MEAL = { sel: null, placed: 0 };

  function level4() {
    enterLevel(4);
    MEAL = { sel: null, placed: 0 };

    stage.innerHTML =
      '<section class="panel">' +
        '<h2>第 4 关 · 健康三餐</h2>' +
        '<p class="sub">先读短文，再给 Jane 配餐：<b>先点一个食物，再点它该去的餐盘</b>。她少吃的东西放“少吃”盘。</p>' +
        '<div class="passage">' +
          "Healthy eating is not hard. For <b>breakfast</b>, Jane usually has some porridge, an egg and a glass of milk. " +
          "At <b>lunch</b>, she has rice, some chicken and lots of vegetables like carrots and cabbage. " +
          "She doesn’t eat too many cookies or too much ice cream. For <b>dinner</b>, she has some fish and a salad. " +
          "She drinks water, not cola. Healthy food makes her strong and happy." +
        "</div>" +
        '<div class="meals" id="meals"></div>' +
        '<div class="chips" id="chips"></div>' +
        '<p class="hintline" style="margin-top:10px">一共 10 样食物，全部放对就通关。</p>' +
      "</section>";

    var wrap = $("#meals");
    meals.forEach(function (m) {
      var b = document.createElement("button");
      b.className = "plate" + (m.id === "x" ? " less" : "");
      b.dataset.meal = m.id;
      b.innerHTML = '<span class="ttl">' + m.ttl + '</span><div class="slot" id="slot-' + m.id + '"></div>';
      b.onclick = function () { placeChip(m.id, b); };
      wrap.appendChild(b);
    });

    renderChips();
  }

  function renderChips() {
    var wrap = $("#chips");
    wrap.innerHTML = "";
    var left = mealChips.filter(function (c) { return !c.done; });
    if (!left.length) { wrap.innerHTML = '<span class="chips-empty">全部放完啦 🎉</span>'; return; }

    shuffle(left.slice()).forEach(function (c) {
      var b = document.createElement("button");
      b.className = "chip" + (MEAL.sel === c ? " sel" : "");
      b.innerHTML = '<span class="em">' + c.em + '</span><span>' + c.name + "</span>";
      b.onclick = function () {
        unlockAudio();
        MEAL.sel = c;
        renderChips();
      };
      wrap.appendChild(b);
    });
  }

  function placeChip(mealId, plateEl) {
    unlockAudio();
    if (!MEAL.sel) { toast("先在上面点一个食物，再点餐盘。", "bad"); return; }
    var c = MEAL.sel;

    if (c.meal === mealId) {
      c.done = true;
      MEAL.placed++;
      MEAL.sel = null;
      award(30);
      sndOk();
      var slot = $("#slot-" + mealId);
      slot.textContent += c.em + " ";
      plateEl.classList.add("ok");
      setTimeout(function () { plateEl.classList.remove("ok"); }, 600);
      toast("✔ " + c.name + "：" + c.why, "good");
      renderChips();
      if (MEAL.placed === mealChips.length) {
        sndWin();
        commitLevel();
        setTimeout(finish, 800);
      }
    } else {
      sndBad();
      shake(plateEl);
      toast("这个餐盘不对，想想短文里 " + c.name + " 出现在哪一餐。", "bad");
    }
  }

  /* =========================================================
     结算
     ========================================================= */
  function finish() {
    var rate = score / MAX_SCORE;
    var stars = rate >= 0.9 ? 3 : (rate >= 0.7 ? 2 : 1);
    var starStr = "★★★".slice(0, stars) + "☆☆☆".slice(0, 3 - stars);
    var title = stars === 3 ? "Food Master! 食物小达人" : (stars === 2 ? "Well done! 表现不错" : "Keep going! 继续加油");
    var comment = stars === 3
      ? "跑酷、改账单、上菜、配餐全部拿下，单词和句型都很稳！"
      : (stars === 2 ? "大部分都掌握了，重点再练可数/不可数和 I’d like… 句型。" : "从第 1 关再来一遍，注意 a / some 和名词复数。");

    stage.innerHTML =
      '<section class="panel" style="text-align:center">' +
        '<div class="stars">' + starStr + "</div>" +
        '<h2 style="font-size:24px">' + title + "</h2>" +
        '<div class="result-score">' + score + "<small> / " + MAX_SCORE + " 分</small></div>" +
        '<p class="sub" style="margin-top:10px">' + comment + "</p>" +
        '<div class="wordlist">' +
          "<span>🍉 watermelon</span><span>🥬 cabbage</span><span>🍖 mutton</span>" +
          "<span>🍪 cookie</span><span>🧅 onion</span><span>🥕 carrot</span>" +
        "</div>" +
        '<div class="row" style="justify-content:center;margin-top:22px">' +
          '<button class="btn btn-main" id="againBtn">再玩一次</button>' +
          '<button class="btn btn-ghost" id="homeBtn">回到首页</button>' +
        "</div>" +
      "</section>";

    $("#againBtn").onclick = function () {
      best = { 1: 0, 2: 0, 3: 0, 4: 0 };
      curLevel = 0; runScore = 0; refreshScore();
      goLevel(1);
    };
    $("#homeBtn").onclick = home;
    setStep(5);
  }

  home();
})();
</script>

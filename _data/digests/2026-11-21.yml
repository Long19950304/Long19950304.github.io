- title: AI and China’s Smart Factories
  title_zh: 人工智能与中国智能工厂
  url: https://www.news.cn/fortune/20261120/d1b603091aa0460dae7a70c1be426236/c.html
  published: '2026-11-20T00:00:00+08:00'
  source: 新华社财经
  category: Business & economy
  source_id: xinhua-finance
  authority: news_agency
  publisher_id: xinhua-finance
  coverage: china
  why: Xinhua Finance reported on 20 November 2026 that China had cultivated 49 leading
    smart factories, including 34 named in the second batch. At Nanjing Steel, real-time
    sensors were associated with a 10-percentage-point increase in the first-grade
    rate of molten iron.
  why_zh: 新华社财经2026年11月20日报道，中国已有49家领航级智能工厂，第二批名单包括34家工厂。南钢披露，高炉多维传感数据应用与铁水一级品率提升10个百分点相关。
- title: U.S. Multinational Employment and Investment Rose in 2024
  title_zh: 美国跨国公司2024年就业与投资增长
  url: https://www.bea.gov/news/2026/activities-us-multinational-enterprises-2024
  published: '2026-11-20T13:30:00+00:00'
  source: U.S. Bureau of Economic Analysis
  category: Business & economy
  source_id: bea-data
  authority: statistical_agency
  publisher_id: bea-data
  coverage: world
  why: The U.S. Bureau of Economic Analysis reported that employment, value added,
    capital spending, and research spending by U.S. multinational enterprises all
    increased in 2024. The 2024 employment figures are preliminary, while the agency
    revised its 2023 estimates to incorporate newly available and revised source data.
  why_zh: 美国经济分析局报告称，2024年美国跨国企业的就业、增加值、资本支出和研发支出均增长。2024年就业数据为初步值，2023年估计值因采用新获得及修订后的源数据而调整。
- title: How a Wound Scent Switches Locusts from Recovery to Risk
  title_zh: 伤口气味如何让飞蝗从康复转向风险
  url: https://news.sciencenet.cn/htmlnews/2026/11/575064.shtm
  published: '2026-11-20T22:50:51+08:00'
  source: 科学网新闻
  category: Science & research
  source_id: sciencenet-news
  authority: established_newsroom
  publisher_id: sciencenet-news
  coverage: china
  why: ScienceNet reports that a microbe-derived scent can help injured locusts mount
    immune defenses while also attracting cannibalistic locusts. A published study
    links the contrast to wound size, with laboratory findings offering possible targets
    for population monitoring and pest control.
  why_zh: 科学网报道，中国农业科学院深圳农业基因组研究所团队发现，飞蝗伤口气味中的愈创木酚既能促进免疫防御，也会吸引同类捕食。研究还识别出关键嗅觉受体，为种群监测和绿色防控提供潜在靶点。
- title: Physics-Constrained AI Keeps Chaotic Models Bounded
  title_zh: 物理约束让混沌人工智能模型保持有界
  url: https://news.mit.edu/new-approach-enables-physically-consistent-ai-models-chaotic-systems-1120
  published: '2026-11-20T20:00:00+00:00'
  source: MIT News
  category: Science & research
  source_id: mit-news
  authority: research_primary
  publisher_id: mit-news
  coverage: world
  why: MIT News reports that researchers developed a physics-based method that prevents
    machine-learning models of chaotic systems from producing unbounded, physically
    impossible predictions. Tests on varied physical systems showed closer agreement
    with true outcomes than conventional approaches, though realistic weather systems
    remain future testing.
  why_zh: 据MIT新闻，麻省理工学院研究人员提出一种物理约束机器学习方法，防止混沌系统模型产生无界且物理上不可能的预测。该方法在受控物理系统测试中比常规方法更接近真实结果，但尚未证明其适用于真实天气系统。
- title: Researchers Advance Low-Cost Sodium-Ion Cathode
  title_zh: 中国科学院：低成本钠离子电池复合磷酸盐正极取得进展
  url: https://www.cas.cn/syky/202611/t20261111_5124017.shtml
  published: '2026-11-20T10:03:00+08:00'
  source: 中国科学院科研进展
  category: Science & research
  source_id: cas-research
  authority: research_primary
  publisher_id: cas-research
  coverage: china
  why: The Chinese Academy of Sciences reported progress on a low-cost iron-manganese
    composite phosphate cathode for sodium-ion batteries. The team linked intrinsic
    oxygen vacancies to structural changes that hinder sodium reinsertion, then reported
    improved cell performance and stable operation of a pilot production line.
  why_zh: 中国科学院称，科研团队通过轨道调控与电荷补偿协同策略，改进铁锰复合磷酸盐正极的储钠性能。百吨级中试线已实现全线贯通并稳定运行，但商业化表现尚未由该来源确立。

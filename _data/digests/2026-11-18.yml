- title: China Parcel Volume Exceeds 17 Billion for Two Months
  title_zh: 中国快递业务量连续两个月超170亿件
  url: https://www.chinanews.com.cn/cj/2026/11-17/10733362.shtml
  published: '2026-11-17T13:59:42+08:00'
  source: 中国新闻网财经
  category: Business & economy
  source_id: chinanews-finance
  authority: news_agency
  publisher_id: chinanews-finance
  coverage: china
  why: China’s express-delivery development index rose 0.5% year on year to 477.8
    in October, according to China News Service. The State Post Bureau’s report said
    parcel volume exceeded 17 billion for two consecutive months and forecast October
    revenue growth of about 3%.
  why_zh: 中国国家邮政局报告显示，10月中国快递发展指数为477.8，同比增长0.5%，快递业务量连续两个月超过170亿件。报告预计10月快递业务收入同比增长约3%，并预计11月行业整体运行保持平稳向好。
- title: Canada’s October Home Sales Rise Slightly
  title_zh: 加拿大十月住宅销售小幅回升
  url: https://www.cbc.ca/news/business/crea-october-home-sales-numbers-9.7424208
  published: '2026-11-17T10:00:00+00:00'
  source: CBC Business
  category: Business & economy
  source_id: cbc-business
  authority: public_media
  publisher_id: cbc
  coverage: world
  why: CBC Business reported that Canadian home sales increased 0.3 per cent month
    over month in October 2026, while remaining 10.6 per cent below October 2025.
    CREA also reported an average home price of $656,200, down 3.1 per cent year over
    year.
  why_zh: CBC Business援引加拿大房地产协会数据称，2026年10月住宅销售环比增长0.3%，但同比下降10.6%。当月平均房价为656,200加元，同比下降3.1%。
- title: Panzhihua Water Plant Launches Integrated Microgrid
  title_zh: 四川首个一体化构网型微电网在攀枝花投运
  url: https://www.chinanews.com.cn/cj/2026/11-17/10733763.shtml
  published: '2026-11-17T21:39:27+08:00'
  source: 中国新闻网财经
  category: Business & economy
  source_id: chinanews-finance
  authority: news_agency
  publisher_id: chinanews-finance
  coverage: china
  why: China News Service reported that a microgrid combining hydropower, wind, solar,
    storage and direct current entered operation at the Bingcaogang Water Plant in
    Panzhihua. The project reportedly uses a 750-volt direct-current bus, can operate
    on- or off-grid, and has a reported supply reliability rate of 99.99%.
  why_zh: 中国新闻网报道，四川首个“水风光储直柔”一体化构网型微电网在攀枝花炳草岗水厂投运。该项目采用750伏直流母线，可在并网与离网模式间切换，报道所称供电可靠率为99.99%。
- title: Deep-learning model rebuilds gap-free sea surface temperature at 10 km scale
  title_zh: 深度学习模型实现10公里尺度无缺失海表温度重建
  url: https://www.cas.cn/syky/202611/t20261109_5123744.shtml
  published: '2026-11-17T11:22:00+08:00'
  source: 中国科学院科研进展
  category: Science & research
  source_id: cas-research
  authority: research_primary
  publisher_id: cas-research
  coverage: china
  why: Researchers at the Chinese Academy of Sciences' Institute of Oceanology report
    a deep-learning framework that fuses infrared and microwave satellite readings
    to reconstruct sea surface temperature without cloud-related gaps. The study,
    published in the ISPRS Journal of Photogrammetry and Remote Sensing, reports better
    agreement with reference products than the operational MUR product, including
    for a 2023 typhoon cold wake.
  why_zh: 中国科学院海洋研究所报告称，研究团队提出遥感跨尺度重建模型，结合红外与微波卫星数据生成无缺失海表温度。论文称，该模型在不同区域和季节的评估中优于MUR，并更准确恢复2023年台风达维冷尾迹的强冷却信号。
- title: One-Atom Layer Reveals Interfacial Quantum State
  title_zh: 单原子层界面揭示重费米子量子态
  url: https://www.sciencedaily.com/releases/2026/11/261115085554.htm
  published: '2026-11-17T01:25:39+00:00'
  source: ScienceDaily
  category: Science & research
  source_id: sciencedaily
  authority: established_newsroom
  publisher_id: sciencedaily
  coverage: world
  why: University of Osaka researchers report directly observing two heavy-fermion
    states at an ultrathin ytterbium-copper layer on copper. Their work identifies
    electronic hybridization across the interface, while practical control and uses
    remain future research goals.
  why_zh: 大阪大学研究人员在铜晶体表面的单原子层镱铜材料中，直接观察到两种重费米子态。研究将其归因于镱原子层与下方铜中传导电子的混合，实际控制与应用仍属后续研究。
- title: GitHub’s Agent Host Protocol for portable AI sessions
  title_zh: GitHub智能体宿主协议支持跨设备延续会话
  url: https://github.blog/engineering/engineering-principles/building-the-agent-host-protocol-for-sessions-that-continue-across-devices
  published: '2026-11-17T18:20:40+00:00'
  source: GitHub Engineering
  category: Research tools
  source_id: github-blog
  authority: developer_primary
  publisher_id: github-blog
  coverage: world
  why: GitHub Engineering reports that its Agent Host Protocol lets users continue
    an agent session across VS Code, the Copilot app, and cloud sandboxes. The article
    describes an open standard designed to preserve shared agents, history, and state
    across clients.
  why_zh: GitHub工程团队称，智能体宿主协议可让会话在VS Code、Copilot应用和云端沙箱之间延续。该开放标准让不同客户端共享智能体、历史记录与状态。
- title: Ask Maps adds trip planning and appointment search
  title_zh: Ask Maps新增行程规划与预约搜索
  url: https://blog.google/products-and-platforms/products/maps/ask-maps-holiday-travel-features-2026
  published: '2026-11-16T14:00:00+00:00'
  source: Google AI
  category: AI tools & model releases
  source_id: google-ai
  authority: developer_primary
  publisher_id: google-ai
  coverage: world
  why: Google says Ask Maps can build road-trip itineraries, surface route conditions,
    and search saved lists for current availability. Its appointment-finding and “Know
    before you go” features are launching first in the United States, while other
    features are available wherever Ask Maps is offered.
  why_zh: 谷歌表示，Ask Maps可生成道路旅行行程、显示路线状况，并搜索已保存列表中的即时可用信息。路线提示和预约搜索率先在美国推出，其他功能则在Ask
    Maps服务地区提供。
